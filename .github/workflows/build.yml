                <div class="item" style="text-align:start;margin-top:12px"><div class="b">${esc(wz.name||'—')} · ${wz.mode==='pm'?'🧭 '+t('modePM'):wz.mode==='sup'?'★ '+t('modeSup'):(wz.mrole==='res'?t('reserve'):t('modeMember'))}${wz.mode==='pm'?'':'\n'+esc(teamFull(wz.team))+(wz.mode==='member'&&wz.mrole==='res'?'':' · 📍'+esc(siteName(wz.site)))}\n${t('today')}: ${[0,1,2].map(k=>teamName(k)+' '+ICO[['D','N','O'][wz.cls[k]]]).join(' · ')}</div></div></div>`;}
            h+=`<div class="btns" style="margin-top:6px">${wz.step>0?`<button class="btn" id="wzB">${t('wBack')}</button>`:''}<button class="btn pri" id="wzX" style="flex:2">${wz.step===0?t('wStart'):wz.step===5?t('wFinish'):t('wNext')}</button></div>`;
            v.innerHTML=h;
            const q=(sel,fn)=>v.querySelectorAll(sel).forEach(b=>b.onclick=()=>fn(b));
