          package com.mohamed.shifts;

          import android.app.NotificationManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class NotifReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context ctx, Intent intent) {
                  String a = intent.getAction();
                  String key = intent.getStringExtra("key");
                  String title = intent.getStringExtra("title");
                  String body = intent.getStringExtra("body");
                  if (NotifCenter.FIRE.equals(a)) {
                      if (intent.getBooleanExtra("snoozed", false)) {
                          if (key != null) NotifCenter.post(ctx, key, title, body);
                      } else {
                          NotifCenter.fireDue(ctx);
                      }
                  } else if (NotifCenter.DONE.equals(a) || NotifCenter.SNOOZE.equals(a)) {
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null && key != null) nm.cancel(key.hashCode());
                      if (NotifCenter.DONE.equals(a) && key != null) NotifCenter.markDone(ctx, key);
                      if (NotifCenter.SNOOZE.equals(a)) NotifCenter.snooze(ctx, key, title, body);
                  }
              }
          }
