      - name: Create project files (2)
        run: |
          mkdir -p 'app/src/main/assets'
          cat > 'app/src/main/assets/index.html' <<'EOF_FILE'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>الورديات</title>
          <style>
          :root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--line:#334155;--text:#f1f5f9;--muted:#94a3b8;
          --day:#f59e0b;--dayBg:rgba(245,158,11,.16);--night:#818cf8;--nightBg:rgba(129,140,248,.18);
          --off:#34d399;--offBg:rgba(52,211,153,.15);--accent:#38bdf8;--danger:#f87171;--dangerBg:rgba(248,113,113,.15)}
          body.light{--bg:#f1f5f9;--card:#ffffff;--card2:#e8eef6;--line:#cbd5e1;--text:#0f172a;--muted:#64748b;
          --day:#b45309;--dayBg:rgba(245,158,11,.18);--night:#4f46e5;--nightBg:rgba(99,102,241,.14);
          --off:#047857;--offBg:rgba(16,185,129,.14);--accent:#0284c7;--danger:#dc2626;--dangerBg:rgba(220,38,38,.1)}
          *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
          body{font-family:'Cairo','Noto Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
          header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px}
          header h1{font-size:19px;font-weight:800}
          .ib{background:var(--card);border:0;color:var(--text);width:40px;height:40px;border-radius:12px;font-size:19px}
          main{padding:0 14px 96px;max-width:560px;margin:0 auto}
          .view{display:none}.view.on{display:block}
          nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
          nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:1px}
          nav button span{font-size:20px;line-height:1.2}
          nav button.on{color:var(--accent);font-weight:700}
          .card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
          .card h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
          .muted{color:var(--muted);font-size:13px}
          .hero{border-radius:22px;padding:18px;margin-bottom:12px;color:#fff;position:relative;overflow:hidden}
          .hero.D{background:linear-gradient(135deg,#b45309,#f59e0b)}.hero.N{background:linear-gradient(135deg,#312e81,#6366f1)}.hero.O{background:linear-gradient(135deg,#065f46,#10b981)}
          .hero .lbl{font-size:13px;opacity:.92}.hero .big{font-size:28px;font-weight:800;line-height:1.35}.hero .sub{font-size:14px;opacity:.95}
          .hero .ico{position:absolute;inset-inline-end:14px;top:8px;font-size:56px;opacity:.25}
          .badge{display:inline-block;background:rgba(255,255,255,.22);border-radius:20px;padding:1px 10px;font-size:12px;font-weight:700;margin-top:6px}
          .row{display:flex;gap:10px}.row>*{flex:1}
          .stat{background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:12px}
          .stat .k{font-size:12px;color:var(--muted)}.stat .v{font-size:15px;font-weight:700}
          .week{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
          .week::-webkit-scrollbar{display:none}
          .wd{min-width:60px;flex:0 0 auto;background:var(--card);border-radius:14px;padding:7px 3px;text-align:center}
          .wd .n{font-size:11px;color:var(--muted)}.wd .d{font-size:17px;font-weight:800}
          .wd .s{font-size:11px;font-weight:700;border-radius:8px;padding:1px 0}
          .wd.today{outline:2px solid var(--accent)}
          .D-t{color:var(--day)}.N-t{color:var(--night)}.O-t{color:var(--off)}
          .D-b{background:var(--dayBg)}.N-b{background:var(--nightBg)}.O-b{background:var(--offBg)}
          .task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
          .task:last-child{border-bottom:0}
          .task .ti{font-size:20px}.task .tx{flex:1}.task .st{font-size:13px;font-weight:700}
          .ok{color:var(--off)}.bad{color:var(--danger)}
          .alert{background:var(--dangerBg);color:var(--danger);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-weight:700;font-size:14px}
          .calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
          .calhead b{font-size:16px}
          .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
          .dn{text-align:center;font-size:11px;color:var(--muted);padding:3px 0}
          .c{aspect-ratio:1/1.15;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:0;font-family:inherit;color:var(--text);position:relative}
          .c small{font-size:10px;line-height:1}
          .c.today{outline:2px solid var(--accent)}.c.empty{background:transparent}
          .c .dot{position:absolute;top:4px;inset-inline-start:5px;width:6px;height:6px;border-radius:50%;background:var(--danger)}
          .legend{display:flex;justify-content:center;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
          .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}
          .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:700;font-size:14px;background:var(--card2);color:var(--text)}
          .btn.pri{background:var(--accent);color:#04263a}.btn.dang{background:var(--dangerBg);color:var(--danger)}
          .btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
          .btn.full{width:100%;margin-top:8px}
          label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
          input,select,textarea{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:15px}
          textarea{min-height:80px;resize:vertical}
          input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
          .chk{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px;color:var(--text);margin:0}
          .seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
          .seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:7px 0;border-radius:9px;font-size:13px}
          .seg button.on{background:var(--card);color:var(--text)}
          .item{background:var(--card2);border-radius:12px;padding:10px 12px;margin-bottom:8px}
          .item .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:14px}
          .item .b{font-size:13px;color:var(--muted);white-space:pre-wrap;margin-top:2px}
          .pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap}
          EOF_FILE

      - name: Create project files (3)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
          .tl{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border-radius:12px;padding:9px 12px;margin-bottom:8px;gap:8px}
          .tl.me{outline:2px solid var(--accent)}
          .shnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
          .shnav .btn{padding:8px 14px;font-size:18px}
          .shnav .mid{flex:1;text-align:center;background:var(--card);border-radius:12px;padding:6px}
          .shnav .mid b{display:block;font-size:15px}
          .sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
          .sheet.show{display:flex}
          .panel{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
          .panel h3{font-size:17px;margin-bottom:10px}
          .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 18px;border-radius:20px;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none}
          .toast.show{opacity:1}
          pre.rep{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:13px;max-height:50vh;overflow:auto}
          .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.btns .btn{flex:1}
          .sec{font-size:14px;font-weight:700;color:var(--muted);margin:4px 2px 8px}
          .empty-msg{text-align:center;color:var(--muted);font-size:13px;padding:10px}
          .search{margin-bottom:10px}
          .ecard{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
          .ecard .av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;background:var(--card2);flex:0 0 auto}
          .ecard .in{flex:1;min-width:0}.ecard .nm{font-weight:700;font-size:15px}
          .ecard .mt{font-size:12px;color:var(--muted)}
          .tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;background:var(--card2);color:var(--muted);margin-inline-start:4px}
          .tag.sup{background:var(--dayBg);color:var(--day)}.tag.res{background:var(--nightBg);color:var(--night)}.tag.warn{background:var(--dangerBg);color:var(--danger)}
          .qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
          .qa button{background:var(--card);border:0;border-radius:14px;padding:10px 2px;color:var(--text);font:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
          .qa button span{font-size:20px}
          .phead{background:var(--card);border-radius:20px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
          .phead .av{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;background:var(--card2)}
          .phead .nm{font-size:19px;font-weight:800}
          .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
          .tabs::-webkit-scrollbar{display:none}
          .tabs button{flex:0 0 auto;border:0;background:var(--card);color:var(--muted);font:inherit;font-weight:700;font-size:13px;padding:7px 14px;border-radius:20px}
          .tabs button.on{background:var(--accent);color:#04263a}
          .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
          .kpi{background:var(--card2);border-radius:12px;padding:8px;text-align:center}
          .kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--muted)}
          .warnbox{background:var(--dangerBg);color:var(--danger);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;margin-top:8px;white-space:pre-wrap}
          .okbox{background:var(--offBg);color:var(--off);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;margin-top:8px}
          .tbl{width:100%;border-collapse:collapse;font-size:12px}
          .tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
          .tbl th{color:var(--muted);font-weight:700}
          .tbl td:first-child,.tbl th:first-child{text-align:start}
          .scrollx{overflow-x:auto}
          .mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
          .mnav b{font-size:16px}
          .lvl{display:flex;gap:4px;margin:6px 0}.lvl i{flex:1;height:6px;border-radius:3px;background:var(--card2)}.lvl i.on{background:var(--danger)}
          </style>
          </head>
          <body>
          <header><h1 id="appTitle"></h1><button class="ib" id="gear">⚙️</button></header>
          <main>
            <section class="view" id="v-home"></section>
            <section class="view" id="v-cal"></section>
            <section class="view" id="v-emp"></section>
            <section class="view" id="v-person"></section>
            <section class="view" id="v-log"></section>
