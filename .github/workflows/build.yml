            return `<div class="kpis">${box(activePeople().length,t('kMembers'),0,'emp')}${box(si.sites.reduce((a,x)=>a+x.have,0)+'/'+si.sites.reduce((a,x)=>a+x.need,0),t('kOnDuty')+' '+ICO[cs.ty]+' '+teamName(si.team),0)}${box(absent,t('kAbsent'),absent)}${box(leave,t('kLeave'),0)}${box(sh,t('kShort'),sh,'cal')}${box(al,t('kAlerts'),al)}</div>`;}
