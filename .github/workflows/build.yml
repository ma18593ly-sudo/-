            v.querySelectorAll('[data-eodel]').forEach(b=>b.onclick=()=>confirmBox(t('confirmDel'),()=>{S.eom=S.eom.filter(x=>x.m!==b.dataset.eodel);save();rAdmin();}));}


          // ================= SITE PHONE =================
          function dutyNow(){const cs=curSlotNow();return{k:cs.k,ty:cs.ty,team:teamOn(parse(cs.k),cs.ty)};}
          let unlockedUntil=0;
          function requirePin(fn){const pin=(C().pin||'').trim();if(!pin||Date.now()<unlockedUntil){fn();return;}
            openSheet(`<h3>🔒 ${t('pinAsk')}</h3><input id="pinIn" type="password" inputmode="numeric" maxlength="6"><div class="btns"><button class="btn pri" id="pinOk">${t('yes')}</button><button class="btn" id="pinC">${t('cancel')}</button></div>`);
            $('pinC').onclick=closeSheet;$('pinOk').onclick=()=>{if($('pinIn').value.trim()===pin){unlockedUntil=Date.now()+10*6e4;closeSheet();fn();}else{toast(t('pinBad'));$('pinIn').value='';}};}
          const DEF_CK=[['cards','🪪 البطاقات','🪪 Cards'],['locks','🔑 الأقفال والبوابات','🔑 Locks & gates'],['torch','🔦 الكشاف','🔦 Torch'],['radio','📻 الجهاز','📻 Radio'],['book','📓 دفتر الأحوال','📓 Logbook'],['cams','📹 الكاميرات','📹 Cameras']];
          function ckItems(){const c=C();if(Array.isArray(c.ckItems)&&c.ckItems.length)return c.ckItems;return DEF_CK.map(([id,a,e])=>({id,name:L()==='ar'?a:e}));}
          function slotKey(){const d=dutyNow();return d.k+'_'+d.ty;}
          function siteCrew(){const d=dutyNow();return people().filter(p=>employedOn(p,d.k)&&teamAt(p,d.k)===d.team&&(p.role==='res'||siteAt(p,d.k)===(C().siteId||'compound'))).sort((a,b)=>RO[a.role]-RO[b.role]);}
          function remRow(r){const dn=!!S.remDone[r.key];return `<div class="item" style="display:flex;justify-content:space-between;align-items:center;gap:8px;${dn?'opacity:.55':''}"><div><div class="h" style="display:block">${esc(r.title)} <span class="muted">${hm(new Date(r.at).getHours()*60+new Date(r.at).getMinutes())}</span></div><div class="b">${esc(r.body)}</div></div>${dn?'<span class="ok">✓</span>':`<button class="btn sm pri" data-rem="${r.key}">${t('ok_')}</button>`}</div>`;}
          function rHomeSite(){const v=$('v-home'),d=dutyNow(),c=C();const tm=shiftTimes(parse(d.k),d.ty);const left=Math.max(0,Math.round((tm.e-now)/6e4));
            let h=`<div class="hero ${d.ty}" id="siteNow"><span class="cd">⏳ ${L()==='ar'?'ينتهي بعد ':'ends in '}${Math.floor(left/60)}:${pad(left%60)}</span><div class="ico">${ICO[d.ty]}</div><div class="lbl">📍 ${esc(siteName(c.siteId||'compound'))} · ${fmt(now)}</div>
              <div class="big">${t('nowDuty')}: ${esc(teamFull(d.team))}</div><div class="sub">${ICO[d.ty]} ${t(d.ty)} · ${shiftOf(parse(d.k),d.team).pos===1?t('first'):t('second')} · ${hm(tm.st)} ← ${hm(tm.st+720)}</div></div>`;
            h+=dueAlerts();
            const an=S.ann.filter(a=>a.active!==false).slice(-3).reverse();h+=an.map(a=>`<div class="alert" style="background:var(--dayBg);color:var(--text)">📢 ${esc(a.text)}</div>`).join('');
            const rs=reminders(tm.s.getTime(),tm.e.getTime());h+=`<div class="sec">⏰ ${t('todayRem')}</div>`+rs.map(remRow).join('');
            const ck=S.checks[slotKey()]||{},its=ckItems(),okN=its.filter(i=>ck[i.id]&&ck[i.id].ok===true).length,bad=its.filter(i=>ck[i.id]&&ck[i.id].ok===false);
            h+=`<div class="card" data-go="check" style="cursor:pointer"><h3>${t('ckTitle')} <span class="muted">${okN}/${its.length}</span></h3>${bad.length?`<div class="b bad">✗ ${bad.map(i=>esc(i.name)+(ck[i.id].note?' — '+esc(ck[i.id].note):'')).join('، ')}</div>`:''}</div>`;
            const at=S.attend[slotKey()]||{},crew=siteCrew();h+=`<div class="card" data-go="check" style="cursor:pointer"><h3>${t('attTitle')} <span class="muted">${crew.filter(p=>at[p.id]===true).length}/${crew.filter(p=>p.role!=='res').length}</span></h3><div class="muted">${crew.map(p=>(at[p.id]===true?'✓ ':at[p.id]===false?'✗ ':'')+esc(pName(p.id))+(p.role==='res'?' ('+t('reserve')+')':'')).join(' · ')}</div></div>`;
            const id=d.k+'_'+d.ty,g=S.logs[id]||{};h+=`<button class="btn pri full" data-log="${id}">📝 ${t('openLog')}</button>`;
            v.innerHTML=h;bindCommon(v);bindDue(v);v.querySelectorAll('[data-rem]').forEach(b=>b.onclick=()=>{S.remDone[b.dataset.rem]=Date.now();save();rHome();});}
          function rCheck(){const v=$('v-check'),k=slotKey(),d=dutyNow();if(!S.checks[k])S.checks[k]={};if(!S.attend[k])S.attend[k]={};const ck=S.checks[k],at=S.attend[k];
            let h=`<div class="card"><h3>${t('ckTitle')} <span class="muted">${ICO[d.ty]} ${esc(teamFull(d.team))}</span></h3>`+ckItems().map(i=>{const x=ck[i.id]||{};return `<div class="tl" style="flex-wrap:wrap"><span>${esc(i.name)}</span><span style="display:flex;gap:6px"><button class="btn sm ${x.ok===true?'pri':''}" data-ck="${i.id}" data-v="1">✓</button><button class="btn sm ${x.ok===false?'dang':''}" data-ck="${i.id}" data-v="0">✗</button></span>${x.ok===false?`<input data-ckn="${i.id}" placeholder="${t('ckNote')}" value="${esc(x.note||'')}" style="margin-top:6px">`:''}</div>`;}).join('')+'</div>';
          EOF_FILE

      - name: Create project files (30)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
            h+=`<div class="card"><h3>${t('attTitle')}</h3>`+siteCrew().map(p=>`<div class="tl"><span>${p.role==='sup'?'★ ':''}${esc(pName(p.id))}${p.role==='res'?' <span class="tag res">'+t('reserve')+'</span>':''}</span><span style="display:flex;gap:6px"><button class="btn sm ${at[p.id]===true?'pri':''}" data-att="${p.id}" data-v="1">✓</button><button class="btn sm ${at[p.id]===false?'dang':''}" data-att="${p.id}" data-v="0">✗</button></span></div>`).join('')+'</div>';
            v.innerHTML=h;
            v.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{const id=b.dataset.ck;ck[id]=Object.assign(ck[id]||{},{ok:b.dataset.v==='1'});save();rCheck();});
            v.querySelectorAll('[data-ckn]').forEach(i=>i.onchange=()=>{ck[i.dataset.ckn].note=i.value.trim();save();});
