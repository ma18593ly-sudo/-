          package com.mohamed.shifts;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.drawable.Icon;
          import android.os.Build;
          import java.util.HashSet;
          import java.util.Set;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /** Stores the reminder list computed by the web app and fires one alarm at a time. */
          public final class NotifCenter {
              static final String PREFS = "notif";
              static final String CH = "reminders";
              static final String FIRE = "com.mohamed.shifts.NOTIF_FIRE";
              static final String DONE = "com.mohamed.shifts.NOTIF_DONE";
              static final String SNOOZE = "com.mohamed.shifts.NOTIF_SNOOZE";

              private NotifCenter() {}

              static SharedPreferences prefs(Context c) { return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE); }

              public static void setList(Context ctx, String json) {
                  prefs(ctx).edit().putString("list", json).apply();
                  scheduleNext(ctx);
                  try { WidgetUpdater.updateAll(ctx); } catch (Exception e) { /* widget refresh is best-effort */ }
              }

              private static JSONArray list(Context ctx) {
                  try { return new JSONArray(prefs(ctx).getString("list", "[]")); } catch (Exception e) { return new JSONArray(); }
              }

              private static long[] ats(JSONArray a) {
                  long[] r = new long[a.length()];
                  for (int i = 0; i < r.length; i++) {
                      try { r[i] = a.getJSONObject(i).getLong("at"); } catch (Exception e) { r[i] = 0; }
                  }
                  return r;
              }

              /** Post every reminder that became due since the last run, then arm the next alarm. */
              static void fireDue(Context ctx) {
                  long now = System.currentTimeMillis();
                  long lastAt = prefs(ctx).getLong("lastAt", 0);
                  JSONArray a = list(ctx);
                  long[] at = ats(a);
                  long max = lastAt;
                  for (int i : NotifLogic.due(at, lastAt, now, 6 * 3600000L)) {
                      try {
                          JSONObject o = a.getJSONObject(i);
                          post(ctx, o.optString("key"), o.optString("title"), o.optString("body"));
                      } catch (Exception e) {
                          // skip malformed item
                      }
                  }
                  for (long x : at) if (x > max && x <= now + 1000) max = x;
                  prefs(ctx).edit().putLong("lastAt", max).apply();
                  scheduleNext(ctx);
              }

              public static void scheduleNext(Context ctx) {
                  AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  PendingIntent cur = fireIntent(ctx, 101, null);
                  am.cancel(cur);
                  long now = System.currentTimeMillis();
                  long lastAt = prefs(ctx).getLong("lastAt", 0);
                  long[] at = ats(list(ctx));
                  int i = NotifLogic.next(at, lastAt);
                  if (i >= 0) setAlarm(am, Math.max(at[i], now + 1000), cur);
              }

              private static PendingIntent fireIntent(Context ctx, int code, JSONObject o) {
                  Intent i = new Intent(ctx, NotifReceiver.class).setAction(FIRE);
                  if (o != null) {
                      i.putExtra("key", o.optString("key"));
                      i.putExtra("title", o.optString("title"));
                      i.putExtra("body", o.optString("body"));
                      i.putExtra("at", o.optLong("at"));
                  }
                  return PendingIntent.getBroadcast(ctx, code, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void setAlarm(AlarmManager am, long at, PendingIntent pi) {
                  try {
                      if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) {
                          am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                      } else {
                          am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                      }
                  } catch (SecurityException e) {
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                  }
              }

              static void ensureChannel(Context ctx) {
                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  NotificationChannel ch = new NotificationChannel(CH, "تذكيرات الوردية", NotificationManager.IMPORTANCE_HIGH);
                  ch.setDescription("الإنارة، تغيير الأوراق، الأقفال، البصمة");
                  nm.createNotificationChannel(ch);
              }

              private static PendingIntent action(Context ctx, String act, String key, String title, String body, int code) {
                  Intent i = new Intent(ctx, NotifReceiver.class).setAction(act);
                  i.putExtra("key", key);
                  i.putExtra("title", title);
                  i.putExtra("body", body);
                  return PendingIntent.getBroadcast(ctx, code, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void post(Context ctx, String key, String title, String body) {
                  ensureChannel(ctx);
                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null || key == null) return;
                  int id = key.hashCode();
                  Intent open = new Intent(ctx, MainActivity.class).setAction(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                  PendingIntent openPi = PendingIntent.getActivity(ctx, id, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Icon ic = Icon.createWithResource(ctx, R.drawable.ic_notif);
                  Notification.Builder b = new Notification.Builder(ctx, CH)
                          .setSmallIcon(R.drawable.ic_notif)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(new Notification.BigTextStyle().bigText(body))
                          .setAutoCancel(true)
                          .setContentIntent(openPi);
                  if (!"openapp".equals(key)) {
                      b.addAction(new Notification.Action.Builder(ic, "تم ✓", action(ctx, DONE, key, title, body, id * 2)).build());
                      b.addAction(new Notification.Action.Builder(ic, "ذكّرني بعد 10 د", action(ctx, SNOOZE, key, title, body, id * 2 + 1)).build());
                  }
                  try {
                      nm.notify(id, b.build());
                  } catch (SecurityException e) {
                      // notification permission not granted
                  }
              }

