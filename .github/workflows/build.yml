          function openDay(d){let h=`<h3>${fmt(d)}</h3>`+teamsForDay(d);
            const ev=eventsOn(d);if(ev.length){h+=`<div class="sec">${t('events')}</div>`+ev.map(e=>`<div class="item"><div class="h">${esc(evText(e))}</div>${e.note?`<div class="b">${esc(e.note)}</div>`:''}</div>`).join('');}
            ['D','N'].forEach(ty=>{const id=shiftId(d,ty);if(shiftOf(d,C().myTeam).type===ty){const g=S.logs[id];
              h+=`<div class="item"><div class="h">${ICO[ty]} ${t(ty)} — ${t('log')}<button class="btn sm pri" data-log="${id}">${t('openLog')}</button></div>`;
              if(g&&hasLog(id))h+=`<div class="b">${g.inc&&g.inc.length?t('incCount')+': '+g.inc.length+'\n':''}${g.notes?esc(g.notes):''}</div>`;h+='</div>';}});
            h+=`<button class="btn pri full" id="dClose">${t('close')}</button>`;openSheet(h);$('dClose').onclick=closeSheet;bindCommon($('panel'));
            $('panel').querySelectorAll('[data-log]').forEach(e=>e.addEventListener('click',closeSheet));}

          function rCal(){const v=$('v-cal');let h=`<div class="card"><div class="calhead"><button class="btn" id="cP">${L()==='ar'?'›':'‹'}</button><b>${MONTHS[L()][calView.getMonth()]} ${calView.getFullYear()}</b><button class="btn" id="cN">${L()==='ar'?'‹':'›'}</button></div><div class="grid">`;
            SDAYS[L()].forEach(n=>h+=`<div class="dn">${n}</div>`);
