            $('panel').querySelectorAll('[data-ndone]').forEach(b=>b.onclick=()=>{const n=S.notes.find(x=>x.id===b.dataset.ndone);if(n)n.done=true;save();notesSheet();updBell();});
            $('panel').querySelectorAll('[data-ndel]').forEach(b=>b.onclick=()=>{S.notes=S.notes.filter(x=>x.id!==b.dataset.ndel);save();notesSheet();updBell();});}
          // ---- training ----
