              h+=`<div class="card"><h3>${t('ships')}</h3>`+(S.ships.length?S.ships.slice().sort((a,b)=>a.date<b.date?1:-1).map(sh=>`<div class="item"><div class="h"><span>📦 ${fmt(parse(sh.date))}</span><span style="white-space:nowrap"><button class="btn sm" data-shsh="${sh.id}">📤</button> <button class="btn sm dang" data-shdel="${sh.id}">✕</button></span></div><div class="b">${sh.lines.map(l=>`${esc(itemN(l.it))}: ${l.q.reduce((a,b)=>a+b,0)} → ${l.q.join(' / ')}`).join('\n')}${sh.note?'\n'+esc(sh.note):''}</div></div>`).join(''):`<div class="empty-msg">${t('nothing')}</div>`)+`</div>`;
