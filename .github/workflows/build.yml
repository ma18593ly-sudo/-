      - name: Create project files (17)
        run: |
          mkdir -p 'app/src/main/java/com/mohamed/shifts'
          cat > 'app/src/main/java/com/mohamed/shifts/MainActivity.java' <<'EOF_FILE'
          package com.mohamed.shifts;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.net.Uri;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;
              private WebView printView;
              private ValueCallback<Uri[]> fileCb;
              private static final int PICK = 42;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  boolean dark = isDark();
                  applyBars(dark ? "#0f172a" : "#f1f5f9", !dark);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor(dark ? "#0f172a" : "#f1f5f9"));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          try {
                              startActivityForResult(Intent.createChooser(i, null), PICK);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
              }

              boolean isDark() {
                  int m = getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK;
                  return m == Configuration.UI_MODE_NIGHT_YES;
              }

              void applyBars(String color, boolean light) {
                  int c = Color.parseColor(color);
                  getWindow().setStatusBarColor(c);
                  getWindow().setNavigationBarColor(c);
                  View d = getWindow().getDecorView();
                  int f = d.getSystemUiVisibility();
                  int mask = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR | View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                  f = light ? (f | mask) : (f & ~mask);
                  d.setSystemUiVisibility(f);
              }

              @Override
              public void onConfigurationChanged(Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  if (web != null) web.evaluateJavascript("window.onSysTheme&&window.onSysTheme()", null);
              }

              @Override
              public void onBackPressed() {
                  if (web == null) { finish(); return; }
                  web.evaluateJavascript("(window.handleBack&&window.handleBack())?'1':'0'", value -> {
                      if (value == null || !value.contains("1")) finish();
                  });
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PICK && fileCb != null) {
                      Uri[] r = null;
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) r = new Uri[]{data.getData()};
                      fileCb.onReceiveValue(r);
                      fileCb = null;
                  }
              }

              void doShareFile(String name, String mime, String content) {
                  try {
                      String safe = name.replaceAll("[^A-Za-z0-9._-]", "_");
                      File dir = new File(getCacheDir(), "shared");
                      if (!dir.exists()) dir.mkdirs();
                      File f = new File(dir, safe);
                      try (FileOutputStream out = new FileOutputStream(f)) {
                          out.write(content.getBytes(StandardCharsets.UTF_8));
                      }
                      Uri uri = Uri.parse("content://" + ShareProvider.AUTHORITY + "/" + safe);
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType(mime);
                      i.putExtra(Intent.EXTRA_STREAM, uri);
                      i.setClipData(ClipData.newRawUri(safe, uri));
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      Intent ch = Intent.createChooser(i, null);
                      ch.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(ch);
                  } catch (Exception e) {
                      web.evaluateJavascript("console.error('share failed')", null);
                  }
              }

              void doPrint(String html, String title) {
                  printView = new WebView(this);
                  printView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                          PrintDocumentAdapter adapter = view.createPrintDocumentAdapter(title);
                          pm.print(title, adapter, new PrintAttributes.Builder().build());
                      }
                  });
                  printView.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
              }

              class Bridge {
                  @JavascriptInterface
                  public void share(String text) {
                      runOnUiThread(() -> {
                          Intent i = new Intent(Intent.ACTION_SEND);
                          i.setType("text/plain");
                          i.putExtra(Intent.EXTRA_TEXT, text);
                          startActivity(Intent.createChooser(i, null));
                      });
                  }

                  @JavascriptInterface
                  public void shareFile(String name, String mime, String content) {
                      runOnUiThread(() -> doShareFile(name, mime, content));
                  }

                  @JavascriptInterface
                  public void copy(String text) {
                      runOnUiThread(() -> {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(ClipData.newPlainText("shifts", text));
                      });
                  }

                  @JavascriptInterface
                  public boolean isDark() {
          EOF_FILE
          cat >> 'app/src/main/java/com/mohamed/shifts/MainActivity.java' <<'EOF_FILE'
                      return MainActivity.this.isDark();
                  }

                  @JavascriptInterface
                  public void setBars(String color, boolean light) {
                      runOnUiThread(() -> applyBars(color, light));
                  }

                  @JavascriptInterface
                  public void print(String html, String title) {
                      runOnUiThread(() -> doPrint(html, title));
                  }
              }
          }
          EOF_FILE

      - name: Create project files (18)
        run: |
