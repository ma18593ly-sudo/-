      - name: Create project files (28)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
            let el=act.filter(p=>!set.includes(p.id));const reset=!el.length;if(reset)el=act;return{el,reset};}
          function rAdmin(){const v=$('v-admin');if(!evalM)evalM=ymOf(now);if(!eomM)eomM=ymOf(now);const ar=L()==='ar';
