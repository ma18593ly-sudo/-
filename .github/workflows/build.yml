          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Shifts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Shifts-APK
          path: Shifts.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shifts v3.0 build ${{ github.run_number }}
          files: Shifts.apk
