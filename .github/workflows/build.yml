      - name: Create project files (27)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
          function allTrainings(){const o=[];S.trainings.forEach(tr=>tr.items.forEach(it=>o.push({date:it.date,team:it.team,time:tr.time,tid:tr.id})));return o.sort((a,b)=>a.date<b.date?-1:1);}
          const trainingsOn=k=>allTrainings().filter(x=>x.date===k);
          function trainPlan(start){return [0,1,2].map(tm=>{let k=start;for(let i=0;i<14;i++){if(teamShift(tm,kAdd(k,-1))==='N'&&teamShift(tm,k)==='O')return{team:tm,date:k};k=kAdd(k,1);}return{team:tm,date:start};}).sort((a,b)=>a.date<b.date?-1:1);}
          function timeWords(hhmm){const[h,m]=hhmm.split(':').map(Number);const ar=L()==='ar';const h12=h%12||12;const pm=h>=12;return ar?`${h12}${m?':'+pad(m):''} ${pm?'مساءً':'صباحاً'}`:`${h12}${m?':'+pad(m):''} ${pm?'PM':'AM'}`;}
          function trainMsg(tr){const d0=parse(tr.items[0].date);const mn=MONTHS[L()][d0.getMonth()];const dm=k=>pad(parse(k).getDate())+'/'+pad(parse(k).getMonth()+1);
            if(L()==='ar')return `السلام عليكم،\n${tr.change?'تغيير في مواعيد التدريب للجميع.\n':''}التدريب الشهري المقرر في شهر ${mn} حيكون على النحو الآتي:\n\n`+tr.items.map(x=>`يوم ${DAYS.ar[parse(x.date).getDay()]} الموافق ${dm(x.date)} - الفريق-${pad(x.team+1)}.`).join('\n\n')+`\n\nالحضور على تمام الساعة ${timeWords(tr.time)}،\nموفقين إن شاء الله`;
            return `Hello all,\n${tr.change?'Training schedule has changed.\n':''}This month's training (${mn}) will be as follows:\n\n`+tr.items.map(x=>`${DAYS.en[parse(x.date).getDay()]} ${dm(x.date)} - Team-${pad(x.team+1)}.`).join('\n\n')+`\n\nAttendance at ${timeWords(tr.time)} sharp.\nGood luck`;}
          function trainForm(){let st=ymd(now),tm='09:00',ch=false,items=trainPlan(st);
            const draw=()=>{const tr={items,time:tm,change:ch};openSheet(`<h3>${t('trainGen')}</h3><p class="muted">${t('trainHint')}</p><div class="row"><div><label>${t('trainStart')}</label><input type="date" id="tgS" value="${st}"></div><div><label>${t('trainTime')}</label><input type="time" id="tgT" value="${tm}"></div></div>
              <label class="chk" style="margin-top:6px"><input type="checkbox" id="tgC" ${ch?'checked':''}>${t('trainChange')}</label>`+
              items.map((x,i)=>`<div class="tl"><b>${esc(teamFull(x.team))}</b><input type="date" data-tgi="${i}" value="${x.date}" style="width:auto"></div>`).join('')+
              `<label>${t('trainMsg')}</label><pre class="rep">${esc(trainMsg(tr))}</pre><div class="btns"><button class="btn pri" id="tgOk">${t('save')}</button><button class="btn" id="tgCp">${t('copy')}</button><button class="btn" id="tgSh">${t('share')}</button></div><button class="btn full" id="tgX">${t('cancel')}</button>`);
              $('tgS').onchange=e=>{if(e.target.value){st=e.target.value;items=trainPlan(st);draw();}};$('tgT').onchange=e=>{if(e.target.value){tm=e.target.value;draw();}};$('tgC').onchange=e=>{ch=e.target.checked;draw();};
              $('panel').querySelectorAll('[data-tgi]').forEach(i=>i.onchange=()=>{if(i.value){items[+i.dataset.tgi].date=i.value;items.sort((a,b)=>a.date<b.date?-1:1);draw();}});
              $('tgCp').onclick=()=>copyText(trainMsg(tr));$('tgSh').onclick=()=>shareText(trainMsg(tr));$('tgX').onclick=closeSheet;
              $('tgOk').onclick=()=>{S.trainings.push({id:uid(),m:items[0].date.slice(0,7),time:tm,change:ch,items:items.map(x=>({team:x.team,date:x.date}))});save();closeSheet();render();toast(t('saved'));};};draw();}
          // ---- stock ----
          const itemN=id=>{const it=C().items.find(x=>x.id===id);return it?it.name:id;};
          function shipText(sh){return `📦 ${fmtK(sh.date)}: `+sh.lines.map(l=>`${itemN(l.it)} ${l.q.reduce((a,b)=>a+b,0)} (${[0,1,2].map(i=>teamName(i)+' '+l.q[i]).join('، ')})`).join(' | ');}
          function shipMsg(sh){return `📦 ${fmt(parse(sh.date))}\n`+sh.lines.map(l=>`${itemN(l.it)}: ${l.q.reduce((a,b)=>a+b,0)}\n`+[0,1,2].map(i=>`  - ${teamFull(i)}: ${l.q[i]}`).join('\n')).join('\n')+(sh.note?'\n'+sh.note:'');}
          function shipForm(){const its=C().items;if(!its.length){toast(t('noItems'));return;}const rows={};its.forEach(it=>rows[it.id]={tot:'',q:['','',''],touched:false});
            const splitEq=n=>{const b=Math.floor(n/3),r=n%3;return [0,1,2].map(i=>b+(i<r?1:0));};
            openSheet(`<h3>${t('newShip')}</h3><label>${t('shipDate')}</label><input type="date" id="shD" value="${ymd(now)}">`+its.map(it=>`<div class="item"><div class="row" style="align-items:center"><b style="flex:2">${esc(it.name)}</b><input type="number" inputmode="numeric" data-tot="${it.id}" placeholder="${t('totalQ')}" style="flex:1"></div><div class="row" style="margin-top:6px">${[0,1,2].map(i=>`<div><label style="margin:0">${esc(teamName(i))}</label><input type="number" inputmode="numeric" data-q="${it.id}|${i}"></div>`).join('')}</div></div>`).join('')+
              `<label>${t('note')}</label><input id="shN"><div class="btns"><button class="btn pri" id="shOk">${t('save')}</button><button class="btn" id="shC">${t('cancel')}</button></div>`);
            $('panel').querySelectorAll('[data-tot]').forEach(i=>i.oninput=()=>{const id=i.dataset.tot,n=Math.max(0,parseInt(i.value,10)||0);const q=splitEq(n);q.forEach((v,ix)=>{$('panel').querySelector(`[data-q="${id}|${ix}"]`).value=n?v:'';});});
            $('panel').querySelectorAll('[data-q]').forEach(i=>i.oninput=()=>{const id=i.dataset.q.split('|')[0];const sum=[0,1,2].reduce((a,ix)=>a+(parseInt($('panel').querySelector(`[data-q="${id}|${ix}"]`).value,10)||0),0);$('panel').querySelector(`[data-tot="${id}"]`).value=sum||'';});
            $('shC').onclick=closeSheet;
            $('shOk').onclick=()=>{const lines=its.map(it=>({it:it.id,q:[0,1,2].map(ix=>Math.max(0,parseInt($('panel').querySelector(`[data-q="${it.id}|${ix}"]`).value,10)||0))})).filter(l=>l.q.some(x=>x>0));
              if(!lines.length){toast(t('totalQ'));return;}const sh={id:uid(),date:$('shD').value||ymd(now),lines,note:$('shN').value.trim()};S.ships.push(sh);save();
              openSheet(`<h3>✓ ${t('saved')}</h3><pre class="rep">${esc(shipMsg(sh))}</pre><div class="btns"><button class="btn" id="smC">${t('copy')}</button><button class="btn" id="smS">${t('share')}</button></div><button class="btn pri full" id="smX">${t('close')}</button>`);
              $('smC').onclick=()=>copyText(shipMsg(sh));$('smS').onclick=()=>shareText(shipMsg(sh));$('smX').onclick=()=>{closeSheet();render();};};}
          // ---- admin view ----
          let adminSub='train',evalM=null,eomM=null;
          function eligibleFor(m){const act=activePeople();let set=[];S.eom.filter(x=>x.m<m).sort((a,b)=>a.m<b.m?-1:1).forEach(w=>{set.push(w.p);if(act.every(p=>set.includes(p.id)))set=[];});
