          stock:'Stock',items2:'Items',addItem2:'+ Item',unit:'Unit',newShip:'📦 New delivery',shipDate:'Arrival date',totalQ:'Qty',split:'Split',ships:'Deliveries',monthTot:'Month total',noItems:'Add items first',
          evals:'Evaluation',evalMonth:'Evaluation for',score:'Score %',g_weak:'Weak',g_ok:'Acceptable',g_good:'Good',g_vgood:'Very good',g_exc:'Excellent',
          eom:'Employee of the month',eomPick:'Pick',eomWinner:'🏆 Employee of the month',eomNoms:'Nominees',eomCycle:'left in cycle',eomHist:'Past winners',eomReset:'Everyone has won — new cycle',
          notes2:'Reminders',addNote:'+ Reminder',noteText:'Reminder text',due:'Due',upcomingN:'Upcoming',doneN:'Done',noNotes2:'No reminders',trainSoon:'🎓 Training soon'}};
          const DAYS={ar:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],en:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']};
          const SDAYS={ar:['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
          const MONTHS={ar:['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],en:['January','February','March','April','May','June','July','August','September','October','November','December']};
          const ICO={D:'☀️',N:'🌙',O:'🛋️'};
          const INC=['security','fire','fault','medical','other'];
          const WL=['verbal','written','deduct','final'];

          // ================= state =================
          const KEY='shiftapp_v2';
          const DEF_CFG={lang:'ar',theme:'auto',myTeam:0,myName:'',start:'08:00',fpStart:'07:30',fpEnd:'07:45',cards:22,logFrom:'05:00',logTo:'06:00',anchor:'2026-11-13',minRest:12,mode:null,meId:null,teamNames:['','',''],off:null,items:[{id:'coffee',name:'قهوة',unit:''},{id:'cups',name:'أكواب',unit:''}],eomFrom:'',sites:[{id:'compound',name:'Compound'},{id:'chancery',name:'Chancery'}],
            uniItems:[{id:'shirt',name:''},{id:'pants',name:''},{id:'shoes',name:''},{id:'coat',name:''},{id:'cap',name:''}],
            people:[{id:'t0m0',name:'مصعب',team:0,role:'sup',hist:[{team:0,from:'2000-01-01'}]},{id:'t1m0',name:'سالم',team:1,role:'sup',hist:[{team:1,from:'2000-01-01'}]},{id:'t2m0',name:'حاتم',team:2,role:'sup',hist:[{team:2,from:'2000-01-01'}]}]};
          const clone=x=>JSON.parse(JSON.stringify(x));
          let S={cfg:clone(DEF_CFG),logs:{},events:[],uni:[],warns:[],asg:[],trainings:[],ships:[],evals:[],eom:[],notes:[],v:4};
          function normalize(x){const st={cfg:Object.assign(clone(DEF_CFG),x.cfg||{}),logs:x.logs||{},events:x.events||[],uni:x.uni||[],warns:x.warns||[],asg:x.asg||[],trainings:x.trainings||[],ships:x.ships||[],evals:x.evals||[],eom:x.eom||[],notes:x.notes||[],v:4};
            const c=st.cfg;
            if(!(x.cfg&&Array.isArray(x.cfg.people))){ // from v2.0/2.1 slot model
              const used=new Set();st.events.forEach(e=>{used.add(e.p1);used.add(e.p2);});st.uni.forEach(u=>used.add(u.p));
              const teams=(x.cfg&&x.cfg.teams)||[{m:['مصعب']},{m:['سالم']},{m:['حاتم']}];const ps=[];
              teams.forEach((tm,i)=>tm.m.forEach((n,j)=>{const id='t'+i+'m'+j;if((n||'').trim()||used.has(id))ps.push({id,name:(n||'').trim(),team:i,role:j===0?'sup':'mem',hist:[{team:i,from:'2000-01-01'}]});}));
              if(((x.cfg&&x.cfg.reserve)||'').trim()||used.has('res'))ps.push({id:'res',name:((x.cfg&&x.cfg.reserve)||'').trim(),team:c.myTeam||0,role:'res',hist:[{team:c.myTeam||0,from:'2000-01-01'}]});
              c.people=ps;}
            c.people.forEach(p=>{ // v2.2 → v3
              if(!p.role)p.role=p.team==='res'?'res':(p.sup?'sup':'mem');delete p.sup;
              if(p.team==='res')p.team=c.myTeam||0;
              p.hist=(p.hist&&p.hist.length?p.hist:[{team:p.team,from:'2000-01-01'}]).map(h=>({team:h.team==='res'?(c.myTeam||0):h.team,from:h.from,site:h.site}));
              if(!p.site)p.site='compound';});
            if(!c.sites||!c.sites.length)c.sites=clone(DEF_CFG.sites);
            if(!Array.isArray(c.teamNames))c.teamNames=['','',''];
            if(c.meId&&!c.people.some(p=>p.id===c.meId))c.meId=null;
            delete c.teams;delete c.reserve;
            // events v2 → v3
            st.events=st.events.map(e=>{e=Object.assign({},e);
              if(e.type==='coverage'){const ab=findP(st,e.p2);const tm=ab?teamAtP(ab,e.from):0;let ty=shiftOfC(c,parseD(e.from),tm).type;if(ty==='O')ty='D';
                return {id:e.id,type:'absence',p1:e.p2,from:e.from,to:e.from,cov:e.p1,st:ty,note:e.note||''};}
              if(e.type==='swap'&&!e.st){const b=findP(st,e.p2);const tm=b?teamAtP(b,e.from):0;let ty=shiftOfC(c,parseD(e.from),tm).type;if(ty==='O')ty='D';e.st=ty;}
              if(!e.to)e.to=e.from;return e;});
            // v3.2 → v3.3: covers & call-ins become assignments
            const ev2=[];st.events.forEach(e=>{
              if(e.type==='callout'){st.asg.push({id:e.id,k:e.from,type:e.st||'D',team:e.team!=null?+e.team:0,site:e.site||'compound',pid:e.p1,for:null,note:e.note||''});return;}
              if(e.type==='absence'&&e.cov){const ab=findP(st,e.p1);let k=e.from;while(k<=e.to){const tm=ab?teamAtP(ab,k):0;let ty=e.from===e.to&&e.st?e.st:shiftOfC(st.cfg,parseD(k),tm).type;
                  if(ty!=='O'){let si=ab?(ab.role==='res'?'compound':siteOfP(ab,k)):'compound';st.asg.push({id:e.id+'_'+k,k,type:ty,team:tm,site:si,pid:e.cov,for:e.p1,note:''});}
                  const d=parseD(k);d.setDate(d.getDate()+1);k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
                delete e.cov;delete e.st;}
              ev2.push(e);});
            st.events=ev2;
            return st;}
          function siteOfP(p,k){let st=p.site||'compound';const h=(p.hist||[]).filter(x=>x.site).sort((a,b)=>a.from<b.from?-1:1);if(h.length){st=h[0].site;h.forEach(x=>{if(x.from<=k)st=x.site;});}return st;}
          function findP(st,id){return st.cfg.people.find(p=>p.id===id);}
          function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
          const C=()=>S.cfg;
          const L=()=>C().lang;
          const t=(k,vars)=>{let s=(T[L()]&&T[L()][k]!=null)?T[L()][k]:(T.ar[k]!=null?T.ar[k]:k);if(vars)Object.keys(vars).forEach(v=>s=s.replace('{'+v+'}',vars[v]));return s;};

          // ================= helpers =================
          const $=id=>document.getElementById(id);
          const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const pad=n=>String(n).padStart(2,'0');
          EOF_FILE

      - name: Create project files (8)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
          const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
          const mins=s=>{const[a,b]=(s||'0:0').split(':').map(Number);return a*60+(b||0);};
          const hm=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);};
          const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
          function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
          const parse=parseD;
          const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
          const kAdd=(k,n)=>ymd(addDays(parse(k),n));
          const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
          const utc=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
          const mod=(a,n)=>((a%n)+n)%n;
          const fmt=d=>DAYS[L()][d.getDay()]+' '+d.getDate()+' '+MONTHS[L()][d.getMonth()];
          const fmtS=d=>SDAYS[L()][d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);
          const fmtK=k=>fmtS(parse(k));
          const PAT=['D','D','N','N','O','O'],OFF=[0,4,2];
          const offOf=(c,team)=>(Array.isArray(c.off)&&c.off.length===3?c.off:OFF)[team];
          function shiftOfC(c,date,team){const diff=Math.round((utc(date)-utc(parseD(c.anchor)))/864e5);const i=mod(diff+offOf(c,team),6);return{type:PAT[i],pos:i%2===0?1:2};}
          const shiftOf=(date,team)=>shiftOfC(C(),date,team);
          function teamOn(date,type){for(let k=0;k<3;k++)if(shiftOf(date,k).type===type)return k;return -1;}
          function shiftTimes(date,type){const st=mins(C().start)+(type==='N'?720:0);const s=new Date(dayStart(date).getTime()+st*6e4);return{s,e:new Date(s.getTime()+720*6e4),fpS:mins(C().fpStart)+(type==='N'?720:0),fpE:mins(C().fpEnd)+(type==='N'?720:0),st};}
          const sStart=(k,type)=>shiftTimes(parse(k),type).s, sEnd=(k,type)=>shiftTimes(parse(k),type).e;
          const shiftId=(date,type)=>ymd(date)+'_'+type;
          function idToShift(id){const[d,ty]=id.split('_');return{date:parse(d),type:ty};}
          function myShiftAround(now){for(let k=-1;k<14;k++){const d=addDays(now,k),s=shiftOf(d,C().myTeam);if(s.type==='O')continue;const tm=shiftTimes(d,s.type);if(tm.e>now)return Object.assign({date:d,type:s.type,pos:s.pos},tm);}return null;}
          function myShiftStep(date,type,step){let d=dayStart(date);for(let k=0;k<20;k++){if(type==='D'&&step>0)type='N';else if(type==='N'&&step<0)type='D';else{d=addDays(d,step);type=step>0?'D':'N';}if(shiftOf(d,C().myTeam).type===type)return{date:d,type};}return null;}
          function lastOrCurrentMyShift(now){const n=myShiftAround(now);if(n&&n.s<=now)return{date:n.date,type:n.type};let d=dayStart(now);for(let k=0;k<10;k++){for(const ty of['N','D']){const dd=addDays(d,-k);if(shiftOf(dd,C().myTeam).type===ty&&shiftTimes(dd,ty).e<=now)return{date:dd,type:ty};}}return n;}

          // ================= people =================
          const people=()=>C().people;
          const P=id=>people().find(p=>p.id===id);
          function teamAtP(p,k){let tm=p.team;const h=(p.hist||[]).slice().sort((a,b)=>a.from<b.from?-1:1);if(h.length){tm=h[0].team;h.forEach(x=>{if(x.from<=k)tm=x.team;});}return tm;}
          const teamAt=teamAtP;
          function siteAt(p,k){if(p.role==='res')return 'both';let st=p.site||'compound';const h=(p.hist||[]).filter(x=>x.site).sort((a,b)=>a.from<b.from?-1:1);if(h.length){st=h[0].site;h.forEach(x=>{if(x.from<=k)st=x.site;});}return st;}
          const siteName=id=>id==='both'?t('bothSites'):((C().sites.find(s=>s.id===id)||{}).name||id);
          const siteOpts=sel=>C().sites.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('');
          const curSite=p=>p.role==='res'?'both':(p.site||'compound');
          const startOf=p=>{const h=(p.hist||[]).slice().sort((a,b)=>a.from<b.from?-1:1);return h.length?h[0].from:'2000-01-01';};
          const employedOn=(p,k)=>k>=startOf(p)&&!(p.left&&k>=p.left);
          const activePeople=()=>people().filter(p=>!p.left);
          const RO={sup:0,mem:1,res:2};
          const SO=p=>p.role==='res'?9:C().sites.findIndex(s=>s.id===curSite(p));
          function teamMembers(k){return activePeople().filter(p=>p.team===k).sort((a,b)=>SO(a)-SO(b)||RO[a.role]-RO[b.role]||pName(a.id).localeCompare(pName(b.id)));}
          function personList(){const o=[];[0,1,2].forEach(k=>teamMembers(k).forEach(p=>o.push({id:p.id,name:pName(p.id),team:p.team,role:p.role,site:curSite(p)})));return o;}
          function pName(id){const p=P(id);if(!p)return id||'';return (p.name||'').trim()||(p.role==='res'?t('reserve'):t('member'));}
          function teamName(i){const cu=((C().teamNames||[])[i]||'').trim();return cu||t('teamWord')+' '+(i+1);}
          function supOf(i){return activePeople().find(p=>p.team===i&&p.role==='sup');}
          function teamFull(i){const s=supOf(i);return teamName(i)+(s?' · '+pName(s.id):'');}
          const isMember=()=>C().mode==='member';
          const isPM=()=>C().mode==='pm';
          const meP=()=>C().meId?P(C().meId):null;
          const roleTag=p=>p.role==='sup'?`<span class="tag sup">★ ${t('supervisor')}</span>`:p.role==='res'?`<span class="tag res">${t('reserve')}</span>`:'';
          const initial=id=>(pName(id).trim()[0]||'?');

          // ================= schedule engine =================
          function kRange(A,B){const o=[];for(let k=A;k<=B;k=kAdd(k,1))o.push(k);return o;}
          function teamShift(team,k){return shiftOf(parse(k),team).type;}
          function absentOn(pid,k){return S.events.find(e=>(e.type==='absence'||e.type==='leave')&&e.p1===pid&&e.from<=k&&e.to>=k);}
          function swappedOut(pid,k){return S.events.some(e=>e.type==='swap'&&((e.p2===pid&&e.from===k)||(e.p1===pid&&e.back===k)));}
          function extras(pid,A,B){const o=[];
            S.asg.forEach(a=>{if(a.pid===pid&&a.k>=A&&a.k<=B)o.push({k:a.k,type:a.type,kind:a.for?'cover':'callout',team:a.team,ev:a});});
            S.events.forEach(e=>{if(e.type==='swap'){if(e.p1===pid&&e.from>=A&&e.from<=B)o.push({k:e.from,type:e.st,kind:'swap',ev:e});if(e.back&&e.p2===pid&&e.back>=A&&e.back<=B)o.push({k:e.back,type:e.st2,kind:'swap',ev:e});}});
            return o;}
          // worked: actual shifts. planned (for conflicts): includes reserve on-call with team
          function shiftsOf(pid,A,B,opt){opt=opt||{};const p=P(pid);if(!p)return[];const o=[];
            kRange(A,B).forEach(k=>{if(!employedOn(p,k))return;const tm=teamAt(p,k),ty=teamShift(tm,k);if(ty==='O')return;
              if(p.role==='res'&&!opt.oncall)return;if(absentOn(pid,k)||swappedOut(pid,k))return;
              o.push({k,type:ty,kind:p.role==='res'?'oncall':'base',team:tm});});
            extras(pid,A,B).forEach(x=>{if(opt.skip&&x.ev.id===opt.skip)return;const i=o.findIndex(y=>y.k===x.k&&y.type===x.type);if(i<0)o.push(x);else if(o[i].kind==='oncall')o[i]=x;});
            return o.sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:(a.type==='D'?-1:1));}
          EOF_FILE

      - name: Create project files (9)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
          function conflicts(pid,k,type,skipEv,forTeam){const out=[];const s0=sStart(k,type),e0=sEnd(k,type);const minR=(+C().minRest||12)*36e5;
            shiftsOf(pid,kAdd(k,-2),kAdd(k,2),{oncall:true,skip:skipEv}).forEach(x=>{const s=sStart(x.k,x.type),e=sEnd(x.k,x.type);
              const who=x.kind==='oncall'?t('onCall'):(x.team!=null?t('withTeam',{t:teamName(x.team)}):t('kind_'+x.kind));
              const lab=`${ICO[x.type]} ${t(x.type)} ${fmtK(x.k)} (${who})`;
              if(x.kind==='oncall'&&x.k===k&&x.type===type&&forTeam===x.team)return;
              if(s<e0&&e>s0){out.push(lab+' — '+t('overlap'));return;}
              const gap=e<=s0?s0-e:s-e0;if(gap<minR)out.push(lab+' — '+t('restShort',{h:Math.round(gap/36e5),m:C().minRest}));});
            return out;}
          function candidates(k,type,exclude,forTeam){return personList().filter(p=>!(exclude||[]).includes(p.id)).map(p=>{const pp=P(p.id);const conf=[];
            const ab=absentOn(p.id,k);if(ab)conf.push(t('ev_'+ab.type));
            const busy=!ab&&pp.role!=='res'&&teamShift(teamAt(pp,k),k)===type&&!swappedOut(p.id,k);
            if(busy)conf.push(t('overlap'));else if(!ab)conf.push(...conflicts(p.id,k,type,null,forTeam));
            const r=restInfo(p.id,k,type);return Object.assign({},p,{conf,bef:r.bef,aft:r.aft});})
            .sort((a,b)=>(a.conf.length?1:0)-(b.conf.length?1:0)||rank(a,forTeam)-rank(b,forTeam)||(b.bef==null?999:b.bef)-(a.bef==null?999:a.bef));}
          function rank(c,forTeam){if(c.role==='res'&&c.team===forTeam)return 0;if(c.role==='res')return 1;return 2;}
          function restInfo(pid,k,type){const s0=sStart(k,type),e0=sEnd(k,type);let bef=null,aft=null;
            shiftsOf(pid,kAdd(k,-3),kAdd(k,3),{oncall:true}).forEach(x=>{if(x.k===k&&x.type===type)return;const s=sStart(x.k,x.type),e=sEnd(x.k,x.type);
              if(e<=s0){const g=(s0-e)/36e5;if(bef===null||g<bef)bef=g;}if(s>=e0){const g=(s-e0)/36e5;if(aft===null||g<aft)aft=g;}});return{bef,aft};}
          // staffing of one slot: who should be there, who is, who is missing
          function slotInfo(k,type){const tm=teamOn(parse(k),type);const out={k,type,team:tm,sites:[],short:0};
            C().sites.forEach(st=>{const regs=people().filter(p=>employedOn(p,k)&&p.role!=='res'&&teamAt(p,k)===tm&&siteAt(p,k)===st.id);
              const off=p=>absentOn(p.id,k)||swappedOut(p.id,k);const absent=regs.filter(off),present=regs.filter(p=>!off(p));
              const asg=S.asg.filter(a=>a.k===k&&a.type===type&&a.team===tm&&a.site===st.id);
              const swIn=S.events.filter(e=>e.type==='swap'&&((e.from===k&&e.st===type&&P(e.p2)&&teamAt(P(e.p2),k)===tm&&siteAt(P(e.p2),k)===st.id)||(e.back===k&&e.st2===type&&P(e.p1)&&teamAt(P(e.p1),k)===tm&&siteAt(P(e.p1),k)===st.id))).map(e=>e.from===k?e.p1:e.p2);
              const need=regs.length,have=present.length+asg.length+swIn.length,short=Math.max(0,need-have);
              out.sites.push({site:st.id,need,have,short,present,absent,asg,swIn});out.short+=short;});
            out.res=people().filter(p=>employedOn(p,k)&&p.role==='res'&&teamAt(p,k)===tm);return out;}
          function shortDays(A,B){const o=[];kRange(A,B).forEach(k=>['D','N'].forEach(ty=>{const si=slotInfo(k,ty);if(si.short)o.push(si);}));return o;}
          // ================= platform =================
          const AB=window.AndroidBridge;
          function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700);}
          function copyText(s){try{if(AB&&AB.copy){AB.copy(s);toast(t('copied'));return;}}catch(e){}
            if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(()=>toast(t('copied')),()=>fallbackCopy(s));else fallbackCopy(s);}
          function fallbackCopy(s){const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('copied'));}catch(e){}ta.remove();}
          function shareText(s){try{if(AB&&AB.share){AB.share(s);return;}}catch(e){}if(navigator.share)navigator.share({text:s}).catch(()=>{});else copyText(s);}
          function shareFile(name,mime,content){try{if(AB&&AB.shareFile){AB.shareFile(name,mime,content);return;}}catch(e){}
            try{const f=new File([content],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return;}}catch(e){}
            try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();}catch(e){copyText(content);}}
          function printHtml(html,title){try{if(AB&&AB.print){AB.print(html,title);return;}}catch(e){}const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),300);}}
          function sysDark(){try{if(AB&&AB.isDark)return !!AB.isDark();}catch(e){}return !window.matchMedia||window.matchMedia('(prefers-color-scheme: dark)').matches;}
          function applyTheme(){const dark=C().theme==='dark'||(C().theme==='auto'&&sysDark());document.body.classList.toggle('light',!dark);try{if(AB&&AB.setBars)AB.setBars(dark?'#0f172a':'#f1f5f9',!dark);}catch(e){}}
          window.onSysTheme=()=>applyTheme();
          function applyLang(){document.documentElement.lang=L();document.documentElement.dir=L()==='ar'?'rtl':'ltr';document.title=t('app');}

          // ================= sheet =================
          function openSheet(html){$('panel').innerHTML=html;$('sheet').classList.add('show');$('panel').scrollTop=0;}
          function closeSheet(){$('sheet').classList.remove('show');}
          $('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
          function confirmBox(msg,fn){openSheet(`<h3>${esc(msg)}</h3><div class="btns"><button class="btn dang" id="cfY">${t('yes')}</button><button class="btn" id="cfN">${t('cancel')}</button></div>`);$('cfY').onclick=()=>{closeSheet();fn();};$('cfN').onclick=closeSheet;}
          const personOpts=(sel,list)=>(list||personList()).map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)} — ${esc(teamName(p.team))} · ${p.role==='res'?t('reserve'):esc(siteName(p.site))}</option>`).join('');
          const teamOpts=sel=>[0,1,2].map(k=>`<option value="${k}" ${+sel===k?'selected':''}>${esc(teamFull(k))}</option>`).join('');
          const confBox=list=>list.length?`<div class="warnbox">⚠️ ${list.map(esc).join('\n⚠️ ')}</div>`:`<div class="okbox">${t('noConflict')}</div>`;

          // ================= navigation =================
          const tabs=()=>isMember()?[['home','🏠'],['cal','🗓️'],['me','👤'],['log','📝'],['rep','📊']]:isPM()?[['home','🏠'],['cal','🗓️'],['emp','👥'],['admin','🧭'],['rep','📊']]:[['home','🏠'],['cal','🗓️'],['emp','👥'],['log','📝'],['rep','📊']];
          EOF_FILE

      - name: Create project files (10)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
          let view='home',prevView='home',empId=null,empTab='info',empMonth=null,personFrom='emp';
          function go(v){if(v==='me'){if(meP()){openPerson(C().meId);return;}v='set';}if(v==='set'&&view!=='set')prevView=view;view=v;render();window.scrollTo(0,0);}
          function openPerson(id,tab){if(view!=='person')personFrom=view;if(isMember()&&id===C().meId)personFrom='home';empId=id;empTab=tab||(isMember()?'duty':'info');view='person';render();window.scrollTo(0,0);}
          window.handleBack=()=>{if($('sheet').classList.contains('show')){closeSheet();return true;}
            if(view==='setup'){if(wz.step>0){wz.step--;rSetup();return true;}return false;}
            if(view==='person'){go(personFrom||'home');return true;}if(view==='set'){go(prevView==='set'?'home':prevView);return true;}if(view!=='home'){go('home');return true;}return false;};
          $('bell').onclick=()=>notesSheet();
          $('gear').onclick=()=>{if(view==='set')go(prevView==='set'?'home':prevView);else go('set');};

          let now=new Date(),calView=new Date(now.getFullYear(),now.getMonth(),1),logSel=null;
          function render(){now=new Date();applyLang();applyTheme();
            if(!C().mode)view='setup';const su=view==='setup';$('nav').style.display=su?'none':'';$('gear').style.visibility=su?'hidden':'';$('bell').style.visibility=su?'hidden':'';
            $('appTitle').textContent=view==='set'?'⚙️ '+t('set'):view==='setup'?'🗓️ '+t('app'):'🗓️ '+t('app');$('gear').textContent=view==='set'?'✕':'⚙️';
            const nv=view==='person'?(isMember()&&empId===C().meId?'me':(isMember()?personFrom:'emp')):view;
            $('nav').innerHTML=tabs().map(([k,i])=>`<button data-v="${k}" class="${nv===k?'on':''}"><span>${i}</span>${t(k)}</button>`).join('');
            $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));
            document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+view));
            updBell();({home:rHome,cal:rCal,emp:rEmp,person:rPerson,log:rLog,rep:rRep,set:rSet,setup:rSetup,admin:rAdmin})[view]();}
          function bindCommon(v){v.querySelectorAll('[data-day]').forEach(e=>e.onclick=()=>openDay(e.dataset.day));
            v.querySelectorAll('[data-log]').forEach(e=>e.onclick=()=>{closeSheet();logSel=idToShift(e.dataset.log);go('log');});
            v.querySelectorAll('[data-pid]').forEach(e=>e.onclick=()=>{closeSheet();openPerson(e.dataset.pid);});
            v.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));}

          // ================= HOME =================
          function logReminderActive(sh){if(!sh||sh.type!=='N')return false;const g=S.logs[shiftId(sh.date,'N')];if(g&&g.vis&&g.wrk)return false;
            const a=new Date(addDays(sh.date,1).getTime()+mins(C().logFrom)*6e4);return now>=a&&now<shiftTimes(sh.date,'N').e;}
          function upcomingConflicts(){const A=ymd(now),B=kAdd(A,7),out=[];
            S.asg.forEach(a=>{if(a.k<A||a.k>B)return;const c=conflicts(a.pid,a.k,a.type,a.id,a.team);if(c.length)out.push({pid:a.pid,k:a.k,ty:a.type,c});});
            S.events.forEach(e=>{if(e.type!=='swap')return;const chk=(pid,k,ty)=>{if(!pid||!k||k<A||k>B)return;const c=conflicts(pid,k,ty,e.id);if(c.length)out.push({pid,k,ty,c});};chk(e.p1,e.from,e.st);if(e.back)chk(e.p2,e.back,e.st2);});
            return out;}
          function rHome(){if(isPM())return rHomePM();const v=$('v-home');const td=shiftOf(now,C().myTeam);const ms=myShiftAround(now);let h='';const on=ms&&ms.s<=now;
            if(on&&logReminderActive(ms))h+=`<div class="alert" data-go="log">${t('logReminder')}</div>`;
            if(ms){const ty=ms.type,ht=on?ty:td.type;
              h+=`<div class="hero ${ht}"><div class="ico">${ICO[ht]}</div><div class="lbl">${t('today')} — ${fmt(now)} · ${esc(teamName(C().myTeam))}</div>`;
              if(on)h+=`<div class="big">${t('onDuty')} — ${t(ty)}</div><div class="sub">${t('ends')} ${hm(ms.st+720)} · ${ms.pos===1?t('first'):t('second')}</div>`;
              else h+=`<div class="big">${td.type==='O'?t('O'):t(td.type)+' · '+(td.pos===1?t('first'):t('second'))}</div><div class="sub">${t('yourNext')}: ${ICO[ty]} ${t(ty)} — ${fmt(ms.date)}</div><span class="badge">${t('fp')} ${hm(ms.fpS)}–${hm(ms.fpE)} · ${t('work')} ${hm(ms.st)}</span>`;
              h+='</div>';}
            h=dueAlerts()+h;if(C().mode==='sup')h=kpiGrid()+h;
            let off=null;for(let k=0;k<14;k++){const d=addDays(now,k),s=shiftOf(d,C().myTeam);if(s.type==='O'&&s.pos===1&&(k>0||td.type!=='O')){off=d;break;}}
            const nx=ms&&on?myShiftStep(ms.date,ms.type,1):ms;
            h+=`<div class="row"><div class="stat"><div class="k">${t('nextShift')}</div><div class="v">${nx?ICO[nx.type]+' '+t(nx.type)+' — '+fmtS(nx.date):'—'}</div></div><div class="stat"><div class="k">${t('nextOff')}</div><div class="v">${off?'🛋️ '+fmtS(off):'—'}</div></div></div>`;
            const sd=shortDays(ymd(now),kAdd(ymd(now),7));if(sd.length)h+=`<div class="card"><h3>${t('upShort')}</h3>`+sd.map(x=>{const miss=[].concat(...x.sites.map(s=>s.absent.filter(p=>!s.asg.some(a=>a.for===p.id)).map(p=>pName(p.id))));
              return `<div class="item" data-day="${x.k}" style="cursor:pointer"><div class="h"><span>${ICO[x.type]} ${fmtK(x.k)} — ${esc(teamName(x.team))}</span><span class="pill bad" style="background:var(--dangerBg)">${t('needs')} ${x.short}</span></div>${miss.length?`<div class="b">❌ ${miss.map(esc).join('، ')}</div>`:''}</div>`;}).join('')+'</div>';
            const uc=upcomingConflicts();if(uc.length)h+=`<div class="card"><h3>${t('upConf')}</h3>`+uc.map(x=>`<div class="item" data-pid="${x.pid}"><div class="h">${esc(pName(x.pid))} — ${ICO[x.ty]} ${fmtK(x.k)}</div><div class="b">${x.c.map(esc).join('\n')}</div></div>`).join('')+'</div>';
            const cur=lastOrCurrentMyShift(now);
            if(cur){const id=shiftId(cur.date,cur.type),g=S.logs[id]||{};
              const st=(ok,txt)=>`<span class="st ${ok?'ok':'bad'}">${ok?'✓ ':''}${txt}</span>`;
              h+=`<div class="card"><h3>${t('tasks')} <span class="muted">${on?t('current'):t('last')}: ${t(cur.type)} ${fmtS(cur.date)}</span></h3>`;
              h+=`<div class="task"><span class="ti">🪪</span><span class="tx">${t('cardsRecv')}</span>${st(g.recv!=null,g.recv!=null?g.recv+' / '+C().cards:t('notDone'))}</div>`;
              if(cur.type==='N')h+=`<div class="task"><span class="ti">📒</span><span class="tx">${t('logChange')} <span class="muted">${C().logFrom}–${C().logTo}</span></span>${st(g.vis&&g.wrk,g.vis&&g.wrk?t('done'):t('notDone'))}</div>`;
              h+=`<div class="task"><span class="ti">📝</span><span class="tx">${t('handNotes')}</span>${st(!!g.notes,g.notes?t('done'):t('notDone'))}</div>`;
          EOF_FILE

      - name: Create project files (11)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
              h+=`<div class="task"><span class="ti">🪪</span><span class="tx">${t('cardsHand')}</span>${st(g.hand!=null,g.hand!=null?g.hand+' / '+C().cards:t('notDone'))}</div>`;
              h+=`<button class="btn pri full" data-log="${id}">${t('openLog')}</button></div>`;}
            h+=`<div class="sec">${t('upcoming')}</div><div class="week">`;
            for(let k=0;k<14;k++){const d=addDays(now,k),s=shiftOf(d,C().myTeam);h+=`<div class="wd ${k===0?'today':''}" data-day="${ymd(d)}"><div class="n">${k===0?t('today'):SDAYS[L()][d.getDay()]}</div><div class="d">${d.getDate()}</div><div class="s ${s.type}-t ${s.type}-b">${ICO[s.type]} ${t(s.type)}</div></div>`;}
            h+='</div>';
            h+=`<div class="sec">${t('today')} — ${t('staffing')}</div>${teamsForDay(ymd(now))}`;
            v.innerHTML=h;bindCommon(v);bindSlots(v,null);bindDue(v);}
          function slotCard(si){const k=si.k,ty=si.type;let h=`<div class="card" style="padding:12px"><h3><span>${ICO[ty]} ${t(ty)} — ${esc(teamFull(si.team))}${si.team===C().myTeam&&!isPM()?' <span class="muted">('+t('yours')+')</span>':''}</span>${si.short?`<span class="pill" style="background:var(--dangerBg);color:var(--danger)">⚠️ ${t('short')} ${si.short}</span>`:`<span class="pill O-t O-b">✅ ${t('full')}</span>`}</h3>`;
            si.sites.forEach(st=>{if(!st.need&&!st.asg.length)return;h+=`<div class="sec" style="margin:6px 0 4px">📍 ${esc(siteName(st.site))} <span class="muted">${st.have}/${st.need}</span></div>`;
              h+=st.present.map(p=>`<div class="tl" data-pid="${p.id}" style="cursor:pointer;padding:6px 10px;margin-bottom:4px"><span>${p.role==='sup'?'★ ':''}${esc(pName(p.id))}</span><span class="O-t">✓</span></div>`).join('');
              h+=st.absent.map(p=>{const ab=absentOn(p.id,k);const cv=st.asg.find(a=>a.for===p.id);const why=ab?t('ev_'+ab.type):t('swapIn');
                return `<div class="tl" style="padding:6px 10px;margin-bottom:4px;flex-wrap:wrap"><span class="bad">❌ ${esc(pName(p.id))} <span class="muted">(${why})</span></span>`+(cv?`<span>↳ ${esc(pName(cv.pid))} <button class="btn sm dang" data-delasg="${cv.id}">✕</button></span>`:(swappedOut(p.id,k)?'':`<button class="btn sm pri" data-cover="${k}|${ty}|${si.team}|${st.site}|${p.id}">${t('cover')}</button>`))+`</div>`;}).join('');
              h+=st.asg.filter(a=>!a.for).map(a=>`<div class="tl" style="padding:6px 10px;margin-bottom:4px"><span>📞 ${esc(pName(a.pid))} <span class="muted">(${esc(teamName(P(a.pid)?P(a.pid).team:0))})</span></span><button class="btn sm dang" data-delasg="${a.id}">✕</button></div>`).join('');
              h+=st.swIn.map(id=>`<div class="tl" style="padding:6px 10px;margin-bottom:4px"><span>🔁 ${esc(pName(id))}</span></div>`).join('');});
            if(si.res.length)h+=`<div class="muted" style="margin-top:6px">🔁 ${t('reserve')}: ${si.res.map(r=>{const a=S.asg.find(x=>x.pid===r.id&&x.k===k&&x.type===ty);return esc(pName(r.id))+(a?` → ${a.for?t('inPlaceOf')+' '+esc(pName(a.for)):esc(teamName(a.team))}`:` (${t('onCallRes')})`);}).join(' · ')}</div>`;
            h+=`<button class="btn sm full" data-xcall="${k}|${ty}|${si.team}">${t('extraCall')}</button></div>`;return h;}
          function teamsForDay(k){const d=parse(k);let h=slotCard(slotInfo(k,'D'))+slotCard(slotInfo(k,'N'));const ot=teamOn(d,'O');
            h+=`<div class="tl"><span>🛋️ ${t('O')} — ${esc(teamName(ot))}</span><span class="muted">${teamMembers(ot).length}</span></div>`;return h;}
          function bindSlots(v,back){v.querySelectorAll('[data-cover]').forEach(b=>b.onclick=()=>{const[k,ty,tm,si,f]=b.dataset.cover.split('|');pickCover(k,ty,+tm,si,f,back);});
            v.querySelectorAll('[data-xcall]').forEach(b=>b.onclick=()=>{const[k,ty,tm]=b.dataset.xcall.split('|');slotForm(null,k,ty,+tm,back);});
            v.querySelectorAll('[data-delasg]').forEach(b=>b.onclick=()=>confirmBox(t('delAsgQ'),()=>{S.asg=S.asg.filter(a=>a.id!==b.dataset.delasg);save();if(back)back();else render();}));}
          function openDay(k){const d=parse(k);let h=`<h3>${fmt(d)}</h3>`+teamsForDay(k);
            const ev=S.events.filter(e=>e.type==='swap'&&(e.from===k||e.back===k));if(ev.length)h+=ev.map(e=>`<div class="item"><div class="h">${esc(evText(e))}</div></div>`).join('');
            h+=trainingsOn(k).map(x=>`<div class="item"><div class="h">🎓 ${t('trainOf')} — ${esc(teamFull(x.team))}</div><div class="b">${x.time}</div></div>`).join('');
            h+=S.notes.filter(x=>x.date===k).map(x=>`<div class="item"><div class="h">📌 ${esc(x.text)}</div><div class="b">${x.time||''}${x.done?' ✓':''}</div></div>`).join('');
            if(!isPM())['D','N'].forEach(ty=>{if(shiftOf(d,C().myTeam).type===ty){const id=shiftId(d,ty),g=S.logs[id];h+=`<div class="item"><div class="h">📝 ${t('log')} ${ICO[ty]}<button class="btn sm pri" data-log="${id}">${t('openLog')}</button></div>${g&&g.notes?`<div class="b">${esc(g.notes)}</div>`:''}</div>`;}});
            h+=`<div class="btns"><button class="btn" id="dAbs">❌ ${t('qAbs')}</button><button class="btn pri" id="dClose">${t('close')}</button></div>`;
            openSheet(h);$('dClose').onclick=()=>{closeSheet();render();};$('dAbs').onclick=()=>evForm('absence',null,k);
            bindCommon($('panel'));bindSlots($('panel'),()=>openDay(k));}
          // ================= CALENDAR =================
          function rCal(){const v=$('v-cal');const ar=L()==='ar';let h=`<div class="card"><div class="calhead"><button class="btn" id="cP">${ar?'›':'‹'}</button><b>${MONTHS[L()][calView.getMonth()]} ${calView.getFullYear()}</b><button class="btn" id="cN">${ar?'‹':'›'}</button></div><div class="grid">`;
            SDAYS[L()].forEach(n=>h+=`<div class="dn">${n}</div>`);
            const first=calView.getDay(),len=new Date(calView.getFullYear(),calView.getMonth()+1,0).getDate();
            for(let i=0;i<first;i++)h+='<div class="c empty"></div>';
            for(let d=1;d<=len;d++){const dt=new Date(calView.getFullYear(),calView.getMonth(),d),k=ymd(dt),s=shiftOf(dt,C().myTeam);
              const dot=S.events.some(e=>(e.from<=k&&e.to>=k)||e.back===k)||S.asg.some(a=>a.k===k)||['D','N'].some(ty=>{const g=S.logs[k+'_'+ty];return g&&(g.notes||(g.inc&&g.inc.length));});
              const sh=k>=kAdd(ymd(now),-31)&&(slotInfo(k,'D').short||slotInfo(k,'N').short);
              const tr=trainingsOn(k).length,nt=S.notes.some(x=>x.date===k&&!x.done);const mk=(sh?'⚠️':'')+(tr?'🎓':'')+(nt?'📌':'')+(dot?'<i class="mkd"></i>':'');
              const lab=isPM()?`<small dir="ltr" style="font-size:9px">☀️${teamOn(dt,'D')+1} 🌙${teamOn(dt,'N')+1}</small>`:`<small class="${s.type}-t">${t(s.type)}</small>`;
          EOF_FILE

      - name: Create project files (12)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
              h+=`<button class="c ${isPM()?'':s.type+'-b'} ${k===ymd(now)?'today':''}" data-day="${k}" ${isPM()?'style="background:var(--card2)"':''}><span class="mk">${mk}</span><span>${d}</span>${lab}</button>`;}
            h+=`</div><div class="legend"><span><i style="background:var(--day)"></i>${t('D')}</span><span><i style="background:var(--night)"></i>${t('N')}</span><span><i style="background:var(--off)"></i>${t('O')}</span><span><i style="background:var(--danger);border-radius:50%"></i>${t('events')}</span></div><button class="btn full" id="cT">${t('today')}</button></div><p class="muted" style="text-align:center">${isPM()?'':esc(teamFull(C().myTeam))+' · '}${t('hint')}</p>`;
            v.innerHTML=h;bindCommon(v);
            $('cP').onclick=()=>{calView=new Date(calView.getFullYear(),calView.getMonth()-1,1);rCal();};
            $('cN').onclick=()=>{calView=new Date(calView.getFullYear(),calView.getMonth()+1,1);rCal();};
            $('cT').onclick=()=>{calView=new Date(now.getFullYear(),now.getMonth(),1);rCal();};}

          // ================= EMPLOYEES =================
          let empQ='',empF='all',empSub='list',empSite='all';
          function warnsOf(pid){return S.warns.filter(w=>w.p===pid).sort((a,b)=>a.date<b.date?1:-1);}
          function todayStatus(p){const k=ymd(now);if(p.left)return `<span class="muted">${t('leftOn')} ${p.left}</span>`;const ab=absentOn(p.id,k);if(ab)return `<span class="bad">❌ ${t('ev_'+ab.type)}</span>`;
            const sh=shiftsOf(p.id,k,k,{oncall:true});if(!sh.length)return `<span class="O-t">🛋️ ${t('O')}</span>`;const x=sh[0];return `<span class="${x.type}-t">${ICO[x.type]} ${t(x.type)}${x.kind==='oncall'?' ('+t('reserve')+')':x.kind!=='base'?' ('+t('kind_'+x.kind)+')':''}</span>`;}
          function empCard(p){const w=warnsOf(p.id).length;return `<div class="ecard" data-pid="${p.id}"><div class="av">${esc(initial(p.id))}</div><div class="in"><div class="nm">${esc(pName(p.id))}${p.id===C().meId?' <span class="tag">'+t('you')+'</span>':''}${roleTag(p)}${w?`<span class="tag warn">⚠️ ${w}</span>`:''}</div><div class="mt">${esc(teamName(p.team))} · 📍${esc(siteName(curSite(p)))} · ${todayStatus(p)}</div></div><span class="muted">${L()==='ar'?'‹':'›'}</span></div>`;}
          function rEmp(){const v=$('v-emp');let h=`<div class="qa"><button id="qA"><span>❌</span>${t('qAbs')}</button><button id="qC"><span>📞</span>${t('qCall')}</button><button id="qW"><span>⚠️</span>${t('qWarn')}</button><button id="qU"><span>👕</span>${t('qUni')}</button></div>`;
            h+=`<div class="tabs">${[['list',t('list')],['events',t('events')],['uni',t('uni')]].map(([k,l])=>`<button data-sub="${k}" class="${empSub===k?'on':''}">${l}</button>`).join('')}</div>`;
            if(empSub==='list'){
              h+=`<input class="search" id="eQ" placeholder="${t('searchPh')}" value="${esc(empQ)}"><div class="tabs">${[['all',t('all')],[0,teamFull(0)],[1,teamFull(1)],[2,teamFull(2)],['former',t('former')]].map(([k,l])=>`<button data-ef="${k}" class="${String(empF)===String(k)?'on':''}">${esc(l)}</button>`).join('')}</div><div class="tabs">${[['all','📍 '+t('allSites')],...C().sites.map(x=>[x.id,'📍 '+x.name])].map(([k,l])=>`<button data-esite="${k}" class="${empSite===k?'on':''}">${esc(l)}</button>`).join('')}</div><div id="eList"></div>
              <button class="btn pri full" id="eNew">${t('newEmp')}</button>`;}
            else if(empSub==='events')h+=eventsList(S.events,true);
            else h+=uniList();
            v.innerHTML=h;
            $('qA').onclick=()=>evForm('absence');$('qC').onclick=()=>slotForm();$('qW').onclick=()=>warnForm();$('qU').onclick=()=>uniForm();
            v.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{empSub=b.dataset.sub;rEmp();});
            if(empSub==='list'){const draw=()=>{const q=empQ.trim().toLowerCase();let list;
                if(empF==='former')list=people().filter(p=>p.left);else{list=[];[0,1,2].forEach(k=>{if(empF==='all'||String(empF)===String(k))list=list.concat(teamMembers(k));});}
                if(q)list=list.filter(p=>pName(p.id).toLowerCase().includes(q));
                if(empSite!=='all')list=list.filter(p=>curSite(p)===empSite||curSite(p)==='both');
                let out='';if(empF==='all'&&!q&&empSite==='all'){[0,1,2].forEach(k=>{const ms=list.filter(p=>p.team===k);out+=`<div class="sec" style="display:flex;justify-content:space-between;align-items:center"><span>${esc(teamFull(k))} · ${ms.length}${k===C().myTeam?' ('+t('yours')+')':''}</span><button class="btn sm" data-tedit="${k}">${t('editTeam')}</button></div>`+(ms.map(empCard).join('')||`<div class="empty-msg">${t('noMembers')}</div>`);});}
                else out=list.map(empCard).join('')||`<div class="empty-msg">${t('noMembers')}</div>`;
                $('eList').innerHTML=out;bindCommon($('eList'));$('eList').querySelectorAll('[data-tedit]').forEach(b=>b.onclick=()=>teamEditor(+b.dataset.tedit));};
              draw();$('eQ').oninput=e=>{empQ=e.target.value;draw();};
              v.querySelectorAll('[data-ef]').forEach(b=>b.onclick=()=>{empF=b.dataset.ef;rEmp();});
              v.querySelectorAll('[data-esite]').forEach(b=>b.onclick=()=>{empSite=b.dataset.esite;rEmp();});
              $('eNew').onclick=empForm;}
            bindEvents(v,rEmp);bindCommon(v);
            const ua=$('uAdd');if(ua)ua.onclick=()=>uniForm();}

          // ================= PERSON =================
          function rPerson(){const v=$('v-person');const p=P(empId);if(!p){go('emp');return;}const ar=L()==='ar';
            const mine=p.id===C().meId,canEdit=!isMember()||mine;
            let h=(isMember()&&mine)?'':`<button class="btn sm" id="pBack" style="margin-bottom:8px">${ar?'→':'←'} ${t(personFrom==='emp'?'emp':personFrom==='cal'?'cal':'home')}</button>`;
            h+=`<div class="phead"><div class="av">${esc(initial(p.id))}</div><div style="flex:1"><div class="nm">${esc(pName(p.id))}${mine?' <span class="tag">'+t('you')+'</span>':''}</div><div class="muted">${esc(teamName(p.team))} · 📍${esc(siteName(curSite(p)))} ${roleTag(p)}</div><div style="font-size:13px;margin-top:2px">${todayStatus(p)}</div></div></div>`;
            if(!p.left&&canEdit)h+=`<div class="qa"><button id="pqA"><span>❌</span>${t('qAbs')}</button><button id="pqC"><span>📞</span>${t('qCall')}</button><button id="pqW"><span>⚠️</span>${t('qWarn')}</button><button id="pqU"><span>👕</span>${t('qUni')}</button></div>`;
          EOF_FILE

      - name: Create project files (13)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
            h+=`<div class="tabs">${(isMember()?[['duty',t('duty')],['uni',t('uni')],['warns',t('warns')],['evals',t('evals')],['events',t('events')],['info',t('info')]]:[['info',t('info')],['duty',t('duty')],['uni',t('uni')],['warns',t('warns')],['evals',t('evals')],['events',t('events')]]).map(([k,l])=>`<button data-pt="${k}" class="${empTab===k?'on':''}">${l}${k==='warns'&&warnsOf(p.id).length?' ('+warnsOf(p.id).length+')':''}</button>`).join('')}</div>`;
            h+='<div id="pBody"></div>';v.innerHTML=h;
            if($('pBack'))$('pBack').onclick=()=>go(personFrom||'home');
            if(!p.left&&canEdit){$('pqA').onclick=()=>evForm('absence',p.id);$('pqC').onclick=()=>slotForm(p.id);$('pqW').onclick=()=>warnForm(p.id);$('pqU').onclick=()=>uniForm([p.id]);}
            v.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{empTab=b.dataset.pt;rPerson();});
            const B=$('pBody');
            if(empTab==='info'){let b=`<div class="card"><label>${t('name')}</label><input id="piN" value="${esc(p.name)}"><label>${t('phone')}</label><input id="piP" type="tel" value="${esc(p.phone||'')}">
              <label>${t('role')}</label><select id="piR" ${p.left?'disabled':''}>${['mem','sup','res'].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${r==='mem'?t('member'):r==='sup'?'★ '+t('supervisor'):t('reserve')}</option>`).join('')}</select>
              <label>${t('notes')}</label><textarea id="piO">${esc(p.notes||'')}</textarea>
              <p class="muted" style="margin-top:6px">${t('startDate')}: ${startOf(p)==='2000-01-01'?'—':startOf(p)}</p></div>`;
              const hs=(p.hist||[]).filter(x=>x.from>'2000-01-01');if(hs.length)b+=`<div class="card"><h3>🔀 ${t('move')}</h3>${hs.map(x=>`<div class="b">${x.from} → ${esc(teamName(x.team))}${x.site?' · 📍'+esc(siteName(x.site)):''}</div>`).join('')}</div>`;
              b+=`<div class="btns">`+(p.left?`<button class="btn" id="piBk">${t('restoreEmp')}</button>`:`<button class="btn" id="piM">${t('move')}</button><button class="btn dang" id="piX">${t('resign')}</button>`)+`</div>`;
              if(!canEdit)b=b.replace(/<input /g,'<input disabled ').replace(/<textarea /g,'<textarea disabled ').replace(/<select /g,'<select disabled ').replace(/<div class="btns">[\s\S]*$/,'');
              B.innerHTML=b;
              if(!canEdit){bindCommon(B);return;}
              $('piN').onchange=e=>{p.name=e.target.value.trim();save();rPerson();};$('piP').onchange=e=>{p.phone=e.target.value.trim();save();};$('piO').onchange=e=>{p.notes=e.target.value;save();toast(t('saved'));};
              $('piR').onchange=e=>{setRole(p,e.target.value);save();rPerson();};
              if($('piBk'))$('piBk').onclick=()=>{delete p.left;delete p.leftNote;save();rPerson();};if($('piM'))$('piM').onclick=()=>moveForm(p);if($('piX'))$('piX').onclick=()=>resignForm(p);}
            if(empTab==='duty'){if(!empMonth)empMonth=new Date(now.getFullYear(),now.getMonth(),1);const A=ymd(empMonth),Bk=ymd(new Date(empMonth.getFullYear(),empMonth.getMonth()+1,0));const r=monthRow(p,A,Bk);
              let b=`<div class="card"><div class="mnav"><button class="btn" id="dmP">${ar?'›':'‹'}</button><b>${MONTHS[L()][empMonth.getMonth()]} ${empMonth.getFullYear()}</b><button class="btn" id="dmN">${ar?'‹':'›'}</button></div>
              <div class="kpis"><div class="kpi"><b>${r.total}</b><span>${t('actual')}</span></div><div class="kpi"><b class="D-t">${r.d}</b><span>${t('dayC')}</span></div><div class="kpi"><b class="N-t">${r.n}</b><span>${t('nightC')}</span></div>
              <div class="kpi"><b>${r.total*12}</b><span>${t('hours')}</span></div><div class="kpi"><b class="bad">${r.abs}</b><span>${t('absC')}</span></div><div class="kpi"><b>${r.extra}</b><span>${t('extraC')}</span></div></div>
              <div class="sec">${t('workedDays')}</div>`+(r.list.length?r.list.map(x=>`<div class="tl"><span>${fmtK(x.k)}</span><span class="pill ${x.type}-t ${x.type}-b">${ICO[x.type]} ${t(x.type)}${x.kind!=='base'?' · '+t('kind_'+x.kind):''}</span></div>`).join(''):`<div class="empty-msg">${t('nothing')}</div>`)+
              `<button class="btn pri full" id="dmPr">${t('printMonth')}</button></div>`;B.innerHTML=b;
              $('dmP').onclick=()=>{empMonth=new Date(empMonth.getFullYear(),empMonth.getMonth()-1,1);rPerson();};$('dmN').onclick=()=>{empMonth=new Date(empMonth.getFullYear(),empMonth.getMonth()+1,1);rPerson();};
              $('dmPr').onclick=()=>printHtml(personMonthHtml(p,A,Bk,r),pName(p.id));}
            if(empTab==='uni'){const l=uniOf(p.id);let b=`<div class="card"><h3>📏 ${t('lastSizes')}</h3>`+C().uniItems.map(it=>`<div class="tl"><span>${esc(itemName(it))}</span><b>${esc(lastSize(p.id,it.id)||'—')}</b></div>`).join('')+`</div><div class="card"><h3>${t('history')}${p.left?'':` <button class="btn sm pri" id="puN">${t('uniNew')}</button>`}</h3>`;
              b+=l.length?l.map(u=>`<div class="item"><div class="h"><span>${u.date}</span><button class="btn sm dang" data-delu="${u.id}">${t('del')}</button></div><div class="b">${esc(uniLine(u))}${u.note?'\n'+esc(u.note):''}</div></div>`).join(''):`<div class="empty-msg">${t('never')}</div>`;B.innerHTML=b+'</div>';
              if($('puN'))$('puN').onclick=()=>uniForm([p.id]);
              B.querySelectorAll('[data-delu]').forEach(x=>x.onclick=()=>confirmBox(t('confirmDel'),()=>{S.uni=S.uni.filter(u=>u.id!==x.dataset.delu);save();rPerson();}));}
            if(empTab==='warns'){const ws=warnsOf(p.id);const lvl=ws.length?Math.max(...ws.map(w=>WL.indexOf(w.type))):-1;
              let b=`<div class="card"><h3>⚠️ ${t('warns')}${p.left?'':` <button class="btn sm pri" id="pwN">${t('addWarn')}</button>`}</h3><div class="lvl">${WL.map((w,i)=>`<i class="${i<=lvl?'on':''}"></i>`).join('')}</div><div class="muted" style="display:flex;justify-content:space-between">${WL.map(w=>`<span>${t('w_'+w)}</span>`).join('')}</div></div>`;
              b+=ws.length?ws.map(w=>`<div class="item"><div class="h"><span>${w.date} · ${t('w_'+w.type)}</span><button class="btn sm dang" data-delw="${w.id}">${t('del')}</button></div><div class="b">${esc(w.reason||'')}${w.ded?'\n'+t('deduct')+': '+w.ded+' '+(w.dedType==='amount'?t('dedAmount'):t('dedDays')):''}</div></div>`).join(''):`<div class="empty-msg">${t('noWarns')}</div>`;
              B.innerHTML=b;if($('pwN'))$('pwN').onclick=()=>warnForm(p.id);
              B.querySelectorAll('[data-delw]').forEach(x=>x.onclick=()=>confirmBox(t('confirmDel'),()=>{S.warns=S.warns.filter(w=>w.id!==x.dataset.delw);save();rPerson();}));}
            if(empTab==='evals'){const ev=S.evals.filter(x=>x.p===p.id).sort((a,b)=>a.m<b.m?1:-1);const w=S.eom.filter(x=>x.p===p.id);
          EOF_FILE

      - name: Create project files (14)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
              B.innerHTML=(w.length?`<div class="card"><h3>🏆 ${t('eom')}</h3>${w.map(x=>`<div class="b">${monthLabel(x.m)}</div>`).join('')}</div>`:'')+`<div class="card"><h3>⭐ ${t('evals')}</h3>`+(ev.length?ev.map(x=>`<div class="tl"><span>${monthLabel(x.m)}</span><span>${gradeTag(x.score)}</span></div>`).join(''):`<div class="empty-msg">${t('nothing')}</div>`)+'</div>';}
            if(empTab==='events'){B.innerHTML=eventsList(S.events.filter(e=>e.p1===p.id||e.p2===p.id),false,S.asg.filter(a=>a.pid===p.id||a.for===p.id));bindEvents(B,rPerson);}
            bindCommon(B);}
          function setRole(p,r){if(r==='sup')activePeople().forEach(x=>{if(x.team===p.team&&x.role==='sup'&&x!==p)x.role='mem';});p.role=r;}
          function moveForm(p){openSheet(`<h3>${t('move')} — ${esc(pName(p.id))}</h3><label>${t('newTeam')}</label><select id="mvT">${teamOpts(p.team)}</select>${p.role==='res'?'':`<label>${t('moveSite')}</label><select id="mvSi">${siteOpts(curSite(p))}</select>`}<label>${t('moveDate')}</label><input type="date" id="mvD" value="${ymd(now)}">
            <div class="btns"><button class="btn pri" id="mvS">${t('save')}</button><button class="btn" id="mvC">${t('cancel')}</button></div>`);
            $('mvC').onclick=closeSheet;$('mvS').onclick=()=>{const k=+$('mvT').value,d=$('mvD').value||ymd(now),si=$('mvSi')?$('mvSi').value:p.site;if(k===p.team&&si===p.site){closeSheet();return;}
              if(!(p.hist||[]).some(x=>x.site))p.hist=(p.hist||[]).map(x=>Object.assign({},x,{site:p.site||'compound'}));
              p.hist=(p.hist||[]).filter(x=>x.from!==d);p.hist.push({team:k,from:d,site:si});p.hist.sort((a,b)=>a.from<b.from?-1:1);if(k!==p.team&&p.role==='sup')p.role='mem';p.team=k;p.site=si;save();closeSheet();render();toast(t('saved'));};}
          function resignForm(p){openSheet(`<h3>${t('resign')} — ${esc(pName(p.id))}</h3><label>${t('date')}</label><input type="date" id="rsD" value="${ymd(now)}"><label>${t('reason')}</label><input id="rsN">
            <label class="chk" style="margin-top:8px"><input type="checkbox" id="rsR" checked>${t('addReplacement')}</label><div id="rsW"><label>${t('newName')}</label><input id="rsNN"></div>
            <div class="btns"><button class="btn dang" id="rsS">${t('save')}</button><button class="btn" id="rsC">${t('cancel')}</button></div>`);
            $('rsR').onchange=e=>$('rsW').style.display=e.target.checked?'block':'none';$('rsC').onclick=closeSheet;
            $('rsS').onclick=()=>{const d=$('rsD').value||ymd(now),rp=$('rsR').checked,nn=$('rsNN').value.trim();if(rp&&!nn){toast(t('needName'));$('rsNN').focus();return;}
              let nid=null;if(rp){nid='p'+uid();people().push({id:nid,name:nn,team:p.team,role:p.role,site:p.site||'compound',hist:[{team:p.team,from:d,site:p.site||'compound'}]});}
              p.left=d;p.leftNote=$('rsN').value.trim();if(p.role==='sup')p.role='mem';save();closeSheet();if(nid)openPerson(nid);else render();toast(t('saved'));};}
          function empForm(){openSheet(`<h3>${t('newEmp').replace('+ ','')}</h3><label>${t('name')}</label><input id="nwN"><label>${t('teamOf')}</label><select id="nwT">${teamOpts(empF!=='all'&&empF!=='former'?empF:C().myTeam)}</select>
            <label>${t('role')}</label><select id="nwR"><option value="mem">${t('member')}</option><option value="sup">★ ${t('supervisor')}</option><option value="res">${t('reserve')}</option></select>
            <label>${t('site')}</label><select id="nwSi">${siteOpts(empSite!=='all'?empSite:'compound')}</select><label>${t('startDate')}</label><input type="date" id="nwD" value="${ymd(now)}"><div class="btns"><button class="btn pri" id="nwOk">${t('save')}</button><button class="btn" id="nwC">${t('cancel')}</button></div>`);
            $('nwC').onclick=closeSheet;$('nwOk').onclick=()=>{const n=$('nwN').value.trim();if(!n){toast(t('needName'));$('nwN').focus();return;}const k=+$('nwT').value;
              const si=$('nwSi').value;const p={id:'p'+uid(),name:n,team:k,role:'mem',site:si,hist:[{team:k,from:$('nwD').value||ymd(now),site:si}]};people().push(p);setRole(p,$('nwR').value);save();closeSheet();render();toast(t('saved'));};}

          function movePerson(p,k,si,d){if(!(p.hist||[]).some(x=>x.site))p.hist=(p.hist||[]).map(x=>Object.assign({},x,{site:p.site||'compound'}));
            p.hist=(p.hist||[]).filter(x=>x.from!==d);p.hist.push({team:k,from:d,site:si});p.hist.sort((a,b)=>a.from<b.from?-1:1);if(k!==p.team&&p.role==='sup')p.role='mem';p.team=k;p.site=si;}
          function hasRecords(id){return S.events.some(e=>e.p1===id||e.p2===id||e.cov===id)||S.uni.some(u=>u.p===id)||S.warns.some(w=>w.p===id);}
          function teamEditor(k){const c=C();const sup=activePeople().find(p=>p.team===k&&p.role==='sup');const ms=teamMembers(k).filter(p=>p.role!=='sup');
            let h=`<h3>${t('editTeam')} — ${esc(teamName(k))}</h3>
            <label>${t('supName')} ★</label><input id="teS" value="${esc(sup?sup.name:'')}">
            <label>${t('teamNameL')}</label><input id="teN" value="${esc(c.teamNames[k]||'')}" placeholder="${t('teamNamePh')}">
            <div class="sec" style="margin-top:12px">${t('membersL')} · ${ms.length}</div>`;
            h+=ms.map(p=>`<div class="item"><div class="row" style="align-items:center"><input data-mn="${p.id}" value="${esc(p.name)}" style="flex:3"><button class="btn sm dang" data-mx="${p.id}" style="flex:0 0 auto">✕</button></div>
              <div class="row" style="margin-top:6px"><select data-mr="${p.id}"><option value="mem" ${p.role==='mem'?'selected':''}>${t('member')}</option><option value="res" ${p.role==='res'?'selected':''}>${t('reserve')}</option></select>${p.role==='res'?'<span class="muted" style="align-self:center">📍 '+t('bothSites')+'</span>':`<select data-ms="${p.id}">${siteOpts(curSite(p))}</select>`}</div></div>`).join('')||`<div class="empty-msg">${t('noMembers')}</div>`;
            h+=`<div class="item"><div class="row" style="align-items:center"><input id="teAN" placeholder="${t('name')}" style="flex:3"><select id="teAS" style="flex:2">${siteOpts('compound')}<option value="res">${t('reserve')}</option></select></div><button class="btn pri full" id="teA">${t('addMember')}</button></div>
            <button class="btn full" id="teC">${t('close')}</button>`;
            openSheet(h);
            const re=()=>{save();teamEditor(k);if(view!=='setup')render();};
            $('teS').onchange=e=>{const n=e.target.value.trim();if(sup){sup.name=n;}else if(n){const p={id:'p'+uid(),name:n,team:k,role:'mem',site:'compound',hist:[{team:k,from:ymd(now),site:'compound'}]};people().push(p);setRole(p,'sup');}save();if(view!=='setup')render();};
            $('teN').onchange=e=>{c.teamNames[k]=e.target.value.trim();save();if(view!=='setup')render();};
          EOF_FILE

      - name: Create project files (15)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
            $('panel').querySelectorAll('[data-mn]').forEach(i=>i.onchange=()=>{P(i.dataset.mn).name=i.value.trim();save();if(view!=='setup')render();});
            $('panel').querySelectorAll('[data-mr]').forEach(i=>i.onchange=()=>{P(i.dataset.mr).role=i.value;re();});
            $('panel').querySelectorAll('[data-ms]').forEach(i=>i.onchange=()=>{const p=P(i.dataset.ms);movePerson(p,p.team,i.value,ymd(now));save();if(view!=='setup')render();});
            $('panel').querySelectorAll('[data-mx]').forEach(b=>b.onclick=()=>{const p=P(b.dataset.mx);confirmBox(t('removeQ'),()=>{if(hasRecords(p.id)){p.left=ymd(now);}else{C().people=people().filter(x=>x.id!==p.id);if(C().meId===p.id)C().meId=null;}save();teamEditor(k);if(view!=='setup')render();});});
            $('teA').onclick=()=>{const n=$('teAN').value.trim();if(!n){toast(t('needName'));$('teAN').focus();return;}const sv=$('teAS').value;const si=sv==='res'?'compound':sv;
              people().push({id:'p'+uid(),name:n,team:k,role:sv==='res'?'res':'mem',site:si,hist:[{team:k,from:ymd(now),site:si}]});re();};
            $('teC').onclick=()=>{closeSheet();if(view==='setup')rSetup();};}

          // ================= SETUP WIZARD =================
          let wz=null;
          const POS=['D1','D2','N1','N2','O1','O2'];
          function startWizard(){const c=C(),m=meP();const tm=m?m.team:(c.myTeam||0);const diff=Math.round((utc(now)-utc(parse(c.anchor)))/864e5);
            const st=[0,1,2].map(k=>mod(diff+offOf(c,k),6));
            wz={step:0,mode:c.mode||'member',name:m?m.name:(c.myName||''),team:tm,site:m?curSite(m):'compound',mrole:m&&m.role==='res'?'res':'mem',
              cls:st.map(i=>Math.floor(i/2)),par:st[0]%2,start:c.start,fpStart:c.fpStart,fpEnd:c.fpEnd};}
          function rSetup(){if(!wz)startWizard();const v=$('v-setup'),c=C();const N=6;let h=`<div class="muted" style="text-align:center;margin:4px 0 10px">${t('step')} ${wz.step+1} / ${N}</div><div class="lvl" style="margin-bottom:14px">${Array.from({length:N},(_,i)=>`<i class="${i<=wz.step?'on':''}" style="${i<=wz.step?'background:var(--accent)':''}"></i>`).join('')}</div>`;
            const big=(id,on,ico,title,sub)=>`<button class="ecard" data-${id} style="width:100%;border:2px solid ${on?'var(--accent)':'transparent'};text-align:start;font:inherit;color:var(--text)"><div class="av" style="font-size:24px">${ico}</div><div class="in"><div class="nm">${title}</div>${sub?`<div class="mt">${sub}</div>`:''}</div>${on?'<span style="color:var(--accent);font-size:20px">✓</span>':''}</button>`;
            if(wz.step===0)h+=`<div class="card" style="text-align:center;padding:26px 16px"><div style="font-size:54px">🗓️</div><h2 style="font-size:22px;margin:6px 0">${t('wWelcome')}</h2><p class="muted">${t('wWelcomeSub')}</p><p class="muted" style="font-size:11px;margin-top:10px">${t('credit')} · <span dir="ltr">0924682644</span></p></div>
              <div class="card"><h3>🌐 ${t('language')}</h3><div class="seg"><button data-wl="ar" class="${c.lang==='ar'?'on':''}">العربية</button><button data-wl="en" class="${c.lang==='en'?'on':''}">English</button></div>
              <h3>🎨 ${t('theme')}</h3><div class="seg">${['dark','light','auto'].map(k=>`<button data-wth="${k}" class="${c.theme===k?'on':''}">${t(k)}</button>`).join('')}</div></div>`;
            if(wz.step===1)h+=`<h2 style="font-size:19px;margin-bottom:10px">${t('wRoleQ')}</h2>`+big('wm="member"',wz.mode==='member','🧍',t('modeMember'),t('wMemberD'))+big('wm="sup"',wz.mode==='sup','★',t('modeSup'),t('wSupD'))+big('wm="pm"',wz.mode==='pm','🧭',t('modePM'),t('wPMD'));
            if(wz.step===2){h+=`<h2 style="font-size:19px;margin-bottom:10px">${t('wAboutQ')}</h2><div class="card"><label>${t('name')}</label><input id="wzN" value="${esc(wz.name)}">
          `;if(wz.mode!=='pm')h+=`<label>${t('wYourTeam')}</label><div class="seg">${[0,1,2].map(i=>`<button data-wt2="${i}" class="${wz.team===i?'on':''}">${esc(teamFull(i))}</button>`).join('')}</div>`;
