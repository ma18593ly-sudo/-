            v.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{c.myTeam=+b.dataset.mt;logSel=null;save();render();});
            $('sMe').oninput=e=>{c.myName=e.target.value;save();};
            v.querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>{if(i.value){c[i.dataset.k]=i.value;save();toast(t('saved'));}});
            $('sCards').onchange=e=>{const n=parseInt(e.target.value,10);if(n>0){c.cards=n;save();toast(t('saved'));}};
            $('sRest').onchange=e=>{const n=parseInt(e.target.value,10);if(n>=0){c.minRest=n;save();toast(t('saved'));}};
