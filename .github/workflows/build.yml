              static void scheduleNext(Context ctx, long now, ShiftCalc.State s) {
                  Calendar c = Calendar.getInstance();
                  c.setTimeInMillis(now);
                  c.set(Calendar.MINUTE, 0);
                  c.set(Calendar.SECOND, 30);
                  c.set(Calendar.MILLISECOND, 0);
                  c.add(Calendar.HOUR_OF_DAY, 1);
                  long at = c.getTimeInMillis();
                  if (s != null) {
                      if (s.shiftStart > now && s.shiftStart + 30000 < at) at = s.shiftStart + 30000;
                      if (s.shiftEnd > now && s.shiftEnd + 30000 < at) at = s.shiftEnd + 30000;
                  }
                  AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                  if (am != null) am.set(AlarmManager.RTC, at, tickIntent(ctx));
              }

              static void cancel(Context ctx) {
                  AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                  if (am != null) am.cancel(tickIntent(ctx));
              }
          }
