          package com.mohamed.shifts;

          import java.util.ArrayList;
          import java.util.List;

          /** Pure scheduling rules for reminders (unit-tested without Android). */
          public final class NotifLogic {
              private NotifLogic() {}

              /** Indices of items to post now: lastAt < at <= now+1s, and not older than {@code maxStale}. */
              public static List<Integer> due(long[] ats, long lastAt, long now, long maxStale) {
                  List<Integer> out = new ArrayList<>();
                  for (int i = 0; i < ats.length; i++) {
                      if (ats[i] > lastAt && ats[i] <= now + 1000 && now - ats[i] <= maxStale) out.add(i);
                  }
                  return out;
              }

              /** Index of the earliest item strictly after lastAt, or -1. */
              public static int next(long[] ats, long lastAt) {
                  int best = -1;
                  for (int i = 0; i < ats.length; i++) {
                      if (ats[i] > lastAt && (best < 0 || ats[i] < ats[best])) best = i;
                  }
                  return best;
              }
          }
