          function rAnn(){const v=$('v-ann');let h=`<button class="btn pri full" id="annAdd" style="margin:0 0 12px">${t('annAdd')}</button>`;
            const l=S.ann.slice().reverse();h+=l.length?l.map(a=>`<div class="card"><div style="font-size:16px;font-weight:700">📢 ${esc(a.text)}</div><div class="muted" style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span>${a.date}</span><button class="btn sm dang" data-andel="${a.id}">${t('del')}</button></div></div>`).join(''):`<div class="empty-msg">${t('noAnn')}</div>`;
            v.innerHTML=h;
            $('annAdd').onclick=()=>requirePin(()=>{openSheet(`<h3>📢 ${t('annAdd').replace('+ ','')}</h3><textarea id="annT" placeholder="${t('annPh')}"></textarea><div class="btns"><button class="btn pri" id="annOk">${t('save')}</button><button class="btn" id="annC">${t('cancel')}</button></div>`);
              $('annC').onclick=closeSheet;$('annOk').onclick=()=>{const tx=$('annT').value.trim();if(!tx)return;S.ann.push({id:uid(),text:tx,date:ymd(now),active:true});save();closeSheet();rAnn();toast(t('saved'));};});
            v.querySelectorAll('[data-andel]').forEach(b=>b.onclick=()=>requirePin(()=>{S.ann=S.ann.filter(a=>a.id!==b.dataset.andel);save();rAnn();}));}
          function dial(ph){try{if(AB&&AB.dial){AB.dial(ph);return;}}catch(e){}location.href='tel:'+ph;}
          function rEmerg(){const v=$('v-emerg'),c=C();const sups=activePeople().filter(p=>p.role==='sup');
            let h=`<div class="card"><h3>★ ${t('supervisor')}</h3>`+sups.map(p=>`<div class="tl"><span><b>${esc(pName(p.id))}</b> <span class="muted">${esc(teamName(p.team))}</span>${p.phone?`<br><span class="muted" dir="ltr">${esc(p.phone)}</span>`:''}</span>${p.phone?`<button class="btn sm pri" data-dial="${esc(p.phone)}">${t('call')}</button>`:`<span class="muted" style="font-size:11px">${t('noPhone')}</span>`}</div>`).join('')+'</div>';
            h+=`<div class="card"><h3>📞 ${t('emerg')}</h3>`+(c.emerg||[]).map((e,i)=>`<div class="tl"><span><b>${esc(e.name)}</b><br><span class="muted" dir="ltr">${esc(e.phone)}</span></span><span style="display:flex;gap:6px"><button class="btn sm pri" data-dial="${esc(e.phone)}">${t('call')}</button><button class="btn sm dang" data-emdel="${i}">✕</button></span></div>`).join('')+`<button class="btn full" id="emAdd">${t('emAdd')}</button></div>`;
            v.innerHTML=h;v.querySelectorAll('[data-dial]').forEach(b=>b.onclick=()=>dial(b.dataset.dial));
            v.querySelectorAll('[data-emdel]').forEach(b=>b.onclick=()=>requirePin(()=>{c.emerg.splice(+b.dataset.emdel,1);save();rEmerg();}));
            $('emAdd').onclick=()=>requirePin(()=>{openSheet(`<h3>${t('emAdd')}</h3><label>${t('emName')}</label><input id="emN"><label>${t('phone')}</label><input id="emP" type="tel" dir="ltr"><div class="btns"><button class="btn pri" id="emOk">${t('save')}</button><button class="btn" id="emC">${t('cancel')}</button></div>`);
              $('emC').onclick=closeSheet;$('emOk').onclick=()=>{const n=$('emN').value.trim(),ph=$('emP').value.trim();if(!n||!ph)return;if(!c.emerg)c.emerg=[];c.emerg.push({name:n,phone:ph});save();closeSheet();rEmerg();};});}

          // ================= SUN & REMINDERS =================
          function sunTimes(k){const c=C();const lat=+c.lat||32.8872,lon=+c.lon||13.1913,R=Math.PI/180;const d=parse(k);
            const J=utc(d)/864e5+2440587.5,n=Math.ceil(J-2451545+0.0008),Js=n-lon/360;
            const M=((357.5291+0.98560028*Js)%360+360)%360,Cc=1.9148*Math.sin(M*R)+0.02*Math.sin(2*M*R)+0.0003*Math.sin(3*M*R);
            const lam=((M+Cc+180+102.9372)%360+360)%360,Jt=2451545+Js+0.0053*Math.sin(M*R)-0.0069*Math.sin(2*lam*R);
            const dec=Math.asin(Math.sin(lam*R)*Math.sin(23.4397*R));const cw=(Math.sin(-0.833*R)-Math.sin(lat*R)*Math.sin(dec))/(Math.cos(lat*R)*Math.cos(dec));
            const w=Math.acos(Math.max(-1,Math.min(1,cw)))/R;const toMin=jd=>{const t=new Date((jd-2440587.5)*864e5);return t.getHours()*60+t.getMinutes();};
            return{rise:toMin(Jt-w/360),set:toMin(Jt+w/360)};}
          function notifTypes(){const c=C();return Object.assign({fp:true,locks:true,lights:true,logs:true,notes:true},c.notifTypes||{});}
          function reminders(A,B){const out=[],nt=notifTypes(),c=C();const at=(k,m)=>dayStart(parse(k)).getTime()+m*6e4;
            const tm=(ms)=>{const d=new Date(ms),m=d.getHours()*60+d.getMinutes(),st=mins(c.start);let k=ymd(d),ty='D';if(m>=st+720)ty='N';else if(m<st){ty='N';k=kAdd(k,-1);}return teamOn(parse(k),ty);};
            const add=(kind,ms,ico,title,body)=>{if(ms>=A&&ms<=B)out.push({kind,key:kind+'_'+ymd(new Date(ms))+'_'+new Date(ms).getHours(),at:ms,title:ico+' '+title,body});};
            for(let k=ymd(new Date(A-864e5));k<=ymd(new Date(B));k=kAdd(k,1)){
              ['D','N'].forEach(ty=>{const st=mins(c.start)+(ty==='N'?720:0),team=teamOn(parse(k),ty),tl=teamFull(team);
                if(nt.fp)add('fp',at(k,mins(c.fpStart)+(ty==='N'?720:0)),'👆',t('rFp'),tl+' · '+hm(mins(c.fpStart)+(ty==='N'?720:0))+'–'+hm(mins(c.fpEnd)+(ty==='N'?720:0)));
                if(nt.locks){add('locksStart',at(k,st+5),'🔑',t('rLocksS'),tl);add('locksEnd',at(k,st+720-15),'🔑',t('rLocksE'),tl);}});
