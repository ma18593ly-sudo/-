            const absent=S.events.filter(e=>e.type==='absence'&&e.from<=k&&e.to>=k).length,leave=S.events.filter(e=>e.type==='leave'&&e.from<=k&&e.to>=k).length;
            const sh=shortDays(k,kAdd(k,7)).length,al=dueList().length;
