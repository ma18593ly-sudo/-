              private static int chipBg(ShiftCalc.State s) {
                  if ("ON".equals(s.status)) return R.drawable.chip_on;
                  if ("OFF".equals(s.status)) return R.drawable.chip_off;
                  return R.drawable.chip_before;
              }

              private static String times(ShiftCalc.Config c, ShiftCalc.State s) {
                  int add = "N".equals(s.type) ? 720 : 0;
                  String fp = ar(c) ? "بصمة " : "FP ";
                  return hm(c.startMin + add) + (ar(c) ? " ← " : " → ") + hm(c.startMin + add + 720) + " · " + fp + hm(c.fpS + add) + "–" + hm(c.fpE + add);
              }

              private static void fillMedium(RemoteViews v, ShiftCalc.Config c, ShiftCalc.State s) {
                  Calendar n = Calendar.getInstance();
                  int dw = n.get(Calendar.DAY_OF_WEEK) - 1;
                  v.setTextViewText(R.id.wHeader, c.header + " — " + (ar(c) ? DOW_AR[dw] : DOW_EN[dw]) + " " + n.get(Calendar.DAY_OF_MONTH));
                  boolean off = "OFF".equals(s.status);
                  v.setTextViewText(R.id.wIcon, off ? "🛋️" : icon(s.type));
                  String title = off ? (ar(c) ? "راحة اليوم" : "Off today")
                          : ("ON".equals(s.status) ? typeName(c, s.type) + " · " + posName(c, s.pos)
                          : relDay(c, s) + ": " + typeName(c, s.type) + " · " + posName(c, s.pos));
                  v.setTextViewText(R.id.wTitle, title);
                  String t = times(c, s);
                  if (off) t = (ar(c) ? "الجاية: " : "Next: ") + typeName(c, s.type) + " " + relDay(c, s) + " · " + t;
                  v.setTextViewText(R.id.wTimes, t);
                  v.setTextViewText(R.id.wChip, chipText(c, s));
                  v.setInt(R.id.wChip, "setBackgroundResource", chipBg(s));
                  for (int k = 0; k < 5; k++) {
                      int d = s.dayDow[k] - 1;
                      String lab = k == 0 ? (ar(c) ? "اليوم" : "Today") : (ar(c) ? DOW_AR[d] : DOW_EN[d]);
                      v.setTextViewText(DAY_IDS[k], lab + "\n" + icon(s.days[k]));
                      v.setInt(DAY_IDS[k], "setBackgroundResource", k == 0 ? R.drawable.cell_today : R.drawable.cell);
                  }
              }

              private static void fillSmall(RemoteViews v, ShiftCalc.Config c, ShiftCalc.State s) {
                  boolean off = "OFF".equals(s.status);
                  v.setTextViewText(R.id.wIcon, off ? "🛋️" : icon(s.type));
                  v.setTextViewText(R.id.wTitle, off ? (ar(c) ? "راحة" : "Off") : typeName(c, s.type) + " " + hm(c.startMin + ("N".equals(s.type) ? 720 : 0)));
                  String chip = "ON".equals(s.status) ? (ar(c) ? "باقي " : "") + s.hoursLeftText + (ar(c) ? "" : " left")
                          : (ar(c) ? "بعد " : "in ") + s.hoursLeftText;
                  v.setTextViewText(R.id.wChip, chip);
                  v.setInt(R.id.wChip, "setBackgroundResource", chipBg(s));
              }

              private static void fillOff(RemoteViews v, ShiftCalc.Config c, ShiftCalc.State s) {
                  int dw = s.nextOffDow - 1;
                  v.setTextViewText(R.id.wHeader, ar(c) ? "الراحة الجاية" : "Next day off");
                  v.setTextViewText(R.id.wTitle, "🛋️ " + (s.nextOffInDays == 0 ? (ar(c) ? "اليوم" : "Today") : (ar(c) ? DOW_AR[dw] : DOW_EN[dw]) + " " + s.nextOffDay + "/" + s.nextOffMonth));
                  v.setTextViewText(R.id.wTimes, s.nextOffText);
              }

              private static PendingIntent tickIntent(Context ctx) {
                  Intent i = new Intent(ctx, WidgetMedium.class).setAction(TICK);
                  return PendingIntent.getBroadcast(ctx, 99, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private static void fillSite(Context ctx, RemoteViews v, ShiftCalc.Config c, int kind) {
                  long now = System.currentTimeMillis();
                  ShiftCalc.Duty d = ShiftCalc.dutyNow(c, now);
                  String left = ShiftCalc.hoursText(d.end - now, c.lang);
                  String tn = c.teamNames[d.team].isEmpty() ? (ar(c) ? "تيم " : "Team ") + (d.team + 1) : c.teamNames[d.team];
                  if (kind == 0) {
                      Calendar n = Calendar.getInstance();
                      int dw = n.get(Calendar.DAY_OF_WEEK) - 1;
                      v.setTextViewText(R.id.wHeader, "📍 " + c.siteName + " — " + (ar(c) ? DOW_AR[dw] : DOW_EN[dw]) + " " + n.get(Calendar.DAY_OF_MONTH));
                      v.setTextViewText(R.id.wIcon, icon(d.type));
                      v.setTextViewText(R.id.wTitle, (ar(c) ? "الآن: " : "Now: ") + tn);
                      int add = "N".equals(d.type) ? 720 : 0;
                      v.setTextViewText(R.id.wTimes, typeName(c, d.type) + " · " + posName(c, d.pos) + " · " + hm(c.startMin + add) + (ar(c) ? " ← " : " → ") + hm(c.startMin + add + 720));
                      v.setTextViewText(R.id.wChip, (ar(c) ? "⏳ ينتهي بعد " : "⏳ Ends in ") + left);
                      v.setInt(R.id.wChip, "setBackgroundResource", R.drawable.chip_on);
                      ShiftCalc.Duty[] nx = ShiftCalc.nextSlots(c, now, 5);
                      for (int k = 0; k < 5; k++) {
                          v.setTextViewText(DAY_IDS[k], icon(nx[k].type) + "\n" + c.teamShort[nx[k].team]);
                          v.setInt(DAY_IDS[k], "setBackgroundResource", R.drawable.cell);
                      }
                  } else if (kind == 1) {
                      v.setTextViewText(R.id.wIcon, icon(d.type));
                      v.setTextViewText(R.id.wTitle, c.teamShort[d.team]);
                      v.setTextViewText(R.id.wChip, (ar(c) ? "باقي " : "") + left + (ar(c) ? "" : " left"));
                      v.setInt(R.id.wChip, "setBackgroundResource", R.drawable.chip_on);
                  } else {
                      v.setTextViewText(R.id.wHeader, ar(c) ? "التذكير الجاي" : "Next reminder");
