          cat > 'app/src/main/java/com/mohamed/shifts/WidgetUpdater.java' <<'EOF_FILE'
          package com.mohamed.shifts;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public final class WidgetUpdater {
              public static final String PREFS = "widget";
              public static final String TICK = "com.mohamed.shifts.WIDGET_TICK";
              private static final String[] DOW_AR = {"أحد", "اثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة", "سبت"};
              private static final String[] DOW_EN = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
              private static final int[] DAY_IDS = {R.id.d0, R.id.d1, R.id.d2, R.id.d3, R.id.d4};

              private WidgetUpdater() {}

              public static void save(Context ctx, String json) {
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString("cfg", json).apply();
                  updateAll(ctx);
              }

              static ShiftCalc.Config load(Context ctx) {
                  SharedPreferences p = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  String s = p.getString("cfg", null);
                  if (s == null) return null;
                  try {
                      JSONObject o = new JSONObject(s);
                      ShiftCalc.Config c = new ShiftCalc.Config();
                      String[] a = o.getString("anchor").split("-");
                      c.anchorY = Integer.parseInt(a[0]);
                      c.anchorM = Integer.parseInt(a[1]);
                      c.anchorD = Integer.parseInt(a[2]);
                      JSONArray off = o.getJSONArray("off");
                      c.off = new int[]{off.getInt(0), off.getInt(1), off.getInt(2)};
                      c.team = o.getInt("team");
                      c.startMin = o.getInt("start");
                      c.fpS = o.getInt("fpS");
                      c.fpE = o.getInt("fpE");
                      c.lang = o.optString("lang", "ar");
                      c.header = o.optString("header", "");
                      c.mode = o.optString("mode", "");
                      c.siteName = o.optString("siteName", "");
                      JSONArray tn = o.optJSONArray("teamNames");
                      JSONArray ts = o.optJSONArray("teamShort");
                      for (int i = 0; i < 3; i++) {
                          if (tn != null && i < tn.length()) c.teamNames[i] = tn.optString(i);
                          if (ts != null && i < ts.length()) c.teamShort[i] = ts.optString(i);
                      }
                      return c;
                  } catch (Exception e) {
                      return null;
                  }
              }

              public static void updateAll(Context ctx) {
                  AppWidgetManager m = AppWidgetManager.getInstance(ctx);
                  ShiftCalc.Config c = load(ctx);
                  long now = System.currentTimeMillis();
                  ShiftCalc.State s = null;
                  try { if (c != null) s = ShiftCalc.compute(c, now); } catch (Exception e) { s = null; }
                  int n = push(ctx, m, WidgetMedium.class, R.layout.widget_medium, c, s, 0)
                          + push(ctx, m, WidgetSmall.class, R.layout.widget_small, c, s, 1)
                          + push(ctx, m, WidgetOff.class, R.layout.widget_off, c, s, 2);
                  if (n == 0) { cancel(ctx); return; }
                  scheduleNext(ctx, now, s);
              }

              private static int push(Context ctx, AppWidgetManager m, Class<?> cls, int layout, ShiftCalc.Config c, ShiftCalc.State s, int kind) {
                  int[] ids = m.getAppWidgetIds(new ComponentName(ctx, cls));
                  if (ids == null || ids.length == 0) return 0;
                  RemoteViews v = new RemoteViews(ctx.getPackageName(), layout);
                  Intent open = new Intent(ctx, MainActivity.class).setAction(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                  v.setOnClickPendingIntent(R.id.wRoot, PendingIntent.getActivity(ctx, kind, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
                  if (c == null || s == null) {
                      v.setTextViewText(R.id.wTitle, "افتح التطبيق مرة");
                  } else if ("site".equals(c.mode)) {
                      try { fillSite(ctx, v, c, kind); } catch (Exception e) { v.setTextViewText(R.id.wTitle, "افتح التطبيق مرة"); }
                  } else if (kind == 0) {
                      fillMedium(v, c, s);
                  } else if (kind == 1) {
                      fillSmall(v, c, s);
                  } else {
                      fillOff(v, c, s);
                  }
                  m.updateAppWidget(ids, v);
                  return ids.length;
              }

              private static boolean ar(ShiftCalc.Config c) { return !"en".equals(c.lang); }

              private static String hm(int min) {
                  min = ((min % 1440) + 1440) % 1440;
                  return String.format(java.util.Locale.US, "%02d:%02d", min / 60, min % 60);
              }

              private static String typeName(ShiftCalc.Config c, String t) {
                  if ("D".equals(t)) return ar(c) ? "نهار" : "Day";
                  if ("N".equals(t)) return ar(c) ? "ليل" : "Night";
                  return ar(c) ? "راحة" : "Off";
              }

              private static String icon(String t) { return "D".equals(t) ? "☀️" : "N".equals(t) ? "🌙" : "🛋️"; }

              private static String posName(ShiftCalc.Config c, int pos) {
                  return ar(c) ? (pos == 1 ? "أول يوم" : "ثاني يوم") : (pos == 1 ? "1st" : "2nd");
              }

              private static String relDay(ShiftCalc.Config c, ShiftCalc.State s) {
                  Calendar now = Calendar.getInstance();
                  Calendar st = Calendar.getInstance();
                  st.setTimeInMillis(s.shiftStart);
                  int diff = (int) ((ShiftCalc.epochDay(st.get(Calendar.YEAR), st.get(Calendar.MONTH) + 1, st.get(Calendar.DAY_OF_MONTH))
                          - ShiftCalc.epochDay(now.get(Calendar.YEAR), now.get(Calendar.MONTH) + 1, now.get(Calendar.DAY_OF_MONTH))));
                  if (diff == 0) return ar(c) ? ("N".equals(s.type) ? "الليلة" : "اليوم") : "Today";
                  if (diff == 1) return ar(c) ? "بكرة" : "Tomorrow";
                  int dw = st.get(Calendar.DAY_OF_WEEK) - 1;
                  return ar(c) ? DOW_AR[dw] : DOW_EN[dw];
              }

              static String chipText(ShiftCalc.Config c, ShiftCalc.State s) {
                  if ("ON".equals(s.status)) return ar(c) ? "🟢 في الدوام · باقي " + s.hoursLeftText : "🟢 On duty · " + s.hoursLeftText + " left";
                  if ("OFF".equals(s.status)) return ar(c) ? "🛋️ راحة · الدوام بعد " + s.hoursLeftText : "🛋️ Off · shift in " + s.hoursLeftText;
                  return ar(c) ? "⏳ يبدأ بعد " + s.hoursLeftText : "⏳ Starts in " + s.hoursLeftText;
              }

          EOF_FILE

