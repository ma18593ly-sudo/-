            return out;}
          function rHome(){if(isPM())return rHomePM();if(isSite())return rHomeSite();const v=$('v-home');const td=shiftOf(now,C().myTeam);const ms=myShiftAround(now);let h='';const on=ms&&ms.s<=now;
