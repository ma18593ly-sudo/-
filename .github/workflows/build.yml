      - name: Create project files (5)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
          const DEF={cfg:{lang:'ar',theme:'auto',myTeam:0,myName:'',
            teams:[{m:['مصعب','','','']},{m:['سالم','','','']},{m:['حاتم','','','']}],reserve:'',
            start:'08:00',fpStart:'07:30',fpEnd:'07:45',cards:22,logFrom:'05:00',logTo:'06:00',anchor:'2026-11-13',
            uniItems:[{id:'shirt',name:''},{id:'pants',name:''},{id:'shoes',name:''},{id:'coat',name:''},{id:'cap',name:''}]},
            logs:{},events:[],uni:[]};
          let S=JSON.parse(JSON.stringify(DEF));
          function migratePeople(){const c=S.cfg;if(Array.isArray(c.people))return;const used=new Set();S.events.forEach(e=>{used.add(e.p1);used.add(e.p2);});(S.uni||[]).forEach(u=>used.add(u.p));
            const ps=[];(c.teams||DEF.cfg.teams).forEach((tm,i)=>tm.m.forEach((n,j)=>{const id='t'+i+'m'+j;if((n||'').trim()||used.has(id))ps.push({id,name:(n||'').trim(),team:i,sup:j===0,hist:[{team:i,from:'2000-01-01'}]});}));
            ps.push({id:'res',name:(c.reserve||'').trim(),team:'res',sup:false,hist:[{team:'res',from:'2000-01-01'}]});c.people=ps;}
          try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);S.cfg=Object.assign(S.cfg,x.cfg||{});S.logs=x.logs||{};S.events=x.events||[];S.uni=x.uni||[];}
            else{const o=JSON.parse(localStorage.getItem('shiftcfg')||'null');if(o){if(o.team)S.cfg.myTeam=o.team-1;if(o.anchor)S.cfg.anchor=o.anchor;}}}catch(e){}
          migratePeople();save();
          function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
          const C=()=>S.cfg;
          const t=k=>(T[C().lang]&&T[C().lang][k]!=null)?T[C().lang][k]:(T.ar[k]!=null?T.ar[k]:k);
          const L=()=>C().lang;

          // ---------- helpers ----------
          const $=id=>document.getElementById(id);
          const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const pad=n=>String(n).padStart(2,'0');
          const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
          const mins=s=>{const[a,b]=(s||'0:0').split(':').map(Number);return a*60+(b||0);};
          const hm=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);};
          const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
          const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
          const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
          const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
          const utc=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
          const mod=(a,n)=>((a%n)+n)%n;
          const fmt=d=>DAYS[L()][d.getDay()]+' '+d.getDate()+' '+MONTHS[L()][d.getMonth()];
          const fmtS=d=>SDAYS[L()][d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);
          const PAT=['D','D','N','N','O','O'],OFF=[0,4,2];
          function shiftOf(date,team){const diff=Math.round((utc(date)-utc(parse(C().anchor)))/864e5);const i=mod(diff+OFF[team],6);return{type:PAT[i],pos:i%2===0?1:2};}
          function teamOn(date,type){for(let k=0;k<3;k++)if(shiftOf(date,k).type===type)return k;return -1;}
          function shiftTimes(date,type){const st=mins(C().start)+(type==='N'?720:0);const s=new Date(dayStart(date).getTime()+st*6e4);return{s,e:new Date(s.getTime()+720*6e4),fpS:mins(C().fpStart)+(type==='N'?720:0),fpE:mins(C().fpEnd)+(type==='N'?720:0),st};}
          function shiftId(date,type){return ymd(date)+'_'+type;}
          function idToShift(id){const[d,ty]=id.split('_');return{date:parse(d),type:ty};}
          // my shift instances
          function myShiftAround(now,dir){ // dir: 'cur' current-or-next, list helpers
            for(let k=-1;k<14;k++){const d=addDays(now,k),s=shiftOf(d,C().myTeam);if(s.type==='O')continue;const tm=shiftTimes(d,s.type);if(tm.e>now)return{date:d,type:s.type,pos:s.pos,...tm};}
            return null;}
          function myShiftStep(date,type,step){ // next/prev my shift from a shift
            let d=dayStart(date);
            for(let k=0;k<20;k++){
              if(type==='D'&&step>0){type='N';}else if(type==='N'&&step<0){type='D';}else{d=addDays(d,step);type=step>0?'D':'N';}
              if(shiftOf(d,C().myTeam).type===type)return{date:d,type};}
            return null;}
          function lastOrCurrentMyShift(now){const n=myShiftAround(now);if(n&&n.s<=now)return{date:n.date,type:n.type};
            let d=dayStart(now);for(let k=0;k<10;k++){for(const ty of['N','D']){const dd=addDays(d,-k);if(shiftOf(dd,C().myTeam).type===ty&&shiftTimes(dd,ty).e<=now)return{date:dd,type:ty};}}return n;}

          function P(id){return (C().people||[]).find(p=>p.id===id);}
          function teamAt(p,date){let tm=p.team;const h=(p.hist||[]).slice().sort((a,b)=>a.from<b.from?-1:1);if(h.length){tm=h[0].team;h.forEach(x=>{if(x.from<=date)tm=x.team;});}return tm;}
          function activePeople(){return (C().people||[]).filter(p=>!p.left);}
          function teamMembers(k){return activePeople().filter(p=>p.team===k).sort((a,b)=>(b.sup?1:0)-(a.sup?1:0));}
          function personList(){const o=[];[0,1,2,'res'].forEach(k=>teamMembers(k).forEach(p=>o.push({id:p.id,name:pName(p.id),team:p.team})));return o;}
          function pName(id){const p=P(id);if(!p)return id||'';return (p.name||'').trim()||(p.team==='res'?t('reserve'):t('member'));}
          function teamLabel(k){return k==='res'?t('reserve'):teamName(k);}
          function teamName(i){const s=activePeople().find(p=>p.team===i&&p.sup);return t('teamOf')+' '+(s?pName(s.id):(i+1));}
          function getLog(id){return S.logs[id]||(S.logs[id]={recv:null,hand:null,cardNote:'',vis:false,wrk:false,notes:'',inc:[]});}
          function hasLog(id){const g=S.logs[id];return !!g&&(g.recv!=null||g.hand!=null||g.notes||g.vis||g.wrk||(g.inc&&g.inc.length));}
          function eventsOn(date){const k=ymd(date);return S.events.filter(e=>e.from<=k&&(e.to||e.from)>=k);}
          function evText(e){let s=t('ev_'+e.type)+': '+pName(e.p1);if(e.type==='coverage'&&e.p2)s+=' — '+t('coversFor')+' '+pName(e.p2);if(e.type==='swap'&&e.p2)s+=' — '+t('swapWith')+' '+pName(e.p2);return s;}

          // ---------- platform ----------
          const AB=window.AndroidBridge;
          function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1600);}
          function copyText(s){try{if(AB&&AB.copy){AB.copy(s);toast(t('copied'));return;}}catch(e){}
            if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>toast(t('copied')),()=>fallbackCopy(s));else fallbackCopy(s);}
          function fallbackCopy(s){const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('copied'));}catch(e){}ta.remove();}
          function shareText(s){try{if(AB&&AB.share){AB.share(s);return;}}catch(e){}if(navigator.share)navigator.share({text:s}).catch(()=>{});else copyText(s);}
          EOF_FILE

      - name: Create project files (6)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
          function printHtml(html,title){try{if(AB&&AB.print){AB.print(html,title);return;}}catch(e){}
            const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();w.print();}}
          function sysDark(){try{if(AB&&AB.isDark)return !!AB.isDark();}catch(e){}return !window.matchMedia||window.matchMedia('(prefers-color-scheme: dark)').matches;}
          function applyTheme(){const dark=C().theme==='dark'||(C().theme==='auto'&&sysDark());document.body.classList.toggle('light',!dark);
            try{if(AB&&AB.setBars)AB.setBars(dark?'#0f172a':'#f1f5f9',!dark);}catch(e){}}
          window.onSysTheme=()=>{applyTheme();};
          function applyLang(){document.documentElement.lang=L();document.documentElement.dir=L()==='ar'?'rtl':'ltr';document.title=t('app');}

          // ---------- sheet / confirm ----------
          function openSheet(html){$('panel').innerHTML=html;$('sheet').classList.add('show');}
          function closeSheet(){$('sheet').classList.remove('show');}
          $('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
          function confirmBox(msg,fn){openSheet(`<h3>${esc(msg)}</h3><div class="btns"><button class="btn dang" id="cfY">${t('yes')}</button><button class="btn" id="cfN">${t('cancel')}</button></div>`);
            $('cfY').onclick=()=>{closeSheet();fn();};$('cfN').onclick=closeSheet;}

          // ---------- navigation ----------
          const TABS=[['home','🏠'],['cal','🗓️'],['log','📝'],['team','👥'],['rep','📊']];
          let view='home',prevView='home';
          function go(v){if(v==='set'&&view!=='set')prevView=view;view=v;render();window.scrollTo(0,0);}
          window.handleBack=()=>{if($('sheet').classList.contains('show')){closeSheet();return true;}if(view!=='home'){go(view==='set'?prevView:'home');return true;}return false;};
          $('gear').onclick=()=>go(view==='set'?prevView:'set');

          // ---------- views ----------
          let now=new Date(),calView=new Date(now.getFullYear(),now.getMonth(),1),logSel=null,evTab='all',repOut='';
          function render(){now=new Date();applyLang();applyTheme();
            $('appTitle').textContent=(view==='set'?'⚙️ '+t('set'):'🗓️ '+t('app'));$('gear').textContent=view==='set'?'✕':'⚙️';
            $('nav').innerHTML=TABS.map(([k,i])=>`<button data-v="${k}" class="${view===k?'on':''}"><span>${i}</span>${t(k)}</button>`).join('');
            $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));
            document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+view));
            ({home:rHome,cal:rCal,log:rLog,team:rTeam,rep:rRep,set:rSet})[view]();}

          function logReminderActive(sh){if(!sh||sh.type!=='N')return false;const g=S.logs[shiftId(sh.date,'N')];if(g&&g.vis&&g.wrk)return false;
            const d1=addDays(sh.date,1);const a=new Date(d1.getTime()+mins(C().logFrom)*6e4);const e=shiftTimes(sh.date,'N').e;return now>=a&&now<e;}

          function rHome(){const v=$('v-home');const td=shiftOf(now,C().myTeam);const ms=myShiftAround(now);let h='';
            const on=ms&&ms.s<=now;
            if(on&&logReminderActive(ms))h+=`<div class="alert" data-go="log">${t('logReminder')}</div>`;
            if(ms){const ty=ms.type;
              h+=`<div class="hero ${on?ty:td.type}"><div class="ico">${ICO[on?ty:td.type]}</div>
              <div class="lbl">${t('today')} — ${fmt(now)} · ${esc(teamName(C().myTeam))}</div>`;
              if(on)h+=`<div class="big">${t('onDuty')} — ${t(ty)}</div><div class="sub">${t('ends')} ${hm(ms.st+720)} · ${ms.pos===1?t('first'):t('second')}</div>`;
              else h+=`<div class="big">${td.type==='O'?t('O'):t(td.type)+' · '+(td.pos===1?t('first'):t('second'))}</div>
                <div class="sub">${t('yourNext')}: ${ICO[ty]} ${t(ty)} — ${fmt(ms.date)}</div>
                <span class="badge">${t('fp')} ${hm(ms.fpS)}–${hm(ms.fpE)} · ${t('work')} ${hm(ms.st)}</span>`;
              h+=`</div>`;}
            // next off
            let off=null;for(let k=0;k<14;k++){const d=addDays(now,k),s=shiftOf(d,C().myTeam);if(s.type==='O'&&s.pos===1&&(k>0||td.type!=='O')){off=d;break;}}
            const nx=ms&&on?myShiftStep(ms.date,ms.type,1):ms;
            h+=`<div class="row"><div class="stat"><div class="k">${t('nextShift')}</div><div class="v">${nx?ICO[nx.type]+' '+t(nx.type)+' — '+fmtS(nx.date):'—'}</div></div>
               <div class="stat"><div class="k">${t('nextOff')}</div><div class="v">${off?'🛋️ '+fmtS(off):'—'}</div></div></div>`;
            // tasks for current/last shift
            const cur=lastOrCurrentMyShift(now);
            if(cur){const id=shiftId(cur.date,cur.type),g=S.logs[id]||{};const isOn=on;
              h+=`<div class="card"><h3>${t('tasks')} <span class="muted">${isOn?t('current'):t('last')}: ${t(cur.type)} ${fmtS(cur.date)}</span></h3>`;
              const st=(ok,txt)=>`<span class="st ${ok?'ok':'bad'}">${ok?'✓ ':''}${txt}</span>`;
              h+=`<div class="task"><span class="ti">🪪</span><span class="tx">${t('cardsRecv')}</span>${st(g.recv!=null,g.recv!=null?g.recv+' / '+C().cards:t('notDone'))}</div>`;
              if(cur.type==='N')h+=`<div class="task"><span class="ti">📒</span><span class="tx">${t('logChange')} <span class="muted">${C().logFrom}–${C().logTo}</span></span>${st(g.vis&&g.wrk,g.vis&&g.wrk?t('done'):t('notDone'))}</div>`;
              h+=`<div class="task"><span class="ti">📝</span><span class="tx">${t('handNotes')}</span>${st(!!g.notes,g.notes?t('done'):t('notDone'))}</div>`;
              h+=`<div class="task"><span class="ti">🪪</span><span class="tx">${t('cardsHand')}</span>${st(g.hand!=null,g.hand!=null?g.hand+' / '+C().cards:t('notDone'))}</div>`;
              h+=`<button class="btn pri full" data-log="${id}">${t('openLog')}</button></div>`;}
            // two weeks
            h+=`<div class="sec">${t('days')==='يوم'?'الأيام الجاية':'Upcoming days'}</div><div class="week">`;
