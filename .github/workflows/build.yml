      - name: Create project files (13)
        run: |
          cat > 'gradle.properties' <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF_FILE
          cat > 'settings.gradle' <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Shifts"
          include ':app'
          EOF_FILE

      - name: Prepare signing key
        run: base64 -d app/ks.b64 > app/shifts.keystore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Shifts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Shifts-APK
          path: Shifts.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shifts v2.2 build ${{ github.run_number }}
          files: Shifts.apk
