          package com.mohamed.shifts;

          import java.util.Calendar;

          /** Pure-Java rotation maths for the home-screen widgets (no Android imports, unit-testable). */
          public final class ShiftCalc {
              public static final class Config {
                  public int anchorY = 2026, anchorM = 11, anchorD = 13;
                  public int[] off = {0, 4, 2};
                  public int team = 0;
                  public int startMin = 480, fpS = 450, fpE = 465;
                  public String lang = "ar";
                  public String header = "";
                  public String mode = "";
                  public String siteName = "";
                  public String[] teamNames = {"", "", ""};
                  public String[] teamShort = {"1", "2", "3"};
              }

              /** Which team works a given 12h slot. */
              public static final class Duty {
                  public int team;
                  public String type;
                  public int pos;
                  public long start, end;
              }

              public static final class State {
                  public String status;          // ON | BEFORE | OFF
                  public String type;            // D | N  (current or next shift)
                  public int pos;                // 1 | 2
                  public long shiftStart, shiftEnd;
                  public String hoursLeftText;   // "18 س" / "1 يوم و6 س" / "أقل من ساعة"
                  public String todayType;       // D | N | O (calendar today)
                  public int todayPos;
                  public String[] days = new String[5];
                  public int[] dayDow = new int[5];
                  public int nextOffDay, nextOffMonth, nextOffDow;
                  public String nextOffText;     // "اليوم" or "بعد 2 يوم"
                  public long nextOffInDays;
              }

              private static final char[] PAT = {'D', 'D', 'N', 'N', 'O', 'O'};

              private ShiftCalc() {}

              static long epochDay(int y, int m, int d) {
                  y -= m <= 2 ? 1 : 0;
                  long era = (y >= 0 ? y : y - 399) / 400;
                  long yoe = y - era * 400;
                  long doy = (153L * (m + (m > 2 ? -3 : 9)) + 2) / 5 + d - 1;
                  long doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
                  return era * 146097 + doe - 719468;
              }

              private static int mod(long a, int n) { return (int) (((a % n) + n) % n); }

              private static int idx(Config c, long ed, int team) {
                  return mod(ed - epochDay(c.anchorY, c.anchorM, c.anchorD) + c.off[team], 6);
              }

              private static Calendar calOf(long ed) {
                  // civil-from-days
                  long z = ed + 719468, era = (z >= 0 ? z : z - 146096) / 146097, doe = z - era * 146097;
                  long yoe = (doe - doe / 1460 + doe / 36524 - doe / 146096) / 365, y = yoe + era * 400;
                  long doy = doe - (365 * yoe + yoe / 4 - yoe / 100), mp = (5 * doy + 2) / 153;
                  int d = (int) (doy - (153 * mp + 2) / 5 + 1), m = (int) (mp < 10 ? mp + 3 : mp - 9);
                  Calendar c = Calendar.getInstance();
                  c.clear();
                  c.set((int) (y + (m <= 2 ? 1 : 0)), m - 1, d, 0, 0, 0);
                  return c;
              }

              public static String hoursText(long ms, String lang) {
                  boolean ar = !"en".equals(lang);
                  long h = ms / 3600000L;
                  if (h < 1) return ar ? "أقل من ساعة" : "<1h";
                  if (h >= 24) {
                      long d = h / 24, r = h % 24;
                      if (ar) return r == 0 ? d + " يوم" : d + " يوم و" + r + " س";
                      return r == 0 ? d + "d" : d + "d " + r + "h";
                  }
                  return ar ? h + " س" : h + "h";
              }

              private static Duty slot(Config c, long ed, char ty) {
                  Duty d = new Duty();
                  d.type = String.valueOf(ty);
                  for (int t = 0; t < 3; t++) {
                      int i = idx(c, ed, t);
                      if (PAT[i] == ty) { d.team = t; d.pos = i % 2 == 0 ? 1 : 2; break; }
                  }
                  d.start = calOf(ed).getTimeInMillis() + (c.startMin + (ty == 'N' ? 720 : 0)) * 60000L;
                  d.end = d.start + 720 * 60000L;
                  return d;
              }

              /** Team on duty at {@code now} (site phone). */
              public static Duty dutyNow(Config c, long now) {
                  Calendar n = Calendar.getInstance();
                  n.setTimeInMillis(now);
                  long today = epochDay(n.get(Calendar.YEAR), n.get(Calendar.MONTH) + 1, n.get(Calendar.DAY_OF_MONTH));
                  for (long ed = today - 1; ed <= today; ed++) {
                      for (char ty : new char[]{'D', 'N'}) {
                          Duty d = slot(c, ed, ty);
                          if (d.start <= now && now < d.end) return d;
                      }
                  }
                  return slot(c, today, 'D');
              }

              /** The {@code count} slots after the current one. */
              public static Duty[] nextSlots(Config c, long now, int count) {
                  Duty cur = dutyNow(c, now);
                  Duty[] out = new Duty[count];
                  Calendar st = Calendar.getInstance();
                  st.setTimeInMillis(cur.start);
                  long ed = epochDay(st.get(Calendar.YEAR), st.get(Calendar.MONTH) + 1, st.get(Calendar.DAY_OF_MONTH));
                  char ty = cur.type.charAt(0);
                  for (int k = 0; k < count; k++) {
                      if (ty == 'D') ty = 'N'; else { ty = 'D'; ed++; }
                      out[k] = slot(c, ed, ty);
                  }
                  return out;
              }

              public static State compute(Config c, long now) {
                  if (c.team < 0 || c.team > 2) c.team = 0;
                  if (c.off == null || c.off.length != 3) c.off = new int[]{0, 4, 2};
                  State s = new State();
                  Calendar n = Calendar.getInstance();
                  n.setTimeInMillis(now);
                  long today = epochDay(n.get(Calendar.YEAR), n.get(Calendar.MONTH) + 1, n.get(Calendar.DAY_OF_MONTH));
                  int ti = idx(c, today, c.team);
                  s.todayType = String.valueOf(PAT[ti]);
                  s.todayPos = ti % 2 == 0 ? 1 : 2;
                  for (int k = -1; k < 15; k++) {
                      long ed = today + k;
                      int i = idx(c, ed, c.team);
                      if (PAT[i] == 'O') continue;
                      long start = calOf(ed).getTimeInMillis() + (c.startMin + (PAT[i] == 'N' ? 720 : 0)) * 60000L;
                      long end = start + 720 * 60000L;
                      if (end > now) {
                          s.type = String.valueOf(PAT[i]);
                          s.pos = i % 2 == 0 ? 1 : 2;
                          s.shiftStart = start;
                          s.shiftEnd = end;
                          break;
                      }
                  }
                  if (s.shiftStart <= now) {
                      s.status = "ON";
                      s.hoursLeftText = hoursText(s.shiftEnd - now, c.lang);
                  } else {
                      s.status = "O".equals(s.todayType) ? "OFF" : "BEFORE";
                      s.hoursLeftText = hoursText(s.shiftStart - now, c.lang);
                  }
                  for (int k = 0; k < 5; k++) {
                      s.days[k] = String.valueOf(PAT[idx(c, today + k, c.team)]);
                      s.dayDow[k] = calOf(today + k).get(Calendar.DAY_OF_WEEK);
                  }
