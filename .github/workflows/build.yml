            $('bC').onclick=()=>copyText(JSON.stringify(S));$('bR').onclick=()=>doRestore($('bT').value);
            $('bX').onclick=()=>confirmBox(t('resetQ'),()=>{S={cfg:S.cfg,logs:{},events:[],uni:[],warns:[],v:3};save();render();});}

          try{const raw=localStorage.getItem(KEY);if(raw)S=normalize(JSON.parse(raw));
