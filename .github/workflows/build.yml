          function updBell(){const n=dueList().length;const b=$('bell');if(b)b.innerHTML='🔔'+(n?`<span class="bdg">${n}</span>`:'');if(lastDue>=0&&n>lastDue){const x=dueList().slice(-1)[0];if(x)toast('🔔 '+x.text);try{navigator.vibrate&&navigator.vibrate(300);}catch(e){}}lastDue=n;}
          function notesSheet(){const k=ymd(now);const due=S.notes.filter(isDue),up=S.notes.filter(x=>!x.done&&!isDue(x)).sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1),dn=S.notes.filter(x=>x.done).slice(-10).reverse();
            const row=x=>`<div class="item"><div class="h"><span>📌 ${esc(x.text)}</span><span style="white-space:nowrap">${x.done?'':`<button class="btn sm pri" data-ndone="${x.id}">✓</button> `}<button class="btn sm dang" data-ndel="${x.id}">✕</button></span></div><div class="b">${fmt(parse(x.date))} ${x.time||''}</div></div>`;
            openSheet(`<h3>🔔 ${t('notes2')}</h3><div class="item"><label>${t('noteText')}</label><input id="nT"><div class="row"><div><label>${t('date')}</label><input type="date" id="nD" value="${k}"></div><div><label>${t('time')}</label><input type="time" id="nH" value="09:00"></div></div><button class="btn pri full" id="nA">${t('addNote')}</button></div>`+
              (due.length?`<div class="sec">${t('due')}</div>`+due.map(row).join(''):'')+(up.length?`<div class="sec">${t('upcomingN')}</div>`+up.map(row).join(''):'')+(dn.length?`<div class="sec">${t('doneN')}</div>`+dn.map(row).join(''):'')+(!S.notes.length?`<div class="empty-msg">${t('noNotes2')}</div>`:'')+`<button class="btn full" id="nC">${t('close')}</button>`);
            $('nC').onclick=()=>{closeSheet();render();};
