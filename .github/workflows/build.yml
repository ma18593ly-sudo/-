      - name: Create project files (20)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
              wz.step++;rSetup();window.scrollTo(0,0);};}
          function applyMe(){const c=C();if(wz.mode==='site'){c.siteId=wz.site||'compound';c.pin=wz.pin||'';c.meId=null;if(c.notifOn==null)c.notifOn=true;save();return;}const nm=wz.name.trim();if(!nm)return;c.myName=nm;
            if(wz.mode==='pm'){c.meId=null;save();return;}c.myTeam=wz.team;
            let m=meP();if(!m)m=activePeople().find(p=>p.team===wz.team&&(p.name||'').trim()===nm);
            if(!m&&wz.mode==='sup')m=activePeople().find(p=>p.team===wz.team&&p.role==='sup');
            const role=wz.mode==='sup'?'sup':wz.mrole,si=role==='res'?'compound':wz.site;
            if(!m){m={id:'p'+uid(),name:nm,team:wz.team,role:'mem',site:si,hist:[{team:wz.team,from:'2000-01-01',site:si}]};people().push(m);}
            else{m.name=nm;if(m.team!==wz.team||(m.site||'compound')!==si)movePerson(m,wz.team,si,ymd(now));}
            setRole(m,role);c.meId=m.id;save();}
          // ================= EVENTS =================
          function evText(e){const n=pName(e.p1);
            if(e.type==='absence'||e.type==='leave'){const ab=P(e.p1);const slots=absSlots(e);const cv=slots.filter(x=>x.cov).length;
              return `${e.type==='leave'?'🏖️':'❌'} ${t('ev_'+e.type)}: ${n}`+(ab&&ab.role!=='res'?` 📍${siteName(siteAt(ab,e.from))}`:'')+(slots.length?` — ${t('covered')} ${cv}/${slots.length}`:'');}
            if(e.type==='swap')return `🔁 ${t('ev_swap')}: ${n} ${t('swapWith')} ${pName(e.p2)}`;return e.type;}
          function asgText(a){return a.for?`➕ ${pName(a.pid)} ${t('covers')} ${pName(a.for)} — ${ICO[a.type]} ${fmtK(a.k)}`:`📞 ${t('ev_callout')}: ${pName(a.pid)} — ${ICO[a.type]} ${t(a.type)} ${fmtK(a.k)} · ${t('forTeam')} ${teamName(a.team)} 📍${siteName(a.site)}`;}
          function absSlots(e){const p=P(e.p1);if(!p||p.role==='res')return[];const o=[];kRange(e.from,e.to).forEach(k=>{if(!employedOn(p,k))return;const tm=teamAt(p,k),ty=teamShift(tm,k);if(ty==='O')return;
            o.push({k,type:ty,team:tm,site:siteAt(p,k),cov:S.asg.find(a=>a.for===p.id&&a.k===k&&a.type===ty)});});return o;}
          function evDates(e){return e.type==='swap'?e.from+(e.back?' ↔ '+e.back:''):e.from+(e.to&&e.to!==e.from?' → '+e.to:'');}
          let evFilter='all';
          function eventsList(list,withFilter,asgList){let h='';if(withFilter)h+=`<div class="tabs">${['all','absence','leave','callout','swap'].map(k=>`<button data-evf="${k}" class="${evFilter===k?'on':''}">${k==='all'?t('all'):t('ev_'+k)}</button>`).join('')}</div>`;
            const items=[];if(evFilter!=='callout'||!withFilter)list.filter(e=>!withFilter||evFilter==='all'||e.type===evFilter).forEach(e=>items.push({d:e.from,h:`<div class="item" ${e.type!=='swap'?`data-abs="${e.id}" style="cursor:pointer"`:''}><div class="h"><span>${esc(evText(e))}</span><button class="btn sm dang" data-delev="${e.id}">${t('del')}</button></div><div class="b">${evDates(e)}${e.note?'\n'+esc(e.note):''}</div></div>`}));
            if(!withFilter||evFilter==='all'||evFilter==='callout')(asgList||S.asg).filter(a=>!withFilter||evFilter!=='callout'||!a.for).forEach(a=>items.push({d:a.k,h:`<div class="item"><div class="h"><span>${esc(asgText(a))}</span><button class="btn sm dang" data-delasg="${a.id}">${t('del')}</button></div>${a.note?`<div class="b">${esc(a.note)}</div>`:''}</div>`}));
            items.sort((a,b)=>a.d<b.d?1:-1);h+=`<div class="card">`+(items.length?items.map(x=>x.h).join(''):`<div class="empty-msg">${t('noEvents')}</div>`)+'</div>';return h;}
          function bindEvents(v,re){v.querySelectorAll('[data-evf]').forEach(b=>b.onclick=()=>{evFilter=b.dataset.evf;re();});
            v.querySelectorAll('[data-delev]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();confirmBox(t('confirmDel'),()=>{const e=S.events.find(x=>x.id===b.dataset.delev);if(e&&(e.type==='absence'||e.type==='leave'))S.asg=S.asg.filter(a=>!(a.for===e.p1&&a.k>=e.from&&a.k<=e.to));S.events=S.events.filter(x=>x.id!==b.dataset.delev);save();re();});});
            v.querySelectorAll('[data-delasg]').forEach(b=>b.onclick=()=>confirmBox(t('delAsgQ'),()=>{S.asg=S.asg.filter(a=>a.id!==b.dataset.delasg);save();re();}));
            v.querySelectorAll('[data-abs]').forEach(b=>b.onclick=()=>{const e=S.events.find(x=>x.id===b.dataset.abs);if(e)absCoverage(e);});}
          function evForm(type,pid,dateK){type=type||'absence';if(type==='callout')return slotForm(pid,dateK);const k0=dateK||ymd(now);if(!pid&&isMember()&&meP())pid=C().meId;
            openSheet(`<h3 id="efH"></h3><div class="tabs">${['absence','leave','swap'].map(k=>`<button data-eft="${k}" class="${type===k?'on':''}">${t('ev_'+k)}</button>`).join('')}<button data-eft="callout">📞 ${t('ev_callout')}</button></div>
            <label>${t('person')}</label><select id="efP">${personOpts(pid)}</select>
            <div class="row"><div><label id="efFl">${t('date')}</label><input type="date" id="efF" value="${k0}"></div><div id="efTw"><label>${t('to')}</label><input type="date" id="efT" value="${k0}"></div></div>
            <div id="efSw"><label>${t('swapWith')}</label><select id="efP2">${personOpts()}</select><label>${t('backDate')}</label><input type="date" id="efB"></div>
            <div id="efInfo"></div><label>${t('note')}</label><input id="efN">
            <div class="btns"><button class="btn pri" id="efOk">${t('save')}</button><button class="btn" id="efC">${t('cancel')}</button></div>`);let ty=type;
            const show=(id,on)=>$(id).style.display=on?'block':'none';
            const upd=()=>{$('efH').textContent=t('ev_'+ty);show('efTw',ty!=='swap');show('efSw',ty==='swap');$('efFl').textContent=ty==='swap'?t('date'):t('from');
              let info='';const k=$('efF').value,pidv=$('efP').value;
              if(ty!=='swap'&&k){const to=$('efT').value&&$('efT').value>=k?$('efT').value:k;const n=absSlots({p1:pidv,from:k,to}).length;info=`<div class="muted" style="margin-top:6px">${n?`${t('leaveSlots')}: ${n}`:t('noSlots')}</div>`;}
              if(ty==='swap'){const p1=P(pidv),p2=P($('efP2').value);if(p1&&p2&&k){const s=teamShift(teamAt(p2,k),k);
                if(s==='O')info=`<div class="muted" style="margin-top:6px">${esc(pName(p2.id))}: ${t('noShiftThatDay')}</div>`;else info=`<div class="muted" style="margin-top:6px">${esc(pName(p1.id))} → ${ICO[s]} ${t(s)} ${fmtK(k)}</div>`+confBox(conflicts(p1.id,k,s));
                const b=$('efB').value;if(b){const s2=teamShift(teamAt(p1,b),b);if(s2!=='O')info+=`<div class="muted" style="margin-top:6px">${esc(pName(p2.id))} → ${ICO[s2]} ${t(s2)} ${fmtK(b)}</div>`+confBox(conflicts(p2.id,b,s2));}}}
              $('efInfo').innerHTML=info;};
          EOF_FILE

      - name: Create project files (21)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
            $('panel').querySelectorAll('[data-eft]').forEach(b=>b.onclick=()=>{if(b.dataset.eft==='callout'){slotForm(null,$('efF').value);return;}ty=b.dataset.eft;$('panel').querySelectorAll('[data-eft]').forEach(x=>x.classList.toggle('on',x===b));upd();});
            ['efP','efF','efT','efP2','efB'].forEach(id=>$(id).addEventListener('change',upd));$('efC').onclick=closeSheet;
            $('efOk').onclick=()=>{const p1=$('efP').value,f=$('efF').value;if(!p1||!f)return;const note=$('efN').value.trim();let e;
              if(ty!=='swap'){let to=$('efT').value||f;if(to<f)to=f;e={id:uid(),type:ty,p1,from:f,to,note};}
              else{const p2=$('efP2').value;if(!p2||p2===p1)return;const st=teamShift(teamAt(P(p2),f),f);if(st==='O'){toast(t('noShiftThatDay'));return;}e={id:uid(),type:'swap',p1,p2,from:f,to:f,st,note};
                const b=$('efB').value;if(b){const s2=teamShift(teamAt(P(p1),b),b);if(s2!=='O'){e.back=b;e.st2=s2;}}}
              S.events.push(e);save();toast(t('saved'));if(e.type!=='swap'&&absSlots(e).length)absCoverage(e);else{closeSheet();render();}};
            upd();}
          function absCoverage(e){const slots=absSlots(e);const p=P(e.p1);
            let h=`<h3>${esc(evText(e))}</h3><div class="muted" style="margin-bottom:8px">${evDates(e)}</div>`;
            if(!slots.length)h+=`<div class="empty-msg">${t('noSlots')}</div>`;else h+=`<div class="sec">${t('coverAll')}</div>`+slots.map(x=>`<div class="tl" style="flex-wrap:wrap"><span>${ICO[x.type]} ${fmtK(x.k)} <span class="muted">📍${esc(siteName(x.site))}</span></span>`+
              (x.cov?`<span class="O-t">✓ ${esc(pName(x.cov.pid))} <button class="btn sm dang" data-delasg="${x.cov.id}">✕</button></span>`:`<button class="btn sm pri" data-cover="${x.k}|${x.type}|${x.team}|${x.site}|${e.p1}">${t('cover')}</button>`)+`</div>`).join('');
            h+=`<button class="btn pri full" id="acC">${t('close')}</button>`;openSheet(h);$('acC').onclick=()=>{closeSheet();render();};bindSlots($('panel'),()=>absCoverage(e));}
          function candList(k,ty,tm,exclude){return candidates(k,ty,exclude,tm).map(c=>{const fh=h=>h===null?'72+':Math.round(h);
            return `<div class="item" data-cand="${c.id}" style="cursor:pointer;${c.conf.length?'opacity:.55':''}"><div class="h"><span>${c.conf.length?'⚠️':'✅'} ${esc(c.name)}${c.role==='res'?' <span class="tag res">'+t('reserve')+'</span>':''}</span><span class="muted">${esc(teamName(c.team))}</span></div>
              <div class="b">⏮ ${t('restB')} ${fh(c.bef)}${t('hS')} · ⏭ ${t('restA')} ${fh(c.aft)}${t('hS')}${c.conf.length?'\n⚠️ '+c.conf.map(esc).join('\n⚠️ '):''}</div></div>`;}).join('');}
          function pickCover(k,ty,tm,site,forPid,back){const si=slotInfo(k,ty);const inSlot=[].concat(...si.sites.map(s=>s.present.map(p=>p.id).concat(s.asg.map(a=>a.pid),s.swIn)));
            const excl=inSlot.concat(forPid?[forPid]:[]).concat(S.asg.filter(a=>a.k===k&&a.type===ty).map(a=>a.pid));
            openSheet(`<h3>${t('pickTitle')}</h3><div class="item"><div class="b" style="color:var(--text)">${ICO[ty]} ${t(ty)} — ${fmt(parse(k))}\n${esc(teamName(tm))} · 📍${esc(siteName(site))}${forPid?'\n'+t('inPlaceOf')+': '+esc(pName(forPid)):''}</div></div><p class="muted" style="margin:6px 0">${t('pickSub')}</p>${candList(k,ty,tm,excl)}<button class="btn full" id="pcC">${t('cancel')}</button>`);
            $('pcC').onclick=()=>{if(back)back();else closeSheet();};
            $('panel').querySelectorAll('[data-cand]').forEach(b=>b.onclick=()=>{S.asg.push({id:uid(),k,type:ty,team:tm,site,pid:b.dataset.cand,for:forPid||null,note:''});save();toast(t('assignDone'));if(back)back();else{closeSheet();render();}});}
          function slotForm(pid,k0,ty0,tm0,back){k0=k0||ymd(now);const ty=ty0||'N';const tm=tm0!=null?tm0:teamOn(parse(k0),ty);
            openSheet(`<h3>📞 ${t('ev_callout')}</h3><div class="sec">${t('chooseSlot')}</div><div class="row"><div><label>${t('date')}</label><input type="date" id="sfD" value="${k0}"></div><div><label>${t('shiftT')}</label><select id="sfS"><option value="D" ${ty==='D'?'selected':''}>☀️ ${t('D')}</option><option value="N" ${ty==='N'?'selected':''}>🌙 ${t('N')}</option></select></div></div>
            <div class="row"><div><label>${t('forTeam')}</label><select id="sfT">${teamOpts(tm)}</select></div><div><label>${t('site')}</label><select id="sfSi">${siteOpts('compound')}</select></div></div>
            <div id="sfInfo"></div><div class="btns"><button class="btn pri" id="sfOk">${pid?t('save'):t('choosePerson')}</button>${pid?`<button class="btn" id="sfAlt">${t('availability')}</button>`:''}<button class="btn" id="sfC">${t('cancel')}</button></div>`);
            let touched=tm0!=null;const val=()=>({k:$('sfD').value||ymd(now),ty:$('sfS').value,tm:+$('sfT').value,si:$('sfSi').value});
            const upd=()=>{const v=val();if(!touched){const x=teamOn(parse(v.k),v.ty);if(x>=0)$('sfT').value=x;}const v2=val();
              $('sfInfo').innerHTML=pid?`<div class="muted" style="margin-top:6px">${esc(pName(pid))}</div>`+confBox(conflicts(pid,v2.k,v2.ty,null,v2.tm)):'';};
            ['sfD','sfS','sfSi'].forEach(id=>$(id).addEventListener('change',upd));$('sfT').addEventListener('change',()=>{touched=true;upd();});upd();
            $('sfC').onclick=()=>{if(back)back();else closeSheet();};
            const again=()=>{const v=val();slotForm(pid,v.k,v.ty,v.tm,back);};
            if($('sfAlt'))$('sfAlt').onclick=()=>{const v=val();pickCover(v.k,v.ty,v.tm,v.si,null,back||(()=>{closeSheet();render();}));};
            $('sfOk').onclick=()=>{const v=val();if(pid){S.asg.push({id:uid(),k:v.k,type:v.ty,team:v.tm,site:v.si,pid,for:null,note:''});save();toast(t('assignDone'));if(back)back();else{closeSheet();render();}}
              else pickCover(v.k,v.ty,v.tm,v.si,null,back||again);};}
          // ================= WARNINGS =================
          function warnForm(pid){const sug=p=>{const ws=warnsOf(p);if(!ws.length)return 'verbal';const lv=Math.max(...ws.map(w=>WL.indexOf(w.type)));return WL[Math.min(3,lv+1)];};
            openSheet(`<h3>⚠️ ${t('addWarn').replace('+ ','')}</h3><label>${t('person')}</label><select id="wP">${personOpts(isMember()&&meP()?C().meId:pid,isMember()&&meP()?personList().filter(x=>x.id===C().meId):null)}</select><div id="wSug" class="muted" style="margin-top:6px"></div>
            <label>${t('type')}</label><div class="tabs" id="wTy">${WL.map(w=>`<button data-wt="${w}">${t('w_'+w)}</button>`).join('')}</div>
            <label>${t('date')}</label><input type="date" id="wD" value="${ymd(now)}"><label>${t('reason')}</label><textarea id="wR" style="min-height:60px"></textarea>
          EOF_FILE

      - name: Create project files (22)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
            <div id="wDed"><label>${t('deduct')}</label><div class="row"><input type="number" inputmode="decimal" id="wV" placeholder="${t('value')}"><select id="wU"><option value="days">${t('dedDays')}</option><option value="amount">${t('dedAmount')}</option></select></div></div>
            <div class="btns"><button class="btn pri" id="wOk">${t('save')}</button><button class="btn" id="wC">${t('cancel')}</button></div>`);
            let wt='verbal';const setT=x=>{wt=x;$('wTy').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.wt===x));};
            const upd=()=>{const s=sug($('wP').value);setT(s);const ws=warnsOf($('wP').value);$('wSug').textContent=`${t('suggested')}: ${t('w_'+s)}`+(ws.length?` · ${ws.length} ${t('warns')}`:'');};
            $('wTy').querySelectorAll('button').forEach(b=>b.onclick=()=>setT(b.dataset.wt));$('wP').onchange=upd;upd();$('wC').onclick=closeSheet;
            $('wOk').onclick=()=>{const v=parseFloat($('wV').value);S.warns.push({id:uid(),p:$('wP').value,date:$('wD').value||ymd(now),type:wt,reason:$('wR').value.trim(),ded:v>0?v:0,dedType:$('wU').value});save();closeSheet();render();toast(t('saved'));};}

          // ================= UNIFORM =================
          function itemName(it){return (it.name||'').trim()||t('u_'+it.id);}
          function itemById(id){return C().uniItems.find(i=>i.id===id)||{id,name:id};}
          function uniOf(p){return S.uni.filter(u=>u.p===p).sort((a,b)=>a.date<b.date?1:-1);}
          function lastSize(p,it){for(const u of uniOf(p)){const x=u.items[it];if(x&&x.size)return x.size;}return '';}
          function lastGot(p){const l=uniOf(p);return l.length?l[0].date:'';}
          function uniLine(u){return Object.keys(u.items).map(k=>{const x=u.items[k];return itemName(itemById(k))+(x.size?' ('+x.size+')':'')+(x.qty>1?' ×'+x.qty:'');}).join('، ');}
          function uniList(){let h=`<div class="card"><h3>👕 ${t('uni')} <button class="btn sm pri" id="uAdd">${t('uniNew')}</button></h3><p class="muted">${t('tapPerson')}</p>`;
            h+=personList().map(p=>{const lg=lastGot(p.id);return `<div class="tl" data-pid="${p.id}" style="cursor:pointer"><span>${esc(p.name)}</span><span class="muted">${lg?t('lastGot')+': '+lg:t('never')}</span></div>`;}).join('');return h+'</div>';}
          function uniForm(pre){let ppl=personList();pre=pre||[];if(isMember()&&meP()){ppl=ppl.filter(x=>x.id===C().meId);pre=[C().meId];}
            let h=`<h3>👕 ${t('uniNew').replace('+ ','')}</h3><label>${t('date')}</label><input type="date" id="uD" value="${ymd(now)}"><div class="sec" style="margin-top:10px">${t('items')}</div>`+
            C().uniItems.map(it=>`<div class="row" style="align-items:center"><label class="chk" style="flex:2"><input type="checkbox" data-ui="${it.id}">${esc(itemName(it))}</label><input type="number" inputmode="numeric" min="1" value="1" data-uq="${it.id}" style="flex:1"></div>`).join('');
            h+=`<div class="sec" style="margin-top:10px">${t('people')}</div><div class="btns" style="margin-bottom:6px"><button class="btn sm" data-pq="all">${t('all')}</button>${[0,1,2].map(i=>`<button class="btn sm" data-pq="${i}">${esc(teamName(i))}</button>`).join('')}<button class="btn sm" data-pq="none">${t('none')}</button></div>`;
            h+=ppl.map(p=>`<label class="chk"><input type="checkbox" data-pp="${p.id}" data-tx="${p.team}" ${pre.includes(p.id)?'checked':''}>${esc(p.name)}</label>`).join('');
            h+=`<label>${t('note')}</label><input id="uN"><div class="btns"><button class="btn pri" id="uNx">${t('nextStep')}</button><button class="btn" id="uC">${t('cancel')}</button></div>`;
            openSheet(h);$('uC').onclick=closeSheet;
            $('panel').querySelectorAll('[data-pq]').forEach(b=>b.onclick=()=>{const q=b.dataset.pq;$('panel').querySelectorAll('[data-pp]').forEach(c=>{c.checked=q==='all'?true:q==='none'?false:(c.dataset.tx===q||c.checked);});});
            $('uNx').onclick=()=>{const date=$('uD').value||ymd(now),note=$('uN').value.trim();
              const items=[...$('panel').querySelectorAll('[data-ui]')].filter(c=>c.checked).map(c=>({id:c.dataset.ui,qty:Math.max(1,parseInt($('panel').querySelector('[data-uq="'+c.dataset.ui+'"]').value,10)||1)}));
              const sel=[...$('panel').querySelectorAll('[data-pp]')].filter(c=>c.checked).map(c=>c.dataset.pp);
              if(!items.length){toast(t('pickItems'));return;}if(!sel.length){toast(t('pickPeople'));return;}
              let h2=`<h3>📏 ${t('sizes')} — ${date}</h3>`+sel.map(p=>`<div class="item"><div class="h">${esc(pName(p))}</div><div class="row" style="flex-wrap:wrap">`+items.map(it=>`<div style="min-width:30%"><label>${esc(itemName(itemById(it.id)))}${it.qty>1?' ×'+it.qty:''}</label><input data-sz="${p}|${it.id}" value="${esc(lastSize(p,it.id))}" placeholder="${t('size')}"></div>`).join('')+`</div></div>`).join('');
              h2+=`<div class="btns"><button class="btn pri" id="uS">${t('save')}</button><button class="btn" id="uC2">${t('cancel')}</button></div>`;openSheet(h2);$('uC2').onclick=closeSheet;
              $('uS').onclick=()=>{const batch=uid();sel.forEach(p=>{const o={};items.forEach(it=>{o[it.id]={qty:it.qty,size:($('panel').querySelector('[data-sz="'+p+'|'+it.id+'"]').value||'').trim()};});S.uni.push({id:uid(),batch,date,p,items:o,note});});save();closeSheet();render();toast(t('saved'));};};}

          // ================= LOG =================
          function rLog(){const v=$('v-log');if(!logSel||shiftOf(logSel.date,C().myTeam).type!==logSel.type)logSel=lastOrCurrentMyShift(now);
            if(!logSel){v.innerHTML=`<div class="empty-msg">${t('nothing')}</div>`;return;}const ar=L()==='ar';
            const id=shiftId(logSel.date,logSel.type);if(!S.logs[id])S.logs[id]={recv:null,hand:null,cardNote:'',vis:false,wrk:false,notes:'',inc:[]};const g=S.logs[id];
            const tm=shiftTimes(logSel.date,logSel.type),isCur=now>=tm.s&&now<tm.e;
            let h=`<div class="shnav"><button class="btn" id="lP">${ar?'›':'‹'}</button><div class="mid"><b>${ICO[logSel.type]} ${t(logSel.type)} — ${fmt(logSel.date)}</b><span class="muted">${isCur?t('current')+' · ':''}${t('work')} ${hm(tm.st)}–${hm(tm.st+720)}</span></div><button class="btn" id="lN">${ar?'‹':'›'}</button></div>`;
            if(isCur&&logReminderActive(logSel))h+=`<div class="alert">${t('logReminder')}</div>`;
            const mmF=()=>(g.recv!=null&&g.hand!=null&&g.recv!==g.hand)||(g.recv!=null&&g.recv!==+C().cards);
          EOF_FILE

      - name: Create project files (23)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
            h+=`<div class="card"><h3>🪪 ${t('cards')} <span class="muted">${t('total')}: ${C().cards}</span></h3><div class="row"><div><label>${t('received')}</label><input type="number" inputmode="numeric" id="fRecv" value="${g.recv==null?'':g.recv}" placeholder="${C().cards}"></div><div><label>${t('handed')}</label><input type="number" inputmode="numeric" id="fHand" value="${g.hand==null?'':g.hand}" placeholder="${C().cards}"></div></div>
              <div class="btns"><button class="btn sm" id="fAll">✓ ${t('received')} = ${C().cards}</button><button class="btn sm" id="fAllH">✓ ${t('handed')} = ${C().cards}</button></div>
              <div id="mmBox" style="display:${mmF()?'block':'none'}"><div class="alert" style="margin:10px 0 0">${t('mismatch')}</div><label>${t('mismatchNote')}</label><input id="fCN" value="${esc(g.cardNote)}"></div></div>`;
            if(logSel.type==='N')h+=`<div class="card"><h3>📒 ${t('logChange')} <span class="muted">${C().logFrom}–${C().logTo}</span></h3><label class="chk"><input type="checkbox" id="fVis" ${g.vis?'checked':''}>${t('visitorsLog')}</label><label class="chk"><input type="checkbox" id="fWrk" ${g.wrk?'checked':''}>${t('workersLog')}</label></div>`;
            h+=`<div class="card"><h3>📝 ${t('handNotes')}</h3><textarea id="fNotes" placeholder="${t('handNotesPh')}">${esc(g.notes)}</textarea></div>`;
            h+=`<div class="card"><h3>🚨 ${t('incidents')} <button class="btn sm pri" id="fInc">${t('addIncident')}</button></h3>`+(g.inc.length?g.inc.map(x=>`<div class="item"><div class="h"><span>${esc(x.time)} · ${t('inc_'+x.type)}</span><button class="btn sm dang" data-delinc="${x.id}">${t('del')}</button></div><div class="b">${esc(x.desc)}${x.action?'\n↳ '+esc(x.action):''}</div></div>`).join(''):`<div class="empty-msg">${t('nothing')}</div>`)+'</div>';
            v.innerHTML=h;
            $('lP').onclick=()=>{logSel=myShiftStep(logSel.date,logSel.type,-1);rLog();};$('lN').onclick=()=>{logSel=myShiftStep(logSel.date,logSel.type,1);rLog();};
            const num=x=>x===''?null:Math.max(0,parseInt(x,10)||0);const upMM=()=>{$('mmBox').style.display=mmF()?'block':'none';};
            $('fRecv').oninput=e=>{g.recv=num(e.target.value);save();upMM();};$('fHand').oninput=e=>{g.hand=num(e.target.value);save();upMM();};
            $('fAll').onclick=()=>{g.recv=+C().cards;$('fRecv').value=g.recv;save();upMM();toast(t('saved'));};$('fAllH').onclick=()=>{g.hand=+C().cards;$('fHand').value=g.hand;save();upMM();toast(t('saved'));};
            $('fCN').oninput=e=>{g.cardNote=e.target.value;save();};
            if($('fVis')){$('fVis').onchange=e=>{g.vis=e.target.checked;save();};$('fWrk').onchange=e=>{g.wrk=e.target.checked;save();};}
            $('fNotes').oninput=e=>{g.notes=e.target.value;save();};$('fInc').onclick=()=>incForm(g);
            v.querySelectorAll('[data-delinc]').forEach(b=>b.onclick=()=>confirmBox(t('confirmDel'),()=>{g.inc=g.inc.filter(x=>x.id!==b.dataset.delinc);save();rLog();}));}
          function incForm(g){const n=new Date();openSheet(`<h3>🚨 ${t('addIncident').replace('+ ','')}</h3><div class="row"><div><label>${t('time')}</label><input type="time" id="iT" value="${pad(n.getHours())}:${pad(n.getMinutes())}"></div><div><label>${t('type')}</label><select id="iY">${INC.map(k=>`<option value="${k}">${t('inc_'+k)}</option>`).join('')}</select></div></div>
            <label>${t('desc')}</label><textarea id="iD"></textarea><label>${t('action')}</label><textarea id="iA" style="min-height:60px"></textarea><div class="btns"><button class="btn pri" id="iS">${t('save')}</button><button class="btn" id="iC">${t('cancel')}</button></div>`);
            $('iC').onclick=closeSheet;$('iS').onclick=()=>{const d=$('iD').value.trim();if(!d){$('iD').focus();return;}g.inc.push({id:uid(),time:$('iT').value,type:$('iY').value,desc:d,action:$('iA').value.trim()});g.inc.sort((a,b)=>a.time<b.time?-1:1);save();closeSheet();rLog();toast(t('saved'));};}

          // ================= REPORTS =================
          let repSub='sheet',repMonth=null,sheetTeam='all',sheetSite='all',repOut='';
          let rp={per:'this',from:'',to:'',sec:{shifts:true,inc:true,cards:true,logs:true,notes:true,team:true,warn:true,uni:true,train:true,stock:true,evals:true}};
          function monthRow(p,A,B){const td=ymd(now);if(B>td)B=td;if(B<A)return{list:[],d:0,n:0,total:0,abs:0,leave:0,extra:0,w:0};const list=shiftsOf(p.id,A,B);const d=list.filter(x=>x.type==='D').length,n=list.filter(x=>x.type==='N').length;
            let abs=0,leave=0;kRange(A,B).forEach(k=>{if(!employedOn(p,k))return;const a=absentOn(p.id,k);if(!a)return;if(a.type==='leave')leave++;else if(p.role!=='res'&&teamShift(teamAt(p,k),k)!=='O')abs++;});
            const extra=list.filter(x=>x.kind!=='base').length;const w=S.warns.filter(x=>x.p===p.id&&x.date>=A&&x.date<=B).length;return{list,d,n,total:d+n,abs,leave,extra,w};}
          function sheetPeople(A,B){if(isMember()&&meP())return [meP()];return people().filter(p=>startOf(p)<=B&&!(p.left&&p.left<A)&&(sheetTeam==='all'||teamAt(p,B)===+sheetTeam)&&(sheetSite==='all'||siteAt(p,B)===sheetSite||siteAt(p,B)==='both')).sort((a,b)=>teamAt(a,B)-teamAt(b,B)||SO(a)-SO(b)||RO[a.role]-RO[b.role]);}
          function rRep(){const v=$('v-rep');const ar=L()==='ar';let h=`<div class="tabs">${[['sheet','📅 '+t('sheet')],['text','📄 '+t('textRep')]].map(([k,l])=>`<button data-rs="${k}" class="${repSub===k?'on':''}">${l}</button>`).join('')}</div>`;
            if(repSub==='sheet'){if(!repMonth)repMonth=new Date(now.getFullYear(),now.getMonth(),1);const A=ymd(repMonth),B=ymd(new Date(repMonth.getFullYear(),repMonth.getMonth()+1,0));
              h+=`<div class="card"><div class="mnav"><button class="btn" id="smP">${ar?'›':'‹'}</button><b>${t('actual')} — ${MONTHS[L()][repMonth.getMonth()]} ${repMonth.getFullYear()}</b><button class="btn" id="smN">${ar?'‹':'›'}</button></div>
              <div class="tabs" style="${isMember()?'display:none':''}">${[['all',t('all')],['0',teamName(0)],['1',teamName(1)],['2',teamName(2)]].map(([k,l])=>`<button data-st="${k}" class="${sheetTeam===k?'on':''}">${esc(l)}</button>`).join('')}</div>
              <div class="tabs" style="${isMember()?'display:none':''}">${[['all','📍 '+t('allSites')],...C().sites.map(x=>[x.id,'📍 '+x.name])].map(([k,l])=>`<button data-ss="${k}" class="${sheetSite===k?'on':''}">${esc(l)}</button>`).join('')}</div>
              <div class="scrollx"><table class="tbl"><tr><th>${t('name')}</th><th>${t('site')}</th><th>${t('dayC')}</th><th>${t('nightC')}</th><th>${t('total')}</th><th>${t('hours')}</th><th>${t('absC')}</th><th>${t('leaveC')}</th><th>${t('extraC')}</th><th>${t('warnC')}</th></tr>`;
          EOF_FILE

      - name: Create project files (24)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
              let tot=0;sheetPeople(A,B).forEach(p=>{const r=monthRow(p,A,B);tot+=r.total;h+=`<tr data-pid="${p.id}"><td>${esc(pName(p.id))}${p.role==='res'?' <span class="tag res">'+t('reserve')+'</span>':''}</td><td>${esc(siteName(siteAt(p,B)))}</td><td>${r.d}</td><td>${r.n}</td><td><b>${r.total}</b></td><td>${r.total*12}</td><td>${r.abs||''}</td><td>${r.leave||''}</td><td>${r.extra||''}</td><td>${r.w||''}</td></tr>`;});
              h+=`</table></div><div class="btns"><button class="btn pri" id="smPr">${t('print')}</button><button class="btn" id="smSh">${t('share')}</button></div></div>`;
              v.innerHTML=h;bindCommon(v);
              $('smP').onclick=()=>{repMonth=new Date(repMonth.getFullYear(),repMonth.getMonth()-1,1);rRep();};$('smN').onclick=()=>{repMonth=new Date(repMonth.getFullYear(),repMonth.getMonth()+1,1);rRep();};
              v.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{sheetTeam=b.dataset.st;rRep();});v.querySelectorAll('[data-ss]').forEach(b=>b.onclick=()=>{sheetSite=b.dataset.ss;rRep();});
              $('smPr').onclick=()=>printHtml(sheetHtml(A,B),t('sheet'));$('smSh').onclick=()=>shareText(sheetText(A,B));}
            else{if(!rp.from){rp.from=ymd(new Date(now.getFullYear(),now.getMonth(),1));rp.to=ymd(now);}
              h+=`<div class="card"><label>${t('period')}</label><div class="seg">${[['this',t('thisMonth')],['last',t('lastMonth')],['custom',t('custom')]].map(([k,l])=>`<button data-per="${k}" class="${rp.per===k?'on':''}">${l}</button>`).join('')}</div>
              <div class="row" style="display:${rp.per==='custom'?'flex':'none'}"><div><label>${t('from')}</label><input type="date" id="rF" value="${rp.from}"></div><div><label>${t('to')}</label><input type="date" id="rT" value="${rp.to}"></div></div>
              <label>${t('include')}</label>${(isPM()?[['team','secTeam'],['warn','secWarn'],['uni','secUni'],['train','train'],['stock','stock'],['evals','evals']]:[['shifts','secShifts'],['inc','secIncidents'],['cards','secCards'],['logs','secLogs'],['notes','secNotes'],['team','secTeam'],['warn','secWarn'],['uni','secUni']]).map(([k,l])=>`<label class="chk"><input type="checkbox" data-sec="${k}" ${rp.sec[k]?'checked':''}>${t(l)}</label>`).join('')}
              <button class="btn pri full" id="rG">${t('generate')}</button></div>`;
              if(repOut)h+=`<div class="card"><pre class="rep">${esc(repOut)}</pre><div class="btns"><button class="btn" id="rC">${t('copy')}</button><button class="btn" id="rS">${t('share')}</button><button class="btn" id="rPr">${t('print')}</button></div></div>`;
              v.innerHTML=h;
              v.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{rp.per=b.dataset.per;rRep();});v.querySelectorAll('[data-sec]').forEach(b=>b.onchange=()=>{rp.sec[b.dataset.sec]=b.checked;});
              if($('rF')){$('rF').onchange=e=>rp.from=e.target.value;$('rT').onchange=e=>rp.to=e.target.value;}
              $('rG').onclick=()=>{repOut=buildReport();rRep();setTimeout(()=>{const p=v.querySelector('pre');if(p)p.scrollIntoView({behavior:'smooth'});},50);};
              if(repOut){$('rC').onclick=()=>copyText(repOut);$('rS').onclick=()=>shareText(repOut);$('rPr').onclick=()=>printHtml(textHtml(repOut),t('report'));}}
            v.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{repSub=b.dataset.rs;rRep();});}
          const docHead=title=>`<!DOCTYPE html><html lang="${L()}" dir="${L()==='ar'?'rtl':'ltr'}"><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:A4;margin:14mm}body{font-family:'Noto Naskh Arabic','Noto Sans Arabic',Arial,sans-serif;color:#000;font-size:12px}h1{font-size:17px;margin:0 0 4px;text-align:center}.sub{text-align:center;color:#444;margin-bottom:12px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #444;padding:5px 4px;text-align:center}th{background:#e5e7eb}td:first-child,th:first-child{text-align:start}.sig{display:flex;justify-content:space-between;margin-top:40px}.sig div{width:40%;border-top:1px solid #000;text-align:center;padding-top:4px}pre{white-space:pre-wrap;font-family:inherit;font-size:12px;line-height:1.8}.tot td{font-weight:bold;background:#f3f4f6}</style></head><body>`;
          function sheetHtml(A,B){const ps=sheetPeople(A,B);const m=MONTHS[L()][parse(A).getMonth()]+' '+parse(A).getFullYear();
            let h=docHead(t('sheet'))+`<h1>${t('actual')} — ${m}</h1><div class="sub">${sheetTeam==='all'?t('all'):esc(teamName(+sheetTeam))} · 📍${sheetSite==='all'?t('allSites'):esc(siteName(sheetSite))} · ${t('generated')}: ${fmt(now)}</div><table><tr><th>#</th><th>${t('name')}</th><th>${t('teamOf')}</th><th>${t('site')}</th><th>${t('dayC')}</th><th>${t('nightC')}</th><th>${t('total')}</th><th>${t('hours')}</th><th>${t('absC')}</th><th>${t('leaveC')}</th><th>${t('extraC')}</th><th>${t('warnC')}</th></tr>`;
            let T0={d:0,n:0,t:0,a:0,l:0,x:0,w:0};ps.forEach((p,i)=>{const r=monthRow(p,A,B);T0.d+=r.d;T0.n+=r.n;T0.t+=r.total;T0.a+=r.abs;T0.l+=r.leave;T0.x+=r.extra;T0.w+=r.w;
              h+=`<tr><td>${i+1}</td><td>${esc(pName(p.id))}${p.role==='sup'?' ★':p.role==='res'?' ('+t('reserve')+')':''}${p.left?' — '+t('leftOn')+' '+p.left:''}</td><td>${esc(teamName(teamAt(p,B)))}</td><td>${esc(siteName(siteAt(p,B)))}</td><td>${r.d}</td><td>${r.n}</td><td><b>${r.total}</b></td><td>${r.total*12}</td><td>${r.abs}</td><td>${r.leave}</td><td>${r.extra}</td><td>${r.w}</td></tr>`;});
            h+=`<tr class="tot"><td></td><td>${t('total')}</td><td></td><td></td><td>${T0.d}</td><td>${T0.n}</td><td>${T0.t}</td><td>${T0.t*12}</td><td>${T0.a}</td><td>${T0.l}</td><td>${T0.x}</td><td>${T0.w}</td></tr></table><div class="sig"><div>${t('sign1')}</div><div>${t('sign2')}</div></div></body></html>`;return h;}
          function sheetText(A,B){const m=MONTHS[L()][parse(A).getMonth()]+' '+parse(A).getFullYear();let o=`${t('actual')} — ${m}\n${'─'.repeat(20)}\n`;
            sheetPeople(A,B).forEach(p=>{const r=monthRow(p,A,B);o+=`${pName(p.id)} (${siteName(siteAt(p,B))}): ${r.total} (${t('dayC')} ${r.d} · ${t('nightC')} ${r.n})${r.abs?' · '+t('absC')+' '+r.abs:''}${r.leave?' · '+t('leaveC')+' '+r.leave:''}${r.extra?' · '+t('extraC')+' '+r.extra:''}${r.w?' · ⚠️'+r.w:''}\n`;});return o;}
          function personMonthHtml(p,A,B,r){const m=MONTHS[L()][parse(A).getMonth()]+' '+parse(A).getFullYear();
          EOF_FILE

      - name: Create project files (25)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
            let h=docHead(pName(p.id))+`<h1>${esc(pName(p.id))} — ${t('actual')}</h1><div class="sub">${esc(teamName(p.team))} · 📍${esc(siteName(curSite(p)))} · ${m}</div><table><tr><th>${t('dayC')}</th><th>${t('nightC')}</th><th>${t('total')}</th><th>${t('hours')}</th><th>${t('absC')}</th><th>${t('leaveC')}</th><th>${t('extraC')}</th></tr><tr><td>${r.d}</td><td>${r.n}</td><td><b>${r.total}</b></td><td>${r.total*12}</td><td>${r.abs}</td><td>${r.leave}</td><td>${r.extra}</td></tr></table><br>
            <table><tr><th>#</th><th>${t('date')}</th><th>${t('shiftT')}</th><th>${t('type')}</th></tr>`+r.list.map((x,i)=>`<tr><td>${i+1}</td><td>${fmt(parse(x.k))}</td><td>${t(x.type)}</td><td>${t('kind_'+x.kind)}</td></tr>`).join('')+`</table><div class="sig"><div>${t('sign1')}</div><div>${t('sign2')}</div></div></body></html>`;return h;}
          const textHtml=txt=>docHead(t('report'))+`<pre>${esc(txt)}</pre></body></html>`;
          function range(){let a,b;if(rp.per==='this'){a=new Date(now.getFullYear(),now.getMonth(),1);b=new Date(now.getFullYear(),now.getMonth()+1,0);}else if(rp.per==='last'){a=new Date(now.getFullYear(),now.getMonth()-1,1);b=new Date(now.getFullYear(),now.getMonth(),0);}else{a=parse(rp.from||ymd(now));b=parse(rp.to||ymd(now));if(b<a)[a,b]=[b,a];}return[a,b];}
          function buildReport(){const[a,b]=range();const A=ymd(a),B=ymd(b);const pm=isPM(),sv=Object.assign({},rp.sec);if(pm){['shifts','inc','cards','logs','notes'].forEach(k=>rp.sec[k]=false);}else{['train','stock','evals'].forEach(k=>rp.sec[k]=false);}
            let o=`${t('report')} ${t('app')}\n${C().myName?C().myName+' — ':''}${pm?t('modePM'):teamFull(C().myTeam)}\n${t('period')}: ${fmt(a)} → ${fmt(b)}\n${'─'.repeat(24)}\n`;
            const my=[];kRange(A,B).forEach(k=>{const s=teamShift(C().myTeam,k);if(s!=='O')my.push({date:parse(k),type:s,id:k+'_'+s});});
            const started=x=>shiftTimes(x.date,x.type).s<=now;
            if(rp.sec.shifts){const dn=my.filter(x=>x.type==='D').length,nn=my.filter(x=>x.type==='N').length;o+=`\n■ ${t('secShifts')}\n${t('D')}: ${dn} · ${t('N')}: ${nn} · ${t('total')}: ${dn+nn} ${t('shifts')} (${(dn+nn)*12} ${t('hours')})\n`;}
            if(rp.sec.inc){o+=`\n■ ${t('secIncidents')}\n`;let n=0;my.forEach(x=>{const g=S.logs[x.id];if(g&&g.inc)g.inc.forEach(i=>{n++;o+=`- ${fmtS(x.date)} ${ICO[x.type]} ${i.time} [${t('inc_'+i.type)}] ${i.desc}${i.action?' ↳ '+i.action:''}\n`;});});if(!n)o+=t('nothing')+'\n';}
            if(rp.sec.cards){o+=`\n■ ${t('secCards')} (${t('total')} ${C().cards})\n`;let n=0;my.forEach(x=>{const g=S.logs[x.id];if(g&&(g.recv!=null||g.hand!=null)){n++;const bad=(g.recv!=null&&g.recv!==+C().cards)||(g.recv!=null&&g.hand!=null&&g.recv!==g.hand);o+=`- ${fmtS(x.date)} ${ICO[x.type]} ${t('received')} ${g.recv==null?'—':g.recv} / ${t('handed')} ${g.hand==null?'—':g.hand}${bad?' ⚠️'+(g.cardNote?' '+g.cardNote:''):''}\n`;}});if(!n)o+=t('nothing')+'\n';}
            if(rp.sec.logs){const ns=my.filter(x=>x.type==='N'&&started(x));if(ns.length){o+=`\n■ ${t('secLogs')}\n`;ns.forEach(x=>{const g=S.logs[x.id]||{};o+=`- ${fmtS(x.date)}: ${t('visitorsLog')} ${g.vis?'✓':'✗'} · ${t('workersLog')} ${g.wrk?'✓':'✗'}\n`;});}}
            if(rp.sec.notes){o+=`\n■ ${t('secNotes')}\n`;let n=0;my.forEach(x=>{const g=S.logs[x.id];if(g&&g.notes){n++;o+=`- ${fmtS(x.date)} ${ICO[x.type]}: ${g.notes.replace(/\n/g,' / ')}\n`;}});if(!n)o+=t('nothing')+'\n';}
            if(rp.sec.team){o+=`\n■ ${t('secTeam')}\n`;const ev=S.events.filter(e=>(e.from<=B&&e.to>=A)||(e.back&&e.back>=A&&e.back<=B)).sort((x,y)=>x.from<y.from?-1:1);const as=S.asg.filter(x=>x.k>=A&&x.k<=B).sort((x,y)=>x.k<y.k?-1:1);o+=(ev.length||as.length)?ev.map(e=>`- ${evDates(e)}: ${evText(e)}${e.note?' ('+e.note+')':''}`).concat(as.map(x=>`- ${x.k}: ${asgText(x)}`)).join('\n')+'\n':t('nothing')+'\n';}
            if(rp.sec.warn){o+=`\n■ ${t('secWarn')}\n`;const ws=S.warns.filter(w=>w.date>=A&&w.date<=B).sort((x,y)=>x.date<y.date?-1:1);o+=ws.length?ws.map(w=>`- ${w.date} ${pName(w.p)}: ${t('w_'+w.type)}${w.reason?' — '+w.reason:''}${w.ded?' ('+t('deduct')+' '+w.ded+' '+(w.dedType==='amount'?t('dedAmount'):t('dedDays'))+')':''}`).join('\n')+'\n':t('nothing')+'\n';}
            if(rp.sec.uni){o+=`\n■ ${t('secUni')}\n`;const us=S.uni.filter(u=>u.date>=A&&u.date<=B).sort((x,y)=>x.date<y.date?-1:1);if(!us.length)o+=t('nothing')+'\n';else{us.forEach(u=>o+=`- ${u.date} ${pName(u.p)}: ${uniLine(u)}${u.note?' ('+u.note+')':''}\n`);const got=new Set(us.map(u=>u.p));const miss=personList().filter(p=>!got.has(p.id));if(miss.length)o+=`${t('notReceived')}: ${miss.map(p=>p.name).join('، ')}\n`;}}
            if(rp.sec.train){o+=`\n■ ${t('train')}\n`;const tr=allTrainings().filter(x=>x.date>=A&&x.date<=B);o+=tr.length?tr.map(x=>`- ${fmtK(x.date)} ${x.time} — ${teamFull(x.team)}`).join('\n')+'\n':t('nothing')+'\n';}
            if(rp.sec.stock){o+=`\n■ ${t('stock')}\n`;const sh=S.ships.filter(x=>x.date>=A&&x.date<=B);o+=sh.length?sh.map(shipText).join('\n')+'\n':t('nothing')+'\n';}
            if(rp.sec.evals){o+=`\n■ ${t('evals')}\n`;const ms=new Set();kRange(A,B).forEach(k=>ms.add(k.slice(0,7)));let n=0;[...ms].forEach(m=>{const ev=S.evals.filter(x=>x.m===m);const w=S.eom.find(x=>x.m===m);if(ev.length||w){o+=`${monthLabel(m)}${w?' — 🏆 '+pName(w.p):''}\n`;ev.sort((a,b)=>b.score-a.score).forEach(x=>{n++;o+=`- ${pName(x.p)}: ${x.score}% (${t(gradeKey(x.score))})\n`;});}});if(!n)o+=t('nothing')+'\n';}
            rp.sec=sv;return o+`\n${t('generated')}: ${fmt(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;}


          // ================= PM / ADMIN =================
          const monthLabel=m=>MONTHS[L()][+m.slice(5,7)-1]+' '+m.slice(0,4);
          const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
          const addMonth=(m,n)=>{const d=new Date(+m.slice(0,4),+m.slice(5,7)-1+n,1);return ymOf(d);};
          function gradeKey(s){s=+s;return s<50?'g_weak':s<65?'g_ok':s<75?'g_good':s<85?'g_vgood':'g_exc';}
          function gradeTag(s){const k=gradeKey(s);const st={g_weak:'background:var(--dangerBg);color:var(--danger)',g_ok:'background:var(--nightBg);color:var(--night)',g_good:'background:var(--dayBg);color:var(--day)',g_vgood:'background:var(--card);color:var(--accent)',g_exc:'background:var(--offBg);color:var(--off)'}[k];return `<span class="pill" style="${st}">${s}% · ${t(k)}</span>`;}
          function curSlotNow(){const k=ymd(now),tm=mins(C().start),m=now.getHours()*60+now.getMinutes();if(m>=tm&&m<tm+720)return{k,ty:'D'};if(m>=tm+720)return{k,ty:'N'};return{k:kAdd(k,-1),ty:'N'};}
          function kpiGrid(){const k=ymd(now),cs=curSlotNow(),si=slotInfo(cs.k,cs.ty);
          EOF_FILE

      - name: Create project files (26)
        run: |
