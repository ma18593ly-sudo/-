            for(let i=0;i<first;i++)h+='<div class="c empty"></div>';
            for(let d=1;d<=len;d++){const dt=new Date(calView.getFullYear(),calView.getMonth(),d),s=shiftOf(dt,C().myTeam);const dot=eventsOn(dt).length||hasLog(shiftId(dt,'D'))||hasLog(shiftId(dt,'N'));
              h+=`<button class="c ${s.type}-b ${ymd(dt)===ymd(now)?'today':''}" data-day="${ymd(dt)}">${dot?'<span class="dot"></span>':''}${d}<small class="${s.type}-t">${t(s.type)}</small></button>`;}
            h+=`</div><div class="legend"><span><i style="background:var(--day)"></i>${t('D')}</span><span><i style="background:var(--night)"></i>${t('N')}</span><span><i style="background:var(--off)"></i>${t('O')}</span><span><i style="background:var(--danger);border-radius:50%"></i>${t('note')}</span></div>
            <button class="btn full" id="cT">${t('today')}</button></div><p class="muted" style="text-align:center">${esc(teamName(C().myTeam))} · ${t('hint')}</p>`;
            v.innerHTML=h;bindCommon(v);
            $('cP').onclick=()=>{calView=new Date(calView.getFullYear(),calView.getMonth()-1,1);rCal();};
            $('cN').onclick=()=>{calView=new Date(calView.getFullYear(),calView.getMonth()+1,1);rCal();};
            $('cT').onclick=()=>{calView=new Date(now.getFullYear(),now.getMonth(),1);rCal();};}

          function rLog(){const v=$('v-log');if(!logSel||shiftOf(logSel.date,C().myTeam).type!==logSel.type)logSel=lastOrCurrentMyShift(now);
            if(!logSel){v.innerHTML=`<div class="empty-msg">${t('nothing')}</div>`;return;}
            const id=shiftId(logSel.date,logSel.type),g=getLog(id),tm=shiftTimes(logSel.date,logSel.type);const isCur=now>=tm.s&&now<tm.e;
            let h=`<div class="shnav"><button class="btn" id="lP">${L()==='ar'?'›':'‹'}</button><div class="mid"><b>${ICO[logSel.type]} ${t(logSel.type)} — ${fmt(logSel.date)}</b><span class="muted">${isCur?t('current')+' · ':''}${t('work')} ${hm(tm.st)}–${hm(tm.st+720)}</span></div><button class="btn" id="lN">${L()==='ar'?'‹':'›'}</button></div>`;
            if(isCur&&logReminderActive({date:logSel.date,type:logSel.type}))h+=`<div class="alert">${t('logReminder')}</div>`;
            const mm=g.recv!=null&&g.hand!=null&&+g.recv!==+g.hand||g.recv!=null&&+g.recv!==+C().cards;
            h+=`<div class="card"><h3>🪪 ${t('cards')} <span class="muted">${t('total')}: ${C().cards}</span></h3><div class="row">
