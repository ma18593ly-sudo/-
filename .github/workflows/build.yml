name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files (1)
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'EOF_FILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.mohamed.shifts'
              compileSdk 34
              defaultConfig {
                  applicationId "com.mohamed.shifts"
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName "2.2"
              }
              signingConfigs {
                  debug {
                      storeFile file('shifts.keystore')
                      storePassword 'android'
                      keyAlias 'shifts'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.debug }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE
          mkdir -p 'app'
