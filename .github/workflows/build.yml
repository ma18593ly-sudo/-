              if(nt.lights){add('lightsOn',at(k,su.set),'💡',t('rLightOn'),t('rSunset')+' '+hm(su.set));add('lightsOff',at(k,su.rise),'💡',t('rLightOff'),t('rSunrise')+' '+hm(su.rise));}
