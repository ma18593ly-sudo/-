            v.innerHTML=h;bindCommon(v);bindSlots(v,null);bindDue(v);}
          // ---- reminders ----
          const hmNow=()=>pad(now.getHours())+':'+pad(now.getMinutes());
          const isDue=x=>!x.done&&(x.date<ymd(now)||(x.date===ymd(now)&&(x.time||'00:00')<=hmNow()));
          const dueList=()=>S.notes.filter(isDue);
          function dueAlerts(){let h=dueList().map(x=>`<div class="alert" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>🔔 ${esc(x.text)} <span style="font-weight:400;font-size:12px">${fmtK(x.date)} ${x.time||''}</span></span><button class="btn sm" data-ndone="${x.id}">✓</button></div>`).join('');
            const k=ymd(now),k1=kAdd(k,1);const tr=allTrainings().filter(x=>(x.date===k||x.date===k1)&&(isPM()||C().mode==='sup'||x.team===C().myTeam));
            h+=tr.map(x=>`<div class="item" data-day="${x.date}" style="cursor:pointer;background:var(--dayBg)"><div class="h">🎓 ${t('trainOf')} ${esc(teamFull(x.team))}</div><div class="b">${x.date===k?t('today'):fmtK(x.date)} · ${x.time}</div></div>`).join('');return h;}
          function bindDue(v){v.querySelectorAll('[data-ndone]').forEach(b=>b.onclick=e=>{e.stopPropagation();const n=S.notes.find(x=>x.id===b.dataset.ndone);if(n){n.done=true;save();}render();});}
