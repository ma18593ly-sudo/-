      - name: Create project files (20)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
          function monthRow(p,A,B){const td=ymd(now);if(B>td)B=td;if(B<A)return{list:[],d:0,n:0,total:0,abs:0,leave:0,extra:0,w:0};const list=shiftsOf(p.id,A,B);const d=list.filter(x=>x.type==='D').length,n=list.filter(x=>x.type==='N').length;
            let abs=0,leave=0;kRange(A,B).forEach(k=>{if(!employedOn(p,k))return;const a=absentOn(p.id,k);if(!a)return;if(a.type==='leave')leave++;else if(p.role!=='res'&&teamShift(teamAt(p,k),k)!=='O')abs++;});
            const extra=list.filter(x=>x.kind!=='base').length;const w=S.warns.filter(x=>x.p===p.id&&x.date>=A&&x.date<=B).length;return{list,d,n,total:d+n,abs,leave,extra,w};}
          function sheetPeople(A,B){if(isMember()&&meP())return [meP()];return people().filter(p=>startOf(p)<=B&&!(p.left&&p.left<A)&&(sheetTeam==='all'||teamAt(p,B)===+sheetTeam)&&(sheetSite==='all'||siteAt(p,B)===sheetSite||siteAt(p,B)==='both')).sort((a,b)=>teamAt(a,B)-teamAt(b,B)||SO(a)-SO(b)||RO[a.role]-RO[b.role]);}
          function rRep(){const v=$('v-rep');const ar=L()==='ar';let h=`<div class="tabs">${[['sheet','📅 '+t('sheet')],['text','📄 '+t('textRep')]].map(([k,l])=>`<button data-rs="${k}" class="${repSub===k?'on':''}">${l}</button>`).join('')}</div>`;
            if(repSub==='sheet'){if(!repMonth)repMonth=new Date(now.getFullYear(),now.getMonth(),1);const A=ymd(repMonth),B=ymd(new Date(repMonth.getFullYear(),repMonth.getMonth()+1,0));
              h+=`<div class="card"><div class="mnav"><button class="btn" id="smP">${ar?'›':'‹'}</button><b>${t('actual')} — ${MONTHS[L()][repMonth.getMonth()]} ${repMonth.getFullYear()}</b><button class="btn" id="smN">${ar?'‹':'›'}</button></div>
              <div class="tabs" style="${isMember()?'display:none':''}">${[['all',t('all')],['0',teamName(0)],['1',teamName(1)],['2',teamName(2)]].map(([k,l])=>`<button data-st="${k}" class="${sheetTeam===k?'on':''}">${esc(l)}</button>`).join('')}</div>
              <div class="tabs" style="${isMember()?'display:none':''}">${[['all','📍 '+t('allSites')],...C().sites.map(x=>[x.id,'📍 '+x.name])].map(([k,l])=>`<button data-ss="${k}" class="${sheetSite===k?'on':''}">${esc(l)}</button>`).join('')}</div>
              <div class="scrollx"><table class="tbl"><tr><th>${t('name')}</th><th>${t('site')}</th><th>${t('dayC')}</th><th>${t('nightC')}</th><th>${t('total')}</th><th>${t('hours')}</th><th>${t('absC')}</th><th>${t('leaveC')}</th><th>${t('extraC')}</th><th>${t('warnC')}</th></tr>`;
              let tot=0;sheetPeople(A,B).forEach(p=>{const r=monthRow(p,A,B);tot+=r.total;h+=`<tr data-pid="${p.id}"><td>${esc(pName(p.id))}${p.role==='res'?' <span class="tag res">'+t('reserve')+'</span>':''}</td><td>${esc(siteName(siteAt(p,B)))}</td><td>${r.d}</td><td>${r.n}</td><td><b>${r.total}</b></td><td>${r.total*12}</td><td>${r.abs||''}</td><td>${r.leave||''}</td><td>${r.extra||''}</td><td>${r.w||''}</td></tr>`;});
              h+=`</table></div><div class="btns"><button class="btn pri" id="smPr">${t('print')}</button><button class="btn" id="smSh">${t('share')}</button></div></div>`;
              v.innerHTML=h;bindCommon(v);
              $('smP').onclick=()=>{repMonth=new Date(repMonth.getFullYear(),repMonth.getMonth()-1,1);rRep();};$('smN').onclick=()=>{repMonth=new Date(repMonth.getFullYear(),repMonth.getMonth()+1,1);rRep();};
              v.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{sheetTeam=b.dataset.st;rRep();});v.querySelectorAll('[data-ss]').forEach(b=>b.onclick=()=>{sheetSite=b.dataset.ss;rRep();});
              $('smPr').onclick=()=>printHtml(sheetHtml(A,B),t('sheet'));$('smSh').onclick=()=>shareText(sheetText(A,B));}
            else{if(!rp.from){rp.from=ymd(new Date(now.getFullYear(),now.getMonth(),1));rp.to=ymd(now);}
              h+=`<div class="card"><label>${t('period')}</label><div class="seg">${[['this',t('thisMonth')],['last',t('lastMonth')],['custom',t('custom')]].map(([k,l])=>`<button data-per="${k}" class="${rp.per===k?'on':''}">${l}</button>`).join('')}</div>
              <div class="row" style="display:${rp.per==='custom'?'flex':'none'}"><div><label>${t('from')}</label><input type="date" id="rF" value="${rp.from}"></div><div><label>${t('to')}</label><input type="date" id="rT" value="${rp.to}"></div></div>
              <label>${t('include')}</label>${(isPM()?[['team','secTeam'],['warn','secWarn'],['uni','secUni'],['train','train'],['stock','stock'],['evals','evals']]:[['shifts','secShifts'],['inc','secIncidents'],['cards','secCards'],['logs','secLogs'],['notes','secNotes'],['team','secTeam'],['warn','secWarn'],['uni','secUni']]).map(([k,l])=>`<label class="chk"><input type="checkbox" data-sec="${k}" ${rp.sec[k]?'checked':''}>${t(l)}</label>`).join('')}
              <button class="btn pri full" id="rG">${t('generate')}</button></div>`;
              if(repOut)h+=`<div class="card"><pre class="rep">${esc(repOut)}</pre><div class="btns"><button class="btn" id="rC">${t('copy')}</button><button class="btn" id="rS">${t('share')}</button><button class="btn" id="rPr">${t('print')}</button></div></div>`;
              v.innerHTML=h;
              v.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{rp.per=b.dataset.per;rRep();});v.querySelectorAll('[data-sec]').forEach(b=>b.onchange=()=>{rp.sec[b.dataset.sec]=b.checked;});
              if($('rF')){$('rF').onchange=e=>rp.from=e.target.value;$('rT').onchange=e=>rp.to=e.target.value;}
              $('rG').onclick=()=>{repOut=buildReport();rRep();setTimeout(()=>{const p=v.querySelector('pre');if(p)p.scrollIntoView({behavior:'smooth'});},50);};
              if(repOut){$('rC').onclick=()=>copyText(repOut);$('rS').onclick=()=>shareText(repOut);$('rPr').onclick=()=>printHtml(textHtml(repOut),t('report'));}}
            v.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{repSub=b.dataset.rs;rRep();});}
          const docHead=title=>`<!DOCTYPE html><html lang="${L()}" dir="${L()==='ar'?'rtl':'ltr'}"><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:A4;margin:14mm}body{font-family:'Noto Naskh Arabic','Noto Sans Arabic',Arial,sans-serif;color:#000;font-size:12px}h1{font-size:17px;margin:0 0 4px;text-align:center}.sub{text-align:center;color:#444;margin-bottom:12px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #444;padding:5px 4px;text-align:center}th{background:#e5e7eb}td:first-child,th:first-child{text-align:start}.sig{display:flex;justify-content:space-between;margin-top:40px}.sig div{width:40%;border-top:1px solid #000;text-align:center;padding-top:4px}pre{white-space:pre-wrap;font-family:inherit;font-size:12px;line-height:1.8}.tot td{font-weight:bold;background:#f3f4f6}</style></head><body>`;
          function sheetHtml(A,B){const ps=sheetPeople(A,B);const m=MONTHS[L()][parse(A).getMonth()]+' '+parse(A).getFullYear();
          EOF_FILE

      - name: Create project files (21)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
            let h=docHead(t('sheet'))+`<h1>${t('actual')} — ${m}</h1><div class="sub">${sheetTeam==='all'?t('all'):esc(teamName(+sheetTeam))} · 📍${sheetSite==='all'?t('allSites'):esc(siteName(sheetSite))} · ${t('generated')}: ${fmt(now)}</div><table><tr><th>#</th><th>${t('name')}</th><th>${t('teamOf')}</th><th>${t('site')}</th><th>${t('dayC')}</th><th>${t('nightC')}</th><th>${t('total')}</th><th>${t('hours')}</th><th>${t('absC')}</th><th>${t('leaveC')}</th><th>${t('extraC')}</th><th>${t('warnC')}</th></tr>`;
            let T0={d:0,n:0,t:0,a:0,l:0,x:0,w:0};ps.forEach((p,i)=>{const r=monthRow(p,A,B);T0.d+=r.d;T0.n+=r.n;T0.t+=r.total;T0.a+=r.abs;T0.l+=r.leave;T0.x+=r.extra;T0.w+=r.w;
              h+=`<tr><td>${i+1}</td><td>${esc(pName(p.id))}${p.role==='sup'?' ★':p.role==='res'?' ('+t('reserve')+')':''}${p.left?' — '+t('leftOn')+' '+p.left:''}</td><td>${esc(teamName(teamAt(p,B)))}</td><td>${esc(siteName(siteAt(p,B)))}</td><td>${r.d}</td><td>${r.n}</td><td><b>${r.total}</b></td><td>${r.total*12}</td><td>${r.abs}</td><td>${r.leave}</td><td>${r.extra}</td><td>${r.w}</td></tr>`;});
            h+=`<tr class="tot"><td></td><td>${t('total')}</td><td></td><td></td><td>${T0.d}</td><td>${T0.n}</td><td>${T0.t}</td><td>${T0.t*12}</td><td>${T0.a}</td><td>${T0.l}</td><td>${T0.x}</td><td>${T0.w}</td></tr></table><div class="sig"><div>${t('sign1')}</div><div>${t('sign2')}</div></div></body></html>`;return h;}
          function sheetText(A,B){const m=MONTHS[L()][parse(A).getMonth()]+' '+parse(A).getFullYear();let o=`${t('actual')} — ${m}\n${'─'.repeat(20)}\n`;
            sheetPeople(A,B).forEach(p=>{const r=monthRow(p,A,B);o+=`${pName(p.id)} (${siteName(siteAt(p,B))}): ${r.total} (${t('dayC')} ${r.d} · ${t('nightC')} ${r.n})${r.abs?' · '+t('absC')+' '+r.abs:''}${r.leave?' · '+t('leaveC')+' '+r.leave:''}${r.extra?' · '+t('extraC')+' '+r.extra:''}${r.w?' · ⚠️'+r.w:''}\n`;});return o;}
          function personMonthHtml(p,A,B,r){const m=MONTHS[L()][parse(A).getMonth()]+' '+parse(A).getFullYear();
            let h=docHead(pName(p.id))+`<h1>${esc(pName(p.id))} — ${t('actual')}</h1><div class="sub">${esc(teamName(p.team))} · 📍${esc(siteName(curSite(p)))} · ${m}</div><table><tr><th>${t('dayC')}</th><th>${t('nightC')}</th><th>${t('total')}</th><th>${t('hours')}</th><th>${t('absC')}</th><th>${t('leaveC')}</th><th>${t('extraC')}</th></tr><tr><td>${r.d}</td><td>${r.n}</td><td><b>${r.total}</b></td><td>${r.total*12}</td><td>${r.abs}</td><td>${r.leave}</td><td>${r.extra}</td></tr></table><br>
            <table><tr><th>#</th><th>${t('date')}</th><th>${t('shiftT')}</th><th>${t('type')}</th></tr>`+r.list.map((x,i)=>`<tr><td>${i+1}</td><td>${fmt(parse(x.k))}</td><td>${t(x.type)}</td><td>${t('kind_'+x.kind)}</td></tr>`).join('')+`</table><div class="sig"><div>${t('sign1')}</div><div>${t('sign2')}</div></div></body></html>`;return h;}
          const textHtml=txt=>docHead(t('report'))+`<pre>${esc(txt)}</pre></body></html>`;
          function range(){let a,b;if(rp.per==='this'){a=new Date(now.getFullYear(),now.getMonth(),1);b=new Date(now.getFullYear(),now.getMonth()+1,0);}else if(rp.per==='last'){a=new Date(now.getFullYear(),now.getMonth()-1,1);b=new Date(now.getFullYear(),now.getMonth(),0);}else{a=parse(rp.from||ymd(now));b=parse(rp.to||ymd(now));if(b<a)[a,b]=[b,a];}return[a,b];}
          function buildReport(){const[a,b]=range();const A=ymd(a),B=ymd(b);const pm=isPM(),sv=Object.assign({},rp.sec);if(pm){['shifts','inc','cards','logs','notes'].forEach(k=>rp.sec[k]=false);}else{['train','stock','evals'].forEach(k=>rp.sec[k]=false);}
            let o=`${t('report')} ${t('app')}\n${C().myName?C().myName+' — ':''}${pm?t('modePM'):teamFull(C().myTeam)}\n${t('period')}: ${fmt(a)} → ${fmt(b)}\n${'─'.repeat(24)}\n`;
            const my=[];kRange(A,B).forEach(k=>{const s=teamShift(C().myTeam,k);if(s!=='O')my.push({date:parse(k),type:s,id:k+'_'+s});});
            const started=x=>shiftTimes(x.date,x.type).s<=now;
            if(rp.sec.shifts){const dn=my.filter(x=>x.type==='D').length,nn=my.filter(x=>x.type==='N').length;o+=`\n■ ${t('secShifts')}\n${t('D')}: ${dn} · ${t('N')}: ${nn} · ${t('total')}: ${dn+nn} ${t('shifts')} (${(dn+nn)*12} ${t('hours')})\n`;}
            if(rp.sec.inc){o+=`\n■ ${t('secIncidents')}\n`;let n=0;my.forEach(x=>{const g=S.logs[x.id];if(g&&g.inc)g.inc.forEach(i=>{n++;o+=`- ${fmtS(x.date)} ${ICO[x.type]} ${i.time} [${t('inc_'+i.type)}] ${i.desc}${i.action?' ↳ '+i.action:''}\n`;});});if(!n)o+=t('nothing')+'\n';}
            if(rp.sec.cards){o+=`\n■ ${t('secCards')} (${t('total')} ${C().cards})\n`;let n=0;my.forEach(x=>{const g=S.logs[x.id];if(g&&(g.recv!=null||g.hand!=null)){n++;const bad=(g.recv!=null&&g.recv!==+C().cards)||(g.recv!=null&&g.hand!=null&&g.recv!==g.hand);o+=`- ${fmtS(x.date)} ${ICO[x.type]} ${t('received')} ${g.recv==null?'—':g.recv} / ${t('handed')} ${g.hand==null?'—':g.hand}${bad?' ⚠️'+(g.cardNote?' '+g.cardNote:''):''}\n`;}});if(!n)o+=t('nothing')+'\n';}
            if(rp.sec.logs){const ns=my.filter(x=>x.type==='N'&&started(x));if(ns.length){o+=`\n■ ${t('secLogs')}\n`;ns.forEach(x=>{const g=S.logs[x.id]||{};o+=`- ${fmtS(x.date)}: ${t('visitorsLog')} ${g.vis?'✓':'✗'} · ${t('workersLog')} ${g.wrk?'✓':'✗'}\n`;});}}
            if(rp.sec.notes){o+=`\n■ ${t('secNotes')}\n`;let n=0;my.forEach(x=>{const g=S.logs[x.id];if(g&&g.notes){n++;o+=`- ${fmtS(x.date)} ${ICO[x.type]}: ${g.notes.replace(/\n/g,' / ')}\n`;}});if(!n)o+=t('nothing')+'\n';}
            if(rp.sec.team){o+=`\n■ ${t('secTeam')}\n`;const ev=S.events.filter(e=>(e.from<=B&&e.to>=A)||(e.back&&e.back>=A&&e.back<=B)).sort((x,y)=>x.from<y.from?-1:1);const as=S.asg.filter(x=>x.k>=A&&x.k<=B).sort((x,y)=>x.k<y.k?-1:1);o+=(ev.length||as.length)?ev.map(e=>`- ${evDates(e)}: ${evText(e)}${e.note?' ('+e.note+')':''}`).concat(as.map(x=>`- ${x.k}: ${asgText(x)}`)).join('\n')+'\n':t('nothing')+'\n';}
            if(rp.sec.warn){o+=`\n■ ${t('secWarn')}\n`;const ws=S.warns.filter(w=>w.date>=A&&w.date<=B).sort((x,y)=>x.date<y.date?-1:1);o+=ws.length?ws.map(w=>`- ${w.date} ${pName(w.p)}: ${t('w_'+w.type)}${w.reason?' — '+w.reason:''}${w.ded?' ('+t('deduct')+' '+w.ded+' '+(w.dedType==='amount'?t('dedAmount'):t('dedDays'))+')':''}`).join('\n')+'\n':t('nothing')+'\n';}
            if(rp.sec.uni){o+=`\n■ ${t('secUni')}\n`;const us=S.uni.filter(u=>u.date>=A&&u.date<=B).sort((x,y)=>x.date<y.date?-1:1);if(!us.length)o+=t('nothing')+'\n';else{us.forEach(u=>o+=`- ${u.date} ${pName(u.p)}: ${uniLine(u)}${u.note?' ('+u.note+')':''}\n`);const got=new Set(us.map(u=>u.p));const miss=personList().filter(p=>!got.has(p.id));if(miss.length)o+=`${t('notReceived')}: ${miss.map(p=>p.name).join('، ')}\n`;}}
          EOF_FILE

      - name: Create project files (22)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
            if(rp.sec.train){o+=`\n■ ${t('train')}\n`;const tr=allTrainings().filter(x=>x.date>=A&&x.date<=B);o+=tr.length?tr.map(x=>`- ${fmtK(x.date)} ${x.time} — ${teamFull(x.team)}`).join('\n')+'\n':t('nothing')+'\n';}
            if(rp.sec.stock){o+=`\n■ ${t('stock')}\n`;const sh=S.ships.filter(x=>x.date>=A&&x.date<=B);o+=sh.length?sh.map(shipText).join('\n')+'\n':t('nothing')+'\n';}
            if(rp.sec.evals){o+=`\n■ ${t('evals')}\n`;const ms=new Set();kRange(A,B).forEach(k=>ms.add(k.slice(0,7)));let n=0;[...ms].forEach(m=>{const ev=S.evals.filter(x=>x.m===m);const w=S.eom.find(x=>x.m===m);if(ev.length||w){o+=`${monthLabel(m)}${w?' — 🏆 '+pName(w.p):''}\n`;ev.sort((a,b)=>b.score-a.score).forEach(x=>{n++;o+=`- ${pName(x.p)}: ${x.score}% (${t(gradeKey(x.score))})\n`;});}});if(!n)o+=t('nothing')+'\n';}
            rp.sec=sv;return o+`\n${t('generated')}: ${fmt(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;}


          // ================= PM / ADMIN =================
          const monthLabel=m=>MONTHS[L()][+m.slice(5,7)-1]+' '+m.slice(0,4);
          const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
          const addMonth=(m,n)=>{const d=new Date(+m.slice(0,4),+m.slice(5,7)-1+n,1);return ymOf(d);};
          function gradeKey(s){s=+s;return s<50?'g_weak':s<65?'g_ok':s<75?'g_good':s<85?'g_vgood':'g_exc';}
          function gradeTag(s){const k=gradeKey(s);const st={g_weak:'background:var(--dangerBg);color:var(--danger)',g_ok:'background:var(--nightBg);color:var(--night)',g_good:'background:var(--dayBg);color:var(--day)',g_vgood:'background:var(--card);color:var(--accent)',g_exc:'background:var(--offBg);color:var(--off)'}[k];return `<span class="pill" style="${st}">${s}% · ${t(k)}</span>`;}
          function curSlotNow(){const k=ymd(now),tm=mins(C().start),m=now.getHours()*60+now.getMinutes();if(m>=tm&&m<tm+720)return{k,ty:'D'};if(m>=tm+720)return{k,ty:'N'};return{k:kAdd(k,-1),ty:'N'};}
          function kpiGrid(){const k=ymd(now),cs=curSlotNow(),si=slotInfo(cs.k,cs.ty);
            const absent=S.events.filter(e=>e.type==='absence'&&e.from<=k&&e.to>=k).length,leave=S.events.filter(e=>e.type==='leave'&&e.from<=k&&e.to>=k).length;
            const sh=shortDays(k,kAdd(k,7)).length,al=dueList().length;
            const box=(n,l,bad,go)=>`<div class="kpi" ${go?`data-go="${go}" style="cursor:pointer"`:''}><b class="${bad?'bad':''}">${n}</b><span>${l}</span></div>`;
            return `<div class="kpis">${box(activePeople().length,t('kMembers'),0,'emp')}${box(si.sites.reduce((a,x)=>a+x.have,0)+'/'+si.sites.reduce((a,x)=>a+x.need,0),t('kOnDuty')+' '+ICO[cs.ty]+' '+teamName(si.team),0)}${box(absent,t('kAbsent'),absent)}${box(leave,t('kLeave'),0)}${box(sh,t('kShort'),sh,'cal')}${box(al,t('kAlerts'),al)}</div>`;}
          function rotBoard(){const ks=[];for(let i=0;i<14;i++)ks.push(ymd(addDays(now,i)));
            let h=`<div class="card"><h3>🔄 ${t('rotBoard')}</h3><div class="scrollx"><table class="tbl" style="font-size:11px"><tr><th></th>${ks.map(k=>`<th data-day="${k}" style="cursor:pointer;${k===ymd(now)?'color:var(--accent)':''}">${SDAYS[L()][parse(k).getDay()].slice(0,3)}<br>${parse(k).getDate()}</th>`).join('')}</tr>`;
            [0,1,2].forEach(tm=>{const sp=supOf(tm);h+=`<tr><td style="white-space:nowrap"><b>${esc(teamName(tm))}</b>${sp?'<br><span class="muted">'+esc(pName(sp.id))+'</span>':''}</td>`+ks.map(k=>{const ty=teamShift(tm,k);return `<td class="${ty}-b" style="padding:4px 1px">${ty==='O'?'·':ICO[ty]}</td>`;}).join('')+'</tr>';});
            const A=ymd(new Date(now.getFullYear(),now.getMonth(),1)),B=ymd(new Date(now.getFullYear(),now.getMonth()+1,0));
            return h+`</table></div><div class="muted" style="margin-top:6px">${t('hoursMonth')}: ${[0,1,2].map(tm=>teamName(tm)+' '+kRange(A,B).filter(k=>teamShift(tm,k)!=='O').length*12+t('hS')).join(' · ')}</div></div>`;}
          function shortCard(){const sd=shortDays(ymd(now),kAdd(ymd(now),7));if(!sd.length)return '';return `<div class="card"><h3>${t('upShort')}</h3>`+sd.map(x=>{const miss=[].concat(...x.sites.map(s=>s.absent.filter(p=>!s.asg.some(a=>a.for===p.id)).map(p=>pName(p.id))));
            return `<div class="item" data-day="${x.k}" style="cursor:pointer"><div class="h"><span>${ICO[x.type]} ${fmtK(x.k)} — ${esc(teamFull(x.team))}</span><span class="pill" style="background:var(--dangerBg);color:var(--danger)">${t('needs')} ${x.short}</span></div>${miss.length?`<div class="b">❌ ${miss.map(esc).join('، ')}</div>`:''}</div>`;}).join('')+'</div>';}
          function rHomePM(){const v=$('v-home');let h=`<div class="phead"><div class="av">🧭</div><div><div class="nm">${esc(C().myName||t('modePM'))}</div><div class="muted">${t('modePM')} · ${fmt(now)}</div></div></div>`;
            h+=kpiGrid()+dueAlerts()+rotBoard()+shortCard();
            const uc=upcomingConflicts();if(uc.length)h+=`<div class="card"><h3>${t('upConf')}</h3>`+uc.map(x=>`<div class="item" data-pid="${x.pid}"><div class="h">${esc(pName(x.pid))} — ${ICO[x.ty]} ${fmtK(x.k)}</div><div class="b">${x.c.map(esc).join('\n')}</div></div>`).join('')+'</div>';
            h+=`<div class="sec">${t('today')} — ${t('staffing')}</div>${teamsForDay(ymd(now))}`;
            v.innerHTML=h;bindCommon(v);bindSlots(v,null);bindDue(v);}
          // ---- reminders ----
          const hmNow=()=>pad(now.getHours())+':'+pad(now.getMinutes());
          const isDue=x=>!x.done&&(x.date<ymd(now)||(x.date===ymd(now)&&(x.time||'00:00')<=hmNow()));
          const dueList=()=>S.notes.filter(isDue);
          function dueAlerts(){let h=dueList().map(x=>`<div class="alert" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>🔔 ${esc(x.text)} <span style="font-weight:400;font-size:12px">${fmtK(x.date)} ${x.time||''}</span></span><button class="btn sm" data-ndone="${x.id}">✓</button></div>`).join('');
            const k=ymd(now),k1=kAdd(k,1);const tr=allTrainings().filter(x=>(x.date===k||x.date===k1)&&(isPM()||C().mode==='sup'||x.team===C().myTeam));
            h+=tr.map(x=>`<div class="item" data-day="${x.date}" style="cursor:pointer;background:var(--dayBg)"><div class="h">🎓 ${t('trainOf')} ${esc(teamFull(x.team))}</div><div class="b">${x.date===k?t('today'):fmtK(x.date)} · ${x.time}</div></div>`).join('');return h;}
          function bindDue(v){v.querySelectorAll('[data-ndone]').forEach(b=>b.onclick=e=>{e.stopPropagation();const n=S.notes.find(x=>x.id===b.dataset.ndone);if(n){n.done=true;save();}render();});}
          let lastDue=-1;
          function updBell(){const n=dueList().length;const b=$('bell');if(b)b.innerHTML='🔔'+(n?`<span class="bdg">${n}</span>`:'');if(lastDue>=0&&n>lastDue){const x=dueList().slice(-1)[0];if(x)toast('🔔 '+x.text);try{navigator.vibrate&&navigator.vibrate(300);}catch(e){}}lastDue=n;}
          EOF_FILE

      - name: Create project files (23)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
          function notesSheet(){const k=ymd(now);const due=S.notes.filter(isDue),up=S.notes.filter(x=>!x.done&&!isDue(x)).sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1),dn=S.notes.filter(x=>x.done).slice(-10).reverse();
            const row=x=>`<div class="item"><div class="h"><span>📌 ${esc(x.text)}</span><span style="white-space:nowrap">${x.done?'':`<button class="btn sm pri" data-ndone="${x.id}">✓</button> `}<button class="btn sm dang" data-ndel="${x.id}">✕</button></span></div><div class="b">${fmt(parse(x.date))} ${x.time||''}</div></div>`;
            openSheet(`<h3>🔔 ${t('notes2')}</h3><div class="item"><label>${t('noteText')}</label><input id="nT"><div class="row"><div><label>${t('date')}</label><input type="date" id="nD" value="${k}"></div><div><label>${t('time')}</label><input type="time" id="nH" value="09:00"></div></div><button class="btn pri full" id="nA">${t('addNote')}</button></div>`+
              (due.length?`<div class="sec">${t('due')}</div>`+due.map(row).join(''):'')+(up.length?`<div class="sec">${t('upcomingN')}</div>`+up.map(row).join(''):'')+(dn.length?`<div class="sec">${t('doneN')}</div>`+dn.map(row).join(''):'')+(!S.notes.length?`<div class="empty-msg">${t('noNotes2')}</div>`:'')+`<button class="btn full" id="nC">${t('close')}</button>`);
            $('nC').onclick=()=>{closeSheet();render();};
            $('nA').onclick=()=>{const tx=$('nT').value.trim();if(!tx){$('nT').focus();return;}S.notes.push({id:uid(),text:tx,date:$('nD').value||k,time:$('nH').value||'',done:false});save();toast(t('saved'));notesSheet();updBell();};
            $('panel').querySelectorAll('[data-ndone]').forEach(b=>b.onclick=()=>{const n=S.notes.find(x=>x.id===b.dataset.ndone);if(n)n.done=true;save();notesSheet();updBell();});
            $('panel').querySelectorAll('[data-ndel]').forEach(b=>b.onclick=()=>{S.notes=S.notes.filter(x=>x.id!==b.dataset.ndel);save();notesSheet();updBell();});}
          // ---- training ----
          function allTrainings(){const o=[];S.trainings.forEach(tr=>tr.items.forEach(it=>o.push({date:it.date,team:it.team,time:tr.time,tid:tr.id})));return o.sort((a,b)=>a.date<b.date?-1:1);}
          const trainingsOn=k=>allTrainings().filter(x=>x.date===k);
          function trainPlan(start){return [0,1,2].map(tm=>{let k=start;for(let i=0;i<14;i++){if(teamShift(tm,kAdd(k,-1))==='N'&&teamShift(tm,k)==='O')return{team:tm,date:k};k=kAdd(k,1);}return{team:tm,date:start};}).sort((a,b)=>a.date<b.date?-1:1);}
          function timeWords(hhmm){const[h,m]=hhmm.split(':').map(Number);const ar=L()==='ar';const h12=h%12||12;const pm=h>=12;return ar?`${h12}${m?':'+pad(m):''} ${pm?'مساءً':'صباحاً'}`:`${h12}${m?':'+pad(m):''} ${pm?'PM':'AM'}`;}
          function trainMsg(tr){const d0=parse(tr.items[0].date);const mn=MONTHS[L()][d0.getMonth()];const dm=k=>pad(parse(k).getDate())+'/'+pad(parse(k).getMonth()+1);
            if(L()==='ar')return `السلام عليكم،\n${tr.change?'تغيير في مواعيد التدريب للجميع.\n':''}التدريب الشهري المقرر في شهر ${mn} حيكون على النحو الآتي:\n\n`+tr.items.map(x=>`يوم ${DAYS.ar[parse(x.date).getDay()]} الموافق ${dm(x.date)} - الفريق-${pad(x.team+1)}.`).join('\n\n')+`\n\nالحضور على تمام الساعة ${timeWords(tr.time)}،\nموفقين إن شاء الله`;
            return `Hello all,\n${tr.change?'Training schedule has changed.\n':''}This month's training (${mn}) will be as follows:\n\n`+tr.items.map(x=>`${DAYS.en[parse(x.date).getDay()]} ${dm(x.date)} - Team-${pad(x.team+1)}.`).join('\n\n')+`\n\nAttendance at ${timeWords(tr.time)} sharp.\nGood luck`;}
          function trainForm(){let st=ymd(now),tm='09:00',ch=false,items=trainPlan(st);
            const draw=()=>{const tr={items,time:tm,change:ch};openSheet(`<h3>${t('trainGen')}</h3><p class="muted">${t('trainHint')}</p><div class="row"><div><label>${t('trainStart')}</label><input type="date" id="tgS" value="${st}"></div><div><label>${t('trainTime')}</label><input type="time" id="tgT" value="${tm}"></div></div>
              <label class="chk" style="margin-top:6px"><input type="checkbox" id="tgC" ${ch?'checked':''}>${t('trainChange')}</label>`+
              items.map((x,i)=>`<div class="tl"><b>${esc(teamFull(x.team))}</b><input type="date" data-tgi="${i}" value="${x.date}" style="width:auto"></div>`).join('')+
              `<label>${t('trainMsg')}</label><pre class="rep">${esc(trainMsg(tr))}</pre><div class="btns"><button class="btn pri" id="tgOk">${t('save')}</button><button class="btn" id="tgCp">${t('copy')}</button><button class="btn" id="tgSh">${t('share')}</button></div><button class="btn full" id="tgX">${t('cancel')}</button>`);
              $('tgS').onchange=e=>{if(e.target.value){st=e.target.value;items=trainPlan(st);draw();}};$('tgT').onchange=e=>{if(e.target.value){tm=e.target.value;draw();}};$('tgC').onchange=e=>{ch=e.target.checked;draw();};
              $('panel').querySelectorAll('[data-tgi]').forEach(i=>i.onchange=()=>{if(i.value){items[+i.dataset.tgi].date=i.value;items.sort((a,b)=>a.date<b.date?-1:1);draw();}});
              $('tgCp').onclick=()=>copyText(trainMsg(tr));$('tgSh').onclick=()=>shareText(trainMsg(tr));$('tgX').onclick=closeSheet;
              $('tgOk').onclick=()=>{S.trainings.push({id:uid(),m:items[0].date.slice(0,7),time:tm,change:ch,items:items.map(x=>({team:x.team,date:x.date}))});save();closeSheet();render();toast(t('saved'));};};draw();}
          // ---- stock ----
          const itemN=id=>{const it=C().items.find(x=>x.id===id);return it?it.name:id;};
          function shipText(sh){return `📦 ${fmtK(sh.date)}: `+sh.lines.map(l=>`${itemN(l.it)} ${l.q.reduce((a,b)=>a+b,0)} (${[0,1,2].map(i=>teamName(i)+' '+l.q[i]).join('، ')})`).join(' | ');}
          function shipMsg(sh){return `📦 ${fmt(parse(sh.date))}\n`+sh.lines.map(l=>`${itemN(l.it)}: ${l.q.reduce((a,b)=>a+b,0)}\n`+[0,1,2].map(i=>`  - ${teamFull(i)}: ${l.q[i]}`).join('\n')).join('\n')+(sh.note?'\n'+sh.note:'');}
          function shipForm(){const its=C().items;if(!its.length){toast(t('noItems'));return;}const rows={};its.forEach(it=>rows[it.id]={tot:'',q:['','',''],touched:false});
            const splitEq=n=>{const b=Math.floor(n/3),r=n%3;return [0,1,2].map(i=>b+(i<r?1:0));};
          EOF_FILE

      - name: Create project files (24)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
            openSheet(`<h3>${t('newShip')}</h3><label>${t('shipDate')}</label><input type="date" id="shD" value="${ymd(now)}">`+its.map(it=>`<div class="item"><div class="row" style="align-items:center"><b style="flex:2">${esc(it.name)}</b><input type="number" inputmode="numeric" data-tot="${it.id}" placeholder="${t('totalQ')}" style="flex:1"></div><div class="row" style="margin-top:6px">${[0,1,2].map(i=>`<div><label style="margin:0">${esc(teamName(i))}</label><input type="number" inputmode="numeric" data-q="${it.id}|${i}"></div>`).join('')}</div></div>`).join('')+
              `<label>${t('note')}</label><input id="shN"><div class="btns"><button class="btn pri" id="shOk">${t('save')}</button><button class="btn" id="shC">${t('cancel')}</button></div>`);
            $('panel').querySelectorAll('[data-tot]').forEach(i=>i.oninput=()=>{const id=i.dataset.tot,n=Math.max(0,parseInt(i.value,10)||0);const q=splitEq(n);q.forEach((v,ix)=>{$('panel').querySelector(`[data-q="${id}|${ix}"]`).value=n?v:'';});});
            $('panel').querySelectorAll('[data-q]').forEach(i=>i.oninput=()=>{const id=i.dataset.q.split('|')[0];const sum=[0,1,2].reduce((a,ix)=>a+(parseInt($('panel').querySelector(`[data-q="${id}|${ix}"]`).value,10)||0),0);$('panel').querySelector(`[data-tot="${id}"]`).value=sum||'';});
            $('shC').onclick=closeSheet;
            $('shOk').onclick=()=>{const lines=its.map(it=>({it:it.id,q:[0,1,2].map(ix=>Math.max(0,parseInt($('panel').querySelector(`[data-q="${it.id}|${ix}"]`).value,10)||0))})).filter(l=>l.q.some(x=>x>0));
              if(!lines.length){toast(t('totalQ'));return;}const sh={id:uid(),date:$('shD').value||ymd(now),lines,note:$('shN').value.trim()};S.ships.push(sh);save();
              openSheet(`<h3>✓ ${t('saved')}</h3><pre class="rep">${esc(shipMsg(sh))}</pre><div class="btns"><button class="btn" id="smC">${t('copy')}</button><button class="btn" id="smS">${t('share')}</button></div><button class="btn pri full" id="smX">${t('close')}</button>`);
              $('smC').onclick=()=>copyText(shipMsg(sh));$('smS').onclick=()=>shareText(shipMsg(sh));$('smX').onclick=()=>{closeSheet();render();};};}
          // ---- admin view ----
          let adminSub='train',evalM=null,eomM=null;
          function eligibleFor(m){const act=activePeople();let set=[];S.eom.filter(x=>x.m<m).sort((a,b)=>a.m<b.m?-1:1).forEach(w=>{set.push(w.p);if(act.every(p=>set.includes(p.id)))set=[];});
            let el=act.filter(p=>!set.includes(p.id));const reset=!el.length;if(reset)el=act;return{el,reset};}
          function rAdmin(){const v=$('v-admin');if(!evalM)evalM=ymOf(now);if(!eomM)eomM=ymOf(now);const ar=L()==='ar';
            let h=`<div class="tabs">${[['train','🎓 '+t('train')],['stock','📦 '+t('stock')],['evals','⭐ '+t('evals')],['eom','🏆 '+t('eom')],['notes','🔔 '+t('notes2')]].map(([k,l])=>`<button data-as="${k}" class="${adminSub===k?'on':''}">${l}</button>`).join('')}</div>`;
            const mnav=(id,m)=>`<div class="mnav"><button class="btn" data-mn="${id}|-1">${ar?'›':'‹'}</button><b>${monthLabel(m)}</b><button class="btn" data-mn="${id}|1">${ar?'‹':'›'}</button></div>`;
            if(adminSub==='train'){h+=`<button class="btn pri full" id="aTG" style="margin:0 0 12px">${t('trainGen')}</button>`;
              const trs=S.trainings.slice().sort((a,b)=>a.items[0].date<b.items[0].date?1:-1);
              h+=trs.length?trs.map(tr=>`<div class="card"><h3><span>🎓 ${monthLabel(tr.items[0].date.slice(0,7))} · ${tr.time}</span><button class="btn sm dang" data-trdel="${tr.id}">${t('del')}</button></h3>${tr.items.map(x=>`<div class="tl" data-day="${x.date}" style="cursor:pointer"><span>${fmt(parse(x.date))}</span><b>${esc(teamFull(x.team))}</b></div>`).join('')}<div class="btns"><button class="btn sm" data-trcp="${tr.id}">${t('copy')}</button><button class="btn sm" data-trsh="${tr.id}">${t('share')}</button></div></div>`).join(''):`<div class="empty-msg">${t('nothing')}</div>`;}
            if(adminSub==='stock'){const A=ymOf(now);const its=C().items;
              h+=`<button class="btn pri full" id="aNS" style="margin:0 0 12px">${t('newShip')}</button>`;
              h+=`<div class="card"><h3>${t('monthTot')} — ${monthLabel(A)}</h3><div class="scrollx"><table class="tbl"><tr><th>${t('items2')}</th>${[0,1,2].map(i=>`<th>${esc(teamName(i))}</th>`).join('')}<th>${t('total')}</th></tr>`+its.map(it=>{const q=[0,0,0];S.ships.filter(x=>x.date.slice(0,7)===A).forEach(sh=>sh.lines.filter(l=>l.it===it.id).forEach(l=>l.q.forEach((v,i)=>q[i]+=v)));return `<tr><td>${esc(it.name)}</td>${q.map(x=>`<td>${x||''}</td>`).join('')}<td><b>${q[0]+q[1]+q[2]||''}</b></td></tr>`;}).join('')+`</table></div></div>`;
              h+=`<div class="card"><h3>${t('ships')}</h3>`+(S.ships.length?S.ships.slice().sort((a,b)=>a.date<b.date?1:-1).map(sh=>`<div class="item"><div class="h"><span>📦 ${fmt(parse(sh.date))}</span><span style="white-space:nowrap"><button class="btn sm" data-shsh="${sh.id}">📤</button> <button class="btn sm dang" data-shdel="${sh.id}">✕</button></span></div><div class="b">${sh.lines.map(l=>`${esc(itemN(l.it))}: ${l.q.reduce((a,b)=>a+b,0)} → ${l.q.join(' / ')}`).join('\n')}${sh.note?'\n'+esc(sh.note):''}</div></div>`).join(''):`<div class="empty-msg">${t('nothing')}</div>`)+`</div>`;
              h+=`<div class="card"><h3>${t('items2')}</h3>`+its.map((it,i)=>`<div class="row" style="align-items:center;margin-bottom:6px"><input data-itm="${i}" value="${esc(it.name)}" style="flex:4"><button class="btn sm dang" data-itmd="${i}" style="flex:1">${t('del')}</button></div>`).join('')+`<div class="row"><input id="aIN" placeholder="${t('itemName')}" style="flex:4"><button class="btn sm pri" id="aIA" style="flex:1">${t('addItem2')}</button></div></div>`;}
            if(adminSub==='evals'){h+=`<div class="card">${mnav('ev',evalM)}<p class="muted">${t('g_weak')} &lt;50 · ${t('g_ok')} 50 · ${t('g_good')} 65 · ${t('g_vgood')} 75 · ${t('g_exc')} 85+</p></div>`;
              [0,1,2].forEach(tm=>{const ms=teamMembers(tm);if(!ms.length)return;h+=`<div class="sec">${esc(teamFull(tm))}</div><div class="card" style="padding:8px 12px">`+ms.map(p=>{const e=S.evals.find(x=>x.p===p.id&&x.m===evalM);return `<div class="tl" style="gap:6px"><span data-pid="${p.id}" style="cursor:pointer;flex:1">${esc(pName(p.id))}</span><span id="g_${p.id}">${e?gradeTag(e.score):''}</span><input type="number" inputmode="numeric" min="0" max="100" data-ev="${p.id}" value="${e?e.score:''}" style="width:70px;flex:0 0 auto" placeholder="%"></div>`;}).join('')+'</div>';});}
            if(adminSub==='eom'){const w=S.eom.find(x=>x.m===eomM);const{el,reset}=eligibleFor(eomM);
          EOF_FILE

      - name: Create project files (25)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
              h+=`<div class="card">${mnav('eo',eomM)}`+(w?`<div class="phead" style="background:var(--dayBg);margin:0"><div class="av">🏆</div><div style="flex:1"><div class="nm">${esc(pName(w.p))}</div><div class="muted">${t('eomWinner')} · ${monthLabel(eomM)}</div></div><button class="btn sm dang" data-eodel="${eomM}">✕</button></div>`:'')+'</div>';
              if(!w){h+=`<div class="sec">${t('eomNoms')} · ${el.length} ${t('eomCycle')}</div>`+(reset?`<div class="okbox" style="margin-bottom:8px">${t('eomReset')}</div>`:'');
                h+=el.map(p=>({p,e:S.evals.find(x=>x.p===p.id&&x.m===eomM)})).sort((a,b)=>(b.e?b.e.score:-1)-(a.e?a.e.score:-1)).map(({p,e})=>`<div class="tl"><span><b>${esc(pName(p.id))}</b> <span class="muted">${esc(teamName(p.team))}</span></span><span style="display:flex;gap:6px;align-items:center">${e?gradeTag(e.score):''}<button class="btn sm pri" data-eopick="${p.id}">${t('eomPick')}</button></span></div>`).join('');}
              const hist=S.eom.slice().sort((a,b)=>a.m<b.m?1:-1);if(hist.length)h+=`<div class="card"><h3>${t('eomHist')}</h3>${hist.map(x=>`<div class="tl"><span>${monthLabel(x.m)}</span><b>🏆 ${esc(pName(x.p))}</b></div>`).join('')}</div>`;}
            if(adminSub==='notes'){h+=`<button class="btn pri full" id="aNo">🔔 ${t('notes2')}</button>`;}
            v.innerHTML=h;bindCommon(v);
            v.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{adminSub=b.dataset.as;rAdmin();});
            v.querySelectorAll('[data-mn]').forEach(b=>b.onclick=()=>{const[id,n]=b.dataset.mn.split('|');if(id==='ev')evalM=addMonth(evalM,+n);else eomM=addMonth(eomM,+n);rAdmin();});
            if($('aTG'))$('aTG').onclick=trainForm;if($('aNS'))$('aNS').onclick=shipForm;if($('aNo'))$('aNo').onclick=notesSheet;
            v.querySelectorAll('[data-trdel]').forEach(b=>b.onclick=()=>confirmBox(t('confirmDel'),()=>{S.trainings=S.trainings.filter(x=>x.id!==b.dataset.trdel);save();rAdmin();}));
            v.querySelectorAll('[data-trcp]').forEach(b=>b.onclick=()=>copyText(trainMsg(S.trainings.find(x=>x.id===b.dataset.trcp))));
            v.querySelectorAll('[data-trsh]').forEach(b=>b.onclick=()=>shareText(trainMsg(S.trainings.find(x=>x.id===b.dataset.trsh))));
            v.querySelectorAll('[data-shsh]').forEach(b=>b.onclick=()=>shareText(shipMsg(S.ships.find(x=>x.id===b.dataset.shsh))));
            v.querySelectorAll('[data-shdel]').forEach(b=>b.onclick=()=>confirmBox(t('confirmDel'),()=>{S.ships=S.ships.filter(x=>x.id!==b.dataset.shdel);save();rAdmin();}));
            v.querySelectorAll('[data-itm]').forEach(i=>i.onchange=()=>{const v2=i.value.trim();if(v2){C().items[+i.dataset.itm].name=v2;save();toast(t('saved'));}});
            v.querySelectorAll('[data-itmd]').forEach(b=>b.onclick=()=>confirmBox(t('confirmDel'),()=>{C().items.splice(+b.dataset.itmd,1);save();rAdmin();}));
            if($('aIA'))$('aIA').onclick=()=>{const n=$('aIN').value.trim();if(!n){$('aIN').focus();return;}C().items.push({id:'it'+uid(),name:n,unit:''});save();rAdmin();};
            v.querySelectorAll('[data-ev]').forEach(i=>i.onchange=()=>{const pid=i.dataset.ev;S.evals=S.evals.filter(x=>!(x.p===pid&&x.m===evalM));if(i.value!==''){const sc=Math.max(0,Math.min(100,Math.round(+i.value)));i.value=sc;S.evals.push({id:uid(),p:pid,m:evalM,score:sc});$('g_'+pid).innerHTML=gradeTag(sc);}else $('g_'+pid).innerHTML='';save();});
            v.querySelectorAll('[data-eopick]').forEach(b=>b.onclick=()=>{S.eom=S.eom.filter(x=>x.m!==eomM);S.eom.push({m:eomM,p:b.dataset.eopick});save();rAdmin();toast('🏆');});
            v.querySelectorAll('[data-eodel]').forEach(b=>b.onclick=()=>confirmBox(t('confirmDel'),()=>{S.eom=S.eom.filter(x=>x.m!==b.dataset.eodel);save();rAdmin();}));}

          // ================= SETTINGS =================
          function doRestore(text){let x;try{x=JSON.parse(text);if(!x||!x.cfg)throw 0;}catch(e){toast(t('bad'));return;}confirmBox(t('restoreQ'),()=>{S=normalize(x);save();toast(t('restored'));render();});}
          function rSet(){const v=$('v-set'),c=C();let h=`<div class="card"><h3>🌐 ${t('language')}</h3><div class="seg"><button data-lang="ar" class="${c.lang==='ar'?'on':''}">العربية</button><button data-lang="en" class="${c.lang==='en'?'on':''}">English</button></div>
            <h3>🎨 ${t('theme')}</h3><div class="seg">${['dark','light','auto'].map(k=>`<button data-th="${k}" class="${c.theme===k?'on':''}">${k==='dark'?'🌙 ':k==='light'?'☀️ ':'⚙️ '}${t(k)}</button>`).join('')}</div></div>`;
            h+=`<div class="card"><h3>🧑‍✈️ ${t('mode')}</h3><div class="seg"><button data-mode="member" class="${c.mode==='member'?'on':''}">${t('modeMember')}</button><button data-mode="sup" class="${c.mode==='sup'?'on':''}">★ ${t('modeSup')}</button><button data-mode="pm" class="${c.mode==='pm'?'on':''}">🧭 ${t('modePM')}</button></div>
              ${c.mode==='pm'?'':`<h3>👤 ${t('myTeam')}</h3><div class="seg">${[0,1,2].map(i=>`<button data-mt="${i}" class="${c.myTeam===i?'on':''}">${esc(teamFull(i))}</button>`).join('')}</div>`}<label>${t('myName')}</label><input id="sMe" value="${esc(c.myName)}">
              <button class="btn full" id="sSetup">${t('rerunSetup')}</button></div>`;
            h+=`<div class="card"><h3>👥 ${t('teams')}</h3>`+[0,1,2].map(i=>`<div class="tl"><span><b>${esc(teamFull(i))}</b> <span class="muted">· ${teamMembers(i).length}</span></span><button class="btn sm pri" data-tedit="${i}">${t('editTeam')}</button></div>`).join('')+`</div>`;
            h+=`<div class="card"><h3>⏰ ${t('times')}</h3><div class="row"><div><label>${t('fpStart')}</label><input type="time" data-k="fpStart" value="${c.fpStart}"></div><div><label>${t('fpEnd')}</label><input type="time" data-k="fpEnd" value="${c.fpEnd}"></div></div>
              <label>${t('startTime')}</label><input type="time" data-k="start" value="${c.start}"><p class="muted" style="margin-top:4px">${t('nightNote')}</p>
              <div class="row"><div><label>${t('logFrom')}</label><input type="time" data-k="logFrom" value="${c.logFrom}"></div><div><label>${t('logTo')}</label><input type="time" data-k="logTo" value="${c.logTo}"></div></div>
              <div class="row"><div><label>${t('cardsTotal')}</label><input type="number" inputmode="numeric" id="sCards" value="${c.cards}"></div><div><label>${t('minRest')}</label><input type="number" inputmode="numeric" id="sRest" value="${c.minRest}"></div></div>
              <label>${t('anchor')}</label><input type="date" id="sAnc" value="${c.anchor}"><p class="muted" style="margin-top:4px">${t('hint')}</p></div>`;
            h+=`<div class="card"><h3>📍 ${t('sites')}</h3>`+c.sites.map((x,i)=>`<input data-site="${i}" value="${esc(x.name)}" style="margin-bottom:6px">`).join('')+`</div>`;
          EOF_FILE

      - name: Create project files (26)
        run: |
          cat >> 'app/src/main/assets/index.html' <<'EOF_FILE'
            h+=`<div class="card"><h3>👕 ${t('uniItems')}</h3>`+c.uniItems.map((it,i)=>`<div class="row" style="align-items:center;margin-bottom:6px"><input data-itn="${i}" value="${esc(itemName(it))}" style="flex:4"><button class="btn sm dang" data-itd="${i}" style="flex:1">${t('del')}</button></div>`).join('')+`<button class="btn full" id="itA">${t('addItem')}</button></div>`;
            h+=`<div class="card"><h3>💾 ${t('backup')}</h3><p class="muted">${t('fileHint')}</p><button class="btn pri full" id="bF">${t('shareFile')}</button>
              <label class="btn full" style="margin-top:8px;color:var(--text)">${t('restoreFile')}<input type="file" id="bI" accept=".json,application/json,text/plain,*/*" style="display:none"></label>
              <button class="btn full" id="bC">${t('copyText')}</button><label>${t('pasteText')}</label><textarea id="bT" style="min-height:50px"></textarea><button class="btn full" id="bR">${t('restore')}</button>
              <button class="btn dang full" id="bX">${t('reset')}</button></div><p class="muted" style="text-align:center">v4.0<br>${t('credit')}<br><span dir="ltr">0924682644</span></p>`;
            v.innerHTML=h;
            v.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{c.lang=b.dataset.lang;repOut='';save();render();});
            v.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{c.theme=b.dataset.th;save();render();});
            v.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{const k=+b.dataset.mt;c.myTeam=k;logSel=null;const m=meP();if(m&&m.team!==k)movePerson(m,k,m.site||'compound',ymd(now));save();render();});
            $('sMe').onchange=e=>{c.myName=e.target.value.trim();const m=meP();if(m&&c.myName){m.name=c.myName;}save();render();};
            v.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const nm=b.dataset.mode;if(nm!=='pm'&&!meP()){c.mode=nm;startWizard();wz.mode=nm;wz.step=2;view='setup';render();return;}c.mode=nm;const m=meP();if(m){if(c.mode==='sup')setRole(m,'sup');else if(c.mode==='member'&&m.role==='sup')m.role='mem';}save();render();});
            $('sSetup').onclick=()=>{startWizard();view='setup';render();};
            v.querySelectorAll('[data-tedit]').forEach(b=>b.onclick=()=>teamEditor(+b.dataset.tedit));
            v.querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>{if(i.value){c[i.dataset.k]=i.value;save();toast(t('saved'));}});
            $('sCards').onchange=e=>{const n=parseInt(e.target.value,10);if(n>0){c.cards=n;save();toast(t('saved'));}};
            $('sRest').onchange=e=>{const n=parseInt(e.target.value,10);if(n>=0){c.minRest=n;save();toast(t('saved'));}};
            $('sAnc').onchange=e=>{if(e.target.value){c.anchor=e.target.value;save();toast(t('saved'));}};
            v.querySelectorAll('[data-itn]').forEach(i=>i.onchange=()=>{const it=c.uniItems[+i.dataset.itn];const val=i.value.trim();it.name=(val===t('u_'+it.id))?'':val;save();toast(t('saved'));});
            v.querySelectorAll('[data-itd]').forEach(b=>b.onclick=()=>confirmBox(t('confirmDel'),()=>{c.uniItems.splice(+b.dataset.itd,1);save();rSet();}));
            v.querySelectorAll('[data-site]').forEach(i=>i.onchange=()=>{const v2=i.value.trim();if(v2){c.sites[+i.dataset.site].name=v2;save();toast(t('saved'));}});
            $('itA').onclick=()=>{c.uniItems.push({id:'i'+uid(),name:t('itemName')});save();rSet();};
            $('bF').onclick=()=>shareFile('shifts-backup-'+ymd(now)+'.json','application/json',JSON.stringify(S));
            $('bI').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doRestore(String(r.result));r.readAsText(f);e.target.value='';};
            $('bC').onclick=()=>copyText(JSON.stringify(S));$('bR').onclick=()=>doRestore($('bT').value);
            $('bX').onclick=()=>confirmBox(t('resetQ'),()=>{S={cfg:S.cfg,logs:{},events:[],uni:[],warns:[],asg:[],trainings:[],ships:[],evals:[],eom:[],notes:[],v:4};save();render();});}

          try{const raw=localStorage.getItem(KEY);if(raw)S=normalize(JSON.parse(raw));
            else{const o=JSON.parse(localStorage.getItem('shiftcfg')||'null');if(o){if(o.team)S.cfg.myTeam=o.team-1;if(o.anchor)S.cfg.anchor=o.anchor;}}}catch(e){console.error('load failed',e);}
          save();
          if(!S.cfg.mode)view='setup';
          render();
          setInterval(()=>{now=new Date();updBell();},30000);
          setInterval(()=>{const n=new Date();if(n.getMinutes()!==now.getMinutes()&&(view==='home'||view==='cal')&&!$('sheet').classList.contains('show')&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render();},30000);
          document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(view==='home'||view==='cal')&&!$('sheet').classList.contains('show'))render();});
          })();

          </script>
          </body>
          </html>
          EOF_FILE

      - name: Create project files (27)
        run: |
          mkdir -p 'app/src/main/java/com/mohamed/shifts'
          cat > 'app/src/main/java/com/mohamed/shifts/MainActivity.java' <<'EOF_FILE'
          package com.mohamed.shifts;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.net.Uri;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;
              private WebView printView;
              private ValueCallback<Uri[]> fileCb;
              private static final int PICK = 42;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  boolean dark = isDark();
                  applyBars(dark ? "#0f172a" : "#f1f5f9", !dark);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor(dark ? "#0f172a" : "#f1f5f9"));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          try {
                              startActivityForResult(Intent.createChooser(i, null), PICK);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
              }

              boolean isDark() {
                  int m = getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK;
                  return m == Configuration.UI_MODE_NIGHT_YES;
              }

              void applyBars(String color, boolean light) {
                  int c = Color.parseColor(color);
                  getWindow().setStatusBarColor(c);
                  getWindow().setNavigationBarColor(c);
                  View d = getWindow().getDecorView();
                  int f = d.getSystemUiVisibility();
                  int mask = View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR | View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;
                  f = light ? (f | mask) : (f & ~mask);
                  d.setSystemUiVisibility(f);
              }

              @Override
              public void onConfigurationChanged(Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  if (web != null) web.evaluateJavascript("window.onSysTheme&&window.onSysTheme()", null);
              }

              @Override
              public void onBackPressed() {
                  if (web == null) { finish(); return; }
                  web.evaluateJavascript("(window.handleBack&&window.handleBack())?'1':'0'", value -> {
                      if (value == null || !value.contains("1")) finish();
                  });
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PICK && fileCb != null) {
                      Uri[] r = null;
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) r = new Uri[]{data.getData()};
                      fileCb.onReceiveValue(r);
                      fileCb = null;
                  }
              }

              void doShareFile(String name, String mime, String content) {
                  try {
                      String safe = name.replaceAll("[^A-Za-z0-9._-]", "_");
                      File dir = new File(getCacheDir(), "shared");
                      if (!dir.exists()) dir.mkdirs();
                      File f = new File(dir, safe);
                      try (FileOutputStream out = new FileOutputStream(f)) {
                          out.write(content.getBytes(StandardCharsets.UTF_8));
                      }
                      Uri uri = Uri.parse("content://" + ShareProvider.AUTHORITY + "/" + safe);
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType(mime);
                      i.putExtra(Intent.EXTRA_STREAM, uri);
                      i.setClipData(ClipData.newRawUri(safe, uri));
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      Intent ch = Intent.createChooser(i, null);
                      ch.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(ch);
                  } catch (Exception e) {
                      web.evaluateJavascript("console.error('share failed')", null);
                  }
              }

              void doPrint(String html, String title) {
                  printView = new WebView(this);
                  printView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                          PrintDocumentAdapter adapter = view.createPrintDocumentAdapter(title);
                          pm.print(title, adapter, new PrintAttributes.Builder().build());
                      }
                  });
                  printView.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null);
              }

              class Bridge {
                  @JavascriptInterface
                  public void share(String text) {
                      runOnUiThread(() -> {
                          Intent i = new Intent(Intent.ACTION_SEND);
                          i.setType("text/plain");
                          i.putExtra(Intent.EXTRA_TEXT, text);
                          startActivity(Intent.createChooser(i, null));
                      });
                  }

                  @JavascriptInterface
                  public void shareFile(String name, String mime, String content) {
                      runOnUiThread(() -> doShareFile(name, mime, content));
                  }

                  @JavascriptInterface
                  public void copy(String text) {
                      runOnUiThread(() -> {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(ClipData.newPlainText("shifts", text));
                      });
                  }

                  @JavascriptInterface
                  public boolean isDark() {
          EOF_FILE
          cat >> 'app/src/main/java/com/mohamed/shifts/MainActivity.java' <<'EOF_FILE'
                      return MainActivity.this.isDark();
                  }

                  @JavascriptInterface
                  public void setBars(String color, boolean light) {
                      runOnUiThread(() -> applyBars(color, light));
                  }

                  @JavascriptInterface
                  public void print(String html, String title) {
                      runOnUiThread(() -> doPrint(html, title));
                  }
              }
          }
