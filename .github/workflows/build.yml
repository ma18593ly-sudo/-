          .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
          .kpi{background:var(--card2);border-radius:12px;padding:8px;text-align:center}
          .kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--muted)}
          .warnbox{background:var(--dangerBg);color:var(--danger);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;margin-top:8px;white-space:pre-wrap}
          .okbox{background:var(--offBg);color:var(--off);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;margin-top:8px}
          .tbl{width:100%;border-collapse:collapse;font-size:12px}
          .tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
          .tbl th{color:var(--muted);font-weight:700}
          .tbl td:first-child,.tbl th:first-child{text-align:start}
          .scrollx{overflow-x:auto}
          .mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
          .mnav b{font-size:16px}
          .lvl{display:flex;gap:4px;margin:6px 0}.lvl i{flex:1;height:6px;border-radius:3px;background:var(--card2)}.lvl i.on{background:var(--danger)}
          .c{aspect-ratio:auto;min-height:52px;padding:2px 0;gap:1px}
          .c .mk{display:flex;gap:1px;align-items:center;justify-content:center;height:11px;font-size:9px;line-height:1}
          .c .mk .mkd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--danger)}
          .ib{position:relative}
          .bdg{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;border-radius:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px;text-align:center}
          .hbtns{display:flex;gap:8px}
          /* ===== Glass theme (v4.1) ===== */
          :root{--bg:transparent;--card:rgba(20,14,52,.38);--card2:rgba(255,255,255,.08);--line:rgba(255,255,255,.2);--text:#fff;--muted:rgba(255,255,255,.74);
          --accent:#c4b5fd;color-scheme:dark;--day:#fcd34d;--dayBg:rgba(251,191,36,.26);--night:#c7d2fe;--nightBg:rgba(129,140,248,.32);--off:#6ee7b7;--offBg:rgba(52,211,153,.24);--danger:#fda4af;--dangerBg:rgba(244,63,94,.32);
          --blur:blur(22px) saturate(1.3);--shadow:inset 0 1px 0 rgba(255,255,255,.22),0 18px 36px -22px rgba(0,0,0,.55)}
          body{background:radial-gradient(circle at 85% 6%,#7c3aed 0,transparent 46%),radial-gradient(circle at 6% 42%,#0ea5e9 0,transparent 42%),radial-gradient(circle at 72% 92%,rgba(190,18,60,.55) 0,transparent 44%),#0b1026;background-attachment:fixed;min-height:100vh}
          body:not(.light){color-scheme:dark}
          body.light{color-scheme:light;--card:rgba(255,255,255,.55);--card2:rgba(255,255,255,.42);--line:rgba(255,255,255,.9);--text:#1e1b4b;--muted:#5b5680;--accent:#6d28d9;
          --day:#b45309;--dayBg:rgba(251,191,36,.3);--night:#4338ca;--nightBg:rgba(129,140,248,.3);--off:#047857;--offBg:rgba(52,211,153,.28);--danger:#e11d48;--dangerBg:rgba(244,63,94,.18);
