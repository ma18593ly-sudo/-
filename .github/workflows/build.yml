            let h=`<div class="card"><h3>🔄 ${t('rotBoard')}</h3><div class="scrollx"><table class="tbl" style="font-size:11px"><tr><th></th>${ks.map(k=>`<th data-day="${k}" style="cursor:pointer;${k===ymd(now)?'color:var(--accent)':''}">${SDAYS[L()][parse(k).getDay()].slice(0,3)}<br>${parse(k).getDate()}</th>`).join('')}</tr>`;
            [0,1,2].forEach(tm=>{const sp=supOf(tm);h+=`<tr><td style="white-space:nowrap"><b>${esc(teamName(tm))}</b>${sp?'<br><span class="muted">'+esc(pName(sp.id))+'</span>':''}</td>`+ks.map(k=>{const ty=teamShift(tm,k);return `<td class="${ty}-b" style="padding:4px 1px">${ty==='O'?'·':ICO[ty]}</td>`;}).join('')+'</tr>';});
            const A=ymd(new Date(now.getFullYear(),now.getMonth(),1)),B=ymd(new Date(now.getFullYear(),now.getMonth()+1,0));
            return h+`</table></div><div class="muted" style="margin-top:6px">${t('hoursMonth')}: ${[0,1,2].map(tm=>teamName(tm)+' '+kRange(A,B).filter(k=>teamShift(tm,k)!=='O').length*12+t('hS')).join(' · ')}</div></div>`;}
          function shortCard(){const sd=shortDays(ymd(now),kAdd(ymd(now),7));if(!sd.length)return '';return `<div class="card"><h3>${t('upShort')}</h3>`+sd.map(x=>{const miss=[].concat(...x.sites.map(s=>s.absent.filter(p=>!s.asg.some(a=>a.for===p.id)).map(p=>pName(p.id))));
            return `<div class="item" data-day="${x.k}" style="cursor:pointer"><div class="h"><span>${ICO[x.type]} ${fmtK(x.k)} — ${esc(teamFull(x.team))}</span><span class="pill" style="background:var(--dangerBg);color:var(--danger)">${t('needs')} ${x.short}</span></div>${miss.length?`<div class="b">❌ ${miss.map(esc).join('، ')}</div>`:''}</div>`;}).join('')+'</div>';}
          function rHomePM(){const v=$('v-home');let h=`<div class="phead"><div class="av">🧭</div><div><div class="nm">${esc(C().myName||t('modePM'))}</div><div class="muted">${t('modePM')} · ${fmt(now)}</div></div></div>`;
            h+=kpiGrid()+dueAlerts()+rotBoard()+shortCard();
