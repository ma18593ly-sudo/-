          person:'الشخص',coversFor:'يغطي عن',swapWith:'بدّل مع',from:'من',to:'إلى',date:'التاريخ',note:'ملاحظة',noEvents:'ما فيه شي مسجّل',
          period:'الفترة',thisMonth:'هذا الشهر',lastMonth:'الشهر الماضي',custom:'مخصص',generate:'إنشاء التقرير',copy:'📋 نسخ',share:'📤 مشاركة',print:'🖨️ طباعة / PDF',copied:'تم النسخ',
          include:'يشمل',secShifts:'ملخص وردياتي',secIncidents:'الحوادث',secCards:'استلام وتسليم البطاقات',secTeam:'غياب وتغطيات وتبديل وإجازات',secNotes:'ملاحظات التسليم',secLogs:'تغيير السجلات',
          shifts:'وردية',hours:'ساعة',nothing:'لا يوجد',total:'المجموع',report:'تقرير',
