              <div class="btns"><button class="btn sm" id="fAll">✓ ${t('received')} = ${C().cards}</button><button class="btn sm" id="fAllH">✓ ${t('handed')} = ${C().cards}</button></div>
              <div id="mmBox" style="display:${mm?'block':'none'}"><div class="alert" style="margin:10px 0 0">${t('mismatch')}</div><label>${t('mismatchNote')}</label><input id="fCN" value="${esc(g.cardNote)}"></div></div>`;
            if(logSel.type==='N')h+=`<div class="card"><h3>📒 ${t('logChange')} <span class="muted">${C().logFrom}–${C().logTo}</span></h3>
              <label class="chk"><input type="checkbox" id="fVis" ${g.vis?'checked':''}>${t('visitorsLog')}</label>
              <label class="chk"><input type="checkbox" id="fWrk" ${g.wrk?'checked':''}>${t('workersLog')}</label></div>`;
            h+=`<div class="card"><h3>📝 ${t('handNotes')}</h3><textarea id="fNotes" placeholder="${t('handNotesPh')}">${esc(g.notes)}</textarea></div>`;
            h+=`<div class="card"><h3>🚨 ${t('incidents')} <button class="btn sm pri" id="fInc">${t('addIncident')}</button></h3>`;
            h+=g.inc.length?g.inc.map(x=>`<div class="item"><div class="h"><span>${esc(x.time)} · ${t('inc_'+x.type)}</span><button class="btn sm dang" data-delinc="${x.id}">${t('del')}</button></div><div class="b">${esc(x.desc)}${x.action?'\n↳ '+esc(x.action):''}</div></div>`).join(''):`<div class="empty-msg">${t('nothing')}</div>`;
            h+='</div>';v.innerHTML=h;
            $('lP').onclick=()=>{logSel=myShiftStep(logSel.date,logSel.type,-1);rLog();};
            $('lN').onclick=()=>{logSel=myShiftStep(logSel.date,logSel.type,1);rLog();};
            const num=x=>x===''?null:Math.max(0,parseInt(x,10)||0);
            const upMM=()=>{const m=g.recv!=null&&g.hand!=null&&g.recv!==g.hand||g.recv!=null&&g.recv!==+C().cards;$('mmBox').style.display=m?'block':'none';};
            $('fRecv').oninput=e=>{g.recv=num(e.target.value);save();upMM();};
            $('fHand').oninput=e=>{g.hand=num(e.target.value);save();upMM();};
            $('fAll').onclick=()=>{g.recv=+C().cards;$('fRecv').value=g.recv;save();upMM();toast(t('saved'));};
            $('fAllH').onclick=()=>{g.hand=+C().cards;$('fHand').value=g.hand;save();upMM();toast(t('saved'));};
            $('fCN').oninput=e=>{g.cardNote=e.target.value;save();};
            if($('fVis')){$('fVis').onchange=e=>{g.vis=e.target.checked;save();};$('fWrk').onchange=e=>{g.wrk=e.target.checked;save();};}
            $('fNotes').oninput=e=>{g.notes=e.target.value;save();};
          EOF_FILE

